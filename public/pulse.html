<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dorcey · Revenue Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1f3a; --navy-2:#16294b; --gold:#c9a14a; --gold-soft:#e7d3a1;
    --parchment:#f6f1e4; --ink:#1b1b1b; --muted:#7d7666; --line:#e3dcc9;
    --up:#2f7d57; --down:#b04a3a; --shadow:0 16px 38px -22px rgba(15,31,58,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Libre Franklin",system-ui,sans-serif;background:var(--parchment);color:var(--ink)}

  /* Top nav bar for jumping between admin / dashboard / pulse */
  .topnav{background:#0a1732;display:flex;justify-content:center;gap:2px;padding:0;
    border-bottom:1px solid rgba(201,161,74,.25)}
  .topnav a{flex:1;max-width:180px;text-align:center;padding:12px 8px;
    color:#c7cfdd;text-decoration:none;font:600 .82rem "Libre Franklin",sans-serif;
    letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;
    transition:background .15s,color .15s,border-color .15s}
  .topnav a:hover{background:#132849;color:#e7d3a1}
  .topnav a.active{color:#c9a14a;border-bottom-color:#c9a14a;background:#132849}
  .topnav a .ico{display:block;font-size:1.05rem;margin-bottom:2px}

  header.masthead{background:linear-gradient(155deg,var(--navy),var(--navy-2));color:var(--parchment);
    padding:24px 28px;border-bottom:3px solid var(--gold)}
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;margin:.15rem 0 .1rem;font-size:1.7rem}
  .masthead .sub{color:#c7cfdd;font-size:.88rem}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .loading{padding:80px;text-align:center;color:var(--muted)}

  /* KPI cards ---------------------------------------------------------- */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .kpi .k{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .v{font-family:"Playfair Display",serif;font-size:1.7rem;color:var(--navy);line-height:1.1;margin-top:4px}
  .kpi .d{font-size:.78rem;margin-top:3px}
  .up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}.flat{color:var(--muted)}

  /* Thermometer -------------------------------------------------------- */
  .thermo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 20px;
    box-shadow:var(--shadow);margin-bottom:22px}
  .thermo .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .thermo .goal{font-weight:700;color:var(--navy)}
  .thermo .bar{height:16px;background:#f5efdd;border-radius:9px;overflow:hidden;position:relative}
  .thermo .fill{height:100%;background:linear-gradient(90deg,var(--gold),#e0b959);
    transition:width .6s ease-out}
  .thermo .fill.over{background:linear-gradient(90deg,var(--up),#4aa87a)}
  .thermo .marks{position:relative;height:14px;margin-top:4px;font-size:.68rem;color:var(--muted)}
  .thermo .mark{position:absolute;transform:translateX(-50%)}
  .thermo .pace{margin-top:6px;font-size:.85rem;color:var(--muted)}
  .thermo .pace b{color:var(--navy)}

  /* Section chrome ----------------------------------------------------- */
  .section{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:18px 20px;margin-bottom:22px}
  .section h2{font-family:"Playfair Display",serif;color:var(--navy);margin:0 0 6px;font-size:1.15rem;
    border-bottom:1px solid var(--line);padding-bottom:6px;display:flex;align-items:center;justify-content:space-between}
  .section h2 .hint{font-family:"Libre Franklin",sans-serif;font-size:.72rem;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}

  /* Two-column grid used by weekly + attorney/dept blocks */
  .cols{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}
  .cols .col + .col{border-left:1px dashed var(--line);padding-left:22px}

  /* Weekly trend bars */
  .weeks{display:flex;align-items:flex-end;gap:6px;height:150px;margin-top:14px}
  .weeks .w{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;cursor:default}
  .weeks .w .bar{width:100%;background:var(--gold);border-radius:5px 5px 0 0;transition:height .5s ease-out;
    min-height:2px;position:relative}
  .weeks .w .lbl{font-size:.65rem;color:var(--muted);margin-top:5px;transform:rotate(-30deg);white-space:nowrap;
    transform-origin:right center;height:20px}
  .weeks .w .tip{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--navy);
    color:#fff;padding:4px 8px;border-radius:6px;font-size:.72rem;white-space:nowrap;opacity:0;pointer-events:none;
    transition:opacity .15s}
  .weeks .w:hover .tip{opacity:1}

  /* Ranked lists */
  .rank{margin-top:8px}
  .rank .r{display:flex;justify-content:space-between;padding:7px 4px;border-bottom:1px dashed var(--line);
    font-size:.92rem}
  .rank .r:last-child{border-bottom:0}
  .rank .r.clickable{cursor:pointer}
  .rank .r.clickable:hover{background:#faf7ef;border-radius:6px}
  .rank .r.selected{background:#fbf3da;border-left:3px solid var(--gold);padding-left:8px}
  .rank .r .lbl{flex:1;color:var(--ink)}
  .rank .r .v{font-weight:700;color:var(--navy);margin-left:12px}
  .rank .r .d{font-size:.7rem;color:var(--muted);text-align:right;min-width:60px}

  /* Filter pill */
  .filter-pill{display:inline-flex;align-items:center;gap:6px;background:var(--gold);color:var(--navy);
    padding:5px 11px;border-radius:20px;font-size:.78rem;font-weight:600;margin-left:8px;cursor:pointer}
  .filter-pill .x{font-size:1rem;line-height:1;font-weight:700}

  /* View toggle */
  .toggle{display:inline-flex;background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:3px}
  .toggle button{border:0;background:transparent;padding:6px 12px;border-radius:7px;cursor:pointer;
    font:600 .75rem "Libre Franklin",sans-serif;color:var(--muted)}
  .toggle button[aria-selected="true"]{background:var(--navy);color:#fff}

  /* Recent big clients strip */
  .strip{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:.85rem;display:flex;align-items:center;gap:8px}
  .chip .amt{font-weight:700;color:var(--navy)}
  .chip .date{color:var(--muted);font-size:.72rem}

  /* Refund spotlight */
  .refund{background:linear-gradient(120deg,#fdefe8,#f7d9cc);border:1px solid #e8b8a2;
    color:#7a2f0f;border-radius:14px;padding:16px 20px;margin-bottom:22px;
    display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .refund .icon{font-size:1.6rem}
  .refund .body{flex:1}
  .refund .body b{display:block;font-size:1rem;color:#7a2f0f}
  .refund .body small{color:#8a4020}

  @media(max-width:900px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
    .cols .col + .col{border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:22px;margin-top:6px}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <a href="/admin"><span class="ico">⚙️</span>Admin</a>
    <a href="/dashboard"><span class="ico">📊</span>Dashboard</a>
    <a href="/pulse" class="active"><span class="ico">💰</span>Pulse</a>
  </nav>
  <header class="masthead">
    <div class="eyebrow">Dorcey Law Firm · Revenue Pulse</div>
    <h1>How's the year going?</h1>
    <div class="sub" id="periodLabel">Loading revenue…</div>
  </header>

  <div class="wrap">
    <div id="content"><div class="loading">Fetching the numbers…</div></div>
  </div>

<script>
// ---------------------------------------------------------------------------
// Config
// ---------------------------------------------------------------------------
const CONFIG = {
  yearGoal: 5000000,        // $5M annual revenue target — adjust if plans change
  colWEEK: "REPORT WEEK",
  colDATE: "PAY DATE",
  colAMOUNT: "TOTAL",
  colREVSTREAM: "NEW MATTER",  // sits inside the Revenue Streams range
  colREVSEGMENT: "TRUST FUNDING", // sits inside Revenue Segments range
  colCLIENT: "NAME",           // client's family name for the recent-big-clients strip
  colATTY: "MOD ATTORNEY"      // attribution to attorney
};

// Column groups so we can auto-detect which columns belong to which "family."
// We aggregate every column between START and END (inclusive) as members of that group.
const GROUPS = {
  streams: { start: "NEW MATTER", end: "APP" },
  segments: { start: "TRUST FUNDING", end: "APP.1" }, // handle duplicate name in headers
  attorneys: [
    "PAID DORCEY","PAID SCOTT","PAID JOHNSON","PAID SAJDAK","PAID DODSON","PAID BUTCHER","PAID CAHOONE","PAID MICHIGAN"
  ],
  practiceCategories: [
    "PAID EST PLAN","PAID BIZ PLAN","PAID EL","PAID PROB","PAID TA","PAID ADV PLAN","PAID PRE-NUP","PAID APP","PAID GUNTRUST","PAID EQUINE"
  ]
};

// Client-side state --------------------------------------------------------
let ROWS = [];       // raw JSON rows
let HEADERS = [];    // header row (used for group range detection)
let ROWS_2025 = [];  // prior-year rows (2025)
let compareYoY = false;   // toggled per-section
let filter = null;   // { field: "REVENUE_STREAM"|"ATTORNEY"|"CATEGORY", value: string }

// ---------------------------------------------------------------------------
// Feed helpers
// ---------------------------------------------------------------------------

// Accepts either { rows: [...] } or { entries: [...] } from the Apps Script.
// If the feed doesn't supply an explicit headers array, we derive it by
// walking every row and collecting the union of keys in the order they first
// appear. That way column-range logic (streams/segments) still works.
function extractRowsAndHeaders(feed){
  const raw = Array.isArray(feed.rows) ? feed.rows
            : Array.isArray(feed.entries) ? feed.entries
            : [];
  let headers = Array.isArray(feed.headers) ? feed.headers.slice() : [];
  if(!headers.length){
    const seen = new Set();
    for(const row of raw){
      for(const key of Object.keys(row)){
        if(!seen.has(key)){ seen.add(key); headers.push(key); }
      }
    }
  }
  return { rows: raw, headers };
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
load();

async function load(){
  try{
    const r = await fetch("/api/revenue-feed");
    if(!r.ok) throw new Error("feed returned " + r.status);
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    const { rows, headers } = extractRowsAndHeaders(j);
    HEADERS = headers;
    ROWS = rows.map(normalizeRow);
    // 2025 fetch is best-effort; a failure just disables the YoY toggle.
    try{
      const r25 = await fetch("/api/revenue-feed?tab=2025");
      if(r25.ok){
        const j25 = await r25.json();
        if(!j25.error){
          const { rows: r25rows } = extractRowsAndHeaders(j25);
          ROWS_2025 = r25rows.map(normalizeRow);
        }
      }
    }catch(e){ /* ignore */ }
    render();
  }catch(e){
    document.getElementById("content").innerHTML =
      `<div class="loading">Couldn't reach the revenue feed. (${e.message})</div>`;
  }
}

// Normalize numeric-looking strings into real numbers so downstream math works.
function normalizeRow(row){
  const out = {};
  for(const k of Object.keys(row)){
    const v = row[k];
    if(v === "" || v == null){ out[k] = null; continue; }
    // Strip $ and commas, then check if it parses cleanly.
    if(typeof v === "string"){
      const cleaned = v.replace(/[$,]/g,"").trim();
      if(cleaned !== "" && !isNaN(+cleaned)) { out[k] = +cleaned; continue; }
    }
    out[k] = v;
  }
  return out;
}

// ---------------------------------------------------------------------------
// Group / column detection
// ---------------------------------------------------------------------------

// Get the ordered list of column names that fall between two header names,
// inclusive. Handles the fact that some headers repeat by using first occurrence.
function columnsInRange(startName, endName){
  const start = HEADERS.indexOf(startName);
  const end = HEADERS.indexOf(endName);
  if(start === -1 || end === -1 || end < start) return [];
  return HEADERS.slice(start, end+1).filter(h => h && !h.startsWith("Unnamed"));
}

function streamColumns(){ return columnsInRange(GROUPS.streams.start, GROUPS.streams.end); }
function segmentColumns(){ return columnsInRange(GROUPS.segments.start, GROUPS.segments.end); }

// ---------------------------------------------------------------------------
// Filtering
// ---------------------------------------------------------------------------

// Returns TRUE if the row is included given the currently active filter.
function passesFilter(row){
  if(!filter) return true;
  const v = row[filter.value];
  return typeof v === "number" && v > 0;
}

function filteredRows(rows){
  return rows.filter(passesFilter);
}

// Amount for a row respecting the active filter — if we're filtering by a
// specific stream/segment/attorney/category, the "amount" for KPIs & trends
// becomes JUST that column's value on that row, not the TOTAL.
function rowAmount(row){
  if(filter) return +row[filter.value] || 0;
  return +row[CONFIG.colAMOUNT] || 0;
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function render(){
  const rows = filteredRows(ROWS);
  const rows25 = filteredRows(ROWS_2025);
  document.getElementById("periodLabel").textContent =
    `Through ${latestReportWeek(rows) || "—"} · ${rows.length} paid entries so far`;

  const html = [
    kpiSection(rows, rows25),
    thermoSection(rows),
    filterPillHtml(),
    refundSpotlight(rows),
    weeklyAndRecentSection(rows, rows25),
    streamsAndSegmentsSection(rows, rows25),
    attorneysAndCategoriesSection(rows, rows25),
  ].join("");
  document.getElementById("content").innerHTML = html;
  wireInteractions();
}

// KPI row ------------------------------------------------------------------
function kpiSection(rows, rows25){
  const total = sum(rows.map(rowAmount));
  const paid = rows.filter(r => rowAmount(r) > 0).length;
  const avg = paid ? total/paid : 0;
  const weeks = uniqueWeeks(rows).length;
  const pace = weeks ? total/weeks : 0;
  // 2025-through-same-week comparison
  const throughWeek = weeks;
  const rows25CutOff = rowsThroughWeek(rows25, throughWeek);
  const total25 = sum(rows25CutOff.map(rowAmount));
  const yoyPct = total25 > 0 ? ((total - total25)/total25) * 100 : null;

  const yoyLabel = yoyPct === null ? "" :
    `<span class="${yoyPct>=0?'up':'down'}">${yoyPct>=0?'▲':'▼'} ${Math.abs(yoyPct).toFixed(1)}% vs 2025</span>`;

  return `<div class="kpis">
    <div class="kpi"><div class="k">${filter?'Filtered ':''}Revenue YTD</div>
      <div class="v">${dollars(total)}</div><div class="d">${yoyLabel || '&nbsp;'}</div></div>
    <div class="kpi"><div class="k">Paid entries</div>
      <div class="v">${paid.toLocaleString()}</div><div class="d flat">${weeks} weeks tracked</div></div>
    <div class="kpi"><div class="k">Avg per entry</div>
      <div class="v">${dollars(avg)}</div><div class="d flat">across all paid</div></div>
    <div class="kpi"><div class="k">Weekly pace</div>
      <div class="v">${dollars(pace)}</div><div class="d flat">running average</div></div>
    <div class="kpi"><div class="k">Projected annual</div>
      <div class="v">${dollars(pace * 52)}</div><div class="d flat">at current pace</div></div>
  </div>`;
}

// Filter pill --------------------------------------------------------------
function filterPillHtml(){
  if(!filter) return "";
  return `<div style="margin:0 2px 14px">
    <span class="filter-pill" id="clearFilter">
      Filtered by ${filter.value} <span class="x">×</span>
    </span>
    <span style="color:var(--muted);font-size:.82rem;margin-left:8px">
      Showing only entries with revenue in this column. Click × to clear.
    </span>
  </div>`;
}

// Goal thermometer ---------------------------------------------------------
function thermoSection(rows){
  // Thermometer always shows firm-wide TOTAL, ignoring filter (goal is firm-level).
  const total = sum(ROWS.map(r => +r[CONFIG.colAMOUNT] || 0));
  const pct = Math.min(1.5, total / CONFIG.yearGoal); // cap fill at 150%
  const pctLabel = ((total / CONFIG.yearGoal)*100).toFixed(1);
  const weeks = uniqueWeeks(ROWS).length;
  const expectedByNow = CONFIG.yearGoal * (weeks/52);
  const paceLabel = total >= expectedByNow
    ? `You're <b>ahead of pace</b> by ${dollars(total - expectedByNow)}.`
    : `You're <b>behind pace</b> by ${dollars(expectedByNow - total)}.`;
  return `<div class="thermo">
    <div class="row">
      <div class="goal">${dollars(total)} of ${dollars(CONFIG.yearGoal)} annual goal</div>
      <div style="font-weight:700;color:var(--navy)">${pctLabel}%</div>
    </div>
    <div class="bar"><div class="fill ${pct>1?'over':''}" style="width:${Math.min(100, pct*100)}%"></div></div>
    <div class="pace">${paceLabel} · Through ${weeks} weeks (${((weeks/52)*100).toFixed(0)}% of the year).</div>
  </div>`;
}

// Refund spotlight ---------------------------------------------------------
function refundSpotlight(rows){
  const refunds = rows.filter(r => rowAmount(r) < 0);
  if(!refunds.length) return "";
  const total = sum(refunds.map(rowAmount));
  const latest = refunds.sort((a,b) => (b[CONFIG.colDATE]||"").localeCompare(a[CONFIG.colDATE]||""))[0];
  return `<div class="refund">
    <div class="icon">⚠️</div>
    <div class="body">
      <b>${refunds.length} refund${refunds.length>1?'s':''} totaling ${dollars(Math.abs(total))} this year</b>
      <small>Most recent: ${dollars(Math.abs(rowAmount(latest)))} on ${latest[CONFIG.colDATE] || 'unknown date'}</small>
    </div>
  </div>`;
}

// Weekly trend + recent big clients ---------------------------------------
function weeklyAndRecentSection(rows, rows25){
  const weekly = weeklyTotals(rows);
  const weekly25 = weeklyTotals(rows25);
  const weeks = weekly.slice(-16); // show last 16 weeks
  const maxV = Math.max(1, ...weeks.map(w => w.total));

  const bars = weeks.map(w => {
    const h = (w.total / maxV) * 130;
    return `<div class="w" title="${w.week}: ${dollars(w.total)}">
      <span class="tip">${w.week}: ${dollars(w.total)}</span>
      <div class="bar" style="height:${h}px"></div>
      <span class="lbl">${w.week}</span>
    </div>`;
  }).join("");

  // Recent big paid entries (top 8 by amount from the most recent 4 weeks)
  const recentWeeks = weekly.slice(-4).map(w => w.week);
  const recent = rows.filter(r => recentWeeks.includes(r[CONFIG.colWEEK]) && rowAmount(r) > 0)
    .sort((a,b) => rowAmount(b) - rowAmount(a)).slice(0, 8);
  const chips = recent.map(r => `<span class="chip">
    <span class="amt">${dollars(rowAmount(r))}</span>
    <span>${r[CONFIG.colCLIENT] || '—'}</span>
    <span class="date">${r[CONFIG.colDATE] || ''}</span>
  </span>`).join("");

  return `<div class="section">
    <h2>Weekly momentum <span class="hint">Last 16 weeks · hover for detail</span></h2>
    <div class="weeks">${bars}</div>
  </div>
  <div class="section">
    <h2>Recent big paid entries <span class="hint">Last 4 weeks · top 8</span></h2>
    <div class="strip">${chips || '<div style="color:var(--muted)">Nothing yet in the recent window.</div>'}</div>
  </div>`;
}

// Streams + Segments -------------------------------------------------------
function streamsAndSegmentsSection(rows, rows25){
  return `<div class="section">
    <h2>Revenue streams &nbsp;·&nbsp; Revenue segments <span class="hint">Click any row to filter the whole page</span></h2>
    <div class="cols">
      <div class="col">${rankedListBlock("Streams", streamColumns(), rows, rows25, "STREAM")}</div>
      <div class="col">${rankedListBlock("Segments", segmentColumns(), rows, rows25, "SEGMENT")}</div>
    </div>
  </div>`;
}

// Attorneys + Categories ---------------------------------------------------
function attorneysAndCategoriesSection(rows, rows25){
  return `<div class="section">
    <h2>By attorney &nbsp;·&nbsp; By practice category <span class="hint">Click any row to filter the whole page</span></h2>
    <div class="cols">
      <div class="col">${rankedListBlock("Attorneys", GROUPS.attorneys, rows, rows25, "ATTORNEY")}</div>
      <div class="col">${rankedListBlock("Categories", GROUPS.practiceCategories, rows, rows25, "CATEGORY")}</div>
    </div>
  </div>`;
}

// Ranked-list helper: builds a sortable, filterable list with YoY toggle.
function rankedListBlock(title, columns, rows, rows25, kind){
  const totals = columns.map(col => ({
    col,
    total: sum(rows.map(r => +r[col] || 0)),
    total25: sum(rows25.map(r => +r[col] || 0)),
  })).sort((a,b) => b.total - a.total);

  const grand = sum(totals.map(t => t.total));

  const rowsHtml = totals.map(t => {
    const pct = grand > 0 ? ((t.total/grand)*100).toFixed(1) : "0.0";
    const yoy = (compareYoY && t.total25 > 0) ? (((t.total - t.total25)/t.total25)*100).toFixed(1) : null;
    const yoyTag = yoy === null ? "" :
      `<span class="d ${yoy>=0?'up':'down'}">${yoy>=0?'▲':'▼'} ${Math.abs(yoy)}%</span>`;
    const selected = (filter && filter.value === t.col) ? " selected" : "";
    return `<div class="r clickable${selected}" data-kind="${kind}" data-col="${t.col}">
      <span class="lbl">${prettyLabel(t.col)}</span>
      <span class="v">${dollars(t.total)}</span>
      <span class="d">${pct}%</span>
      ${yoyTag}
    </div>`;
  }).join("");

  const toggle = ROWS_2025.length ? `<div class="toggle" style="float:right">
    <button data-yoy="off" aria-selected="${!compareYoY}">This year</button>
    <button data-yoy="on" aria-selected="${compareYoY}">vs 2025</button>
  </div>` : "";

  return `<div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <b style="color:var(--navy)">${title}</b>
      ${toggle}
    </div>
    <div class="rank">${rowsHtml}</div>
  </div>`;
}

// ---------------------------------------------------------------------------
// Interactions
// ---------------------------------------------------------------------------

function wireInteractions(){
  // Row click -> apply filter
  document.querySelectorAll(".rank .r.clickable").forEach(el => {
    el.onclick = () => {
      const col = el.getAttribute("data-col");
      const kind = el.getAttribute("data-kind");
      if(filter && filter.value === col){ filter = null; }
      else { filter = { field: kind, value: col }; }
      render();
    };
  });
  // Filter pill clear
  const pill = document.getElementById("clearFilter");
  if(pill) pill.onclick = () => { filter = null; render(); };
  // YoY toggle buttons
  document.querySelectorAll(".toggle button[data-yoy]").forEach(b => {
    b.onclick = () => { compareYoY = (b.getAttribute("data-yoy") === "on"); render(); };
  });
}

// ---------------------------------------------------------------------------
// Data helpers
// ---------------------------------------------------------------------------

function sum(arr){ return arr.reduce((s,v) => s + (+v||0), 0); }

function uniqueWeeks(rows){
  const s = new Set();
  for(const r of rows){ if(r[CONFIG.colWEEK]) s.add(r[CONFIG.colWEEK]); }
  return Array.from(s);
}

// Weekly totals (respecting the current filter for amounts)
function weeklyTotals(rows){
  const map = new Map();
  for(const r of rows){
    const w = r[CONFIG.colWEEK]; if(!w) continue;
    map.set(w, (map.get(w) || 0) + rowAmount(r));
  }
  return Array.from(map, ([week, total]) => ({week, total}))
    .sort((a,b) => weekSortKey(a.week) - weekSortKey(b.week));
}

// Cheap week sort: assume week values sort lexicographically enough for display.
function weekSortKey(w){ return w; }

function latestReportWeek(rows){
  const weeks = uniqueWeeks(rows).sort();
  return weeks.length ? weeks[weeks.length-1] : null;
}

// For YoY: prior year rows through the same number of weeks.
function rowsThroughWeek(rows, weeksSoFar){
  const weeks = uniqueWeeks(rows).sort().slice(0, weeksSoFar);
  const set = new Set(weeks);
  return rows.filter(r => set.has(r[CONFIG.colWEEK]));
}

// Pretty-print column headers (strip PAID prefix, title-case).
function prettyLabel(col){
  const map = {
    "PAID DORCEY":"Josh Dorcey","PAID SCOTT":"Mike Scott","PAID JOHNSON":"Erica Johnson",
    "PAID SAJDAK":"Kara Sajdak","PAID DODSON":"Doug Dodson","PAID BUTCHER":"Brad Butcher",
    "PAID CAHOONE":"David Cahoone","PAID MICHIGAN":"Michigan team",
    "PAID EST PLAN":"Estate Planning","PAID BIZ PLAN":"Business Planning","PAID EL":"Employment Law",
    "PAID PROB":"Probate","PAID TA":"Trust Admin","PAID ADV PLAN":"Advanced Planning",
    "PAID PRE-NUP":"Pre-nup / Post-nup","PAID APP":"APP Membership","PAID GUNTRUST":"Gun Trust",
    "PAID EQUINE":"Equine",
  };
  return map[col] || col;
}

function dollars(n){
  const negative = n < 0;
  const abs = Math.abs(n);
  const rounded = abs >= 1000 ? Math.round(abs) : abs;
  const s = "$" + rounded.toLocaleString("en-US", {maximumFractionDigits: 0});
  return negative ? "-" + s : s;
}
