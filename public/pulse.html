<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dorcey · Revenue Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1d33; --navy-2:#1b2f4d; --gold:#c6a04e; --gold-soft:#e3cd97;
    --cream:#f7f3ea; --parchment:#f6f1e4; --ink:#2a2a2a; --muted:#7d7666;
    --line:#e7e0d2; --up:#2d6a4f; --down:#9b2335; --shadow:0 16px 38px -22px rgba(15,29,51,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Libre Franklin",system-ui,sans-serif;background:var(--parchment);color:var(--ink)}
  a{color:inherit}

  /* Top nav */
  .topnav{background:#0a1732;display:flex;justify-content:center;gap:2px;
    border-bottom:1px solid rgba(198,160,78,.25)}
  .topnav a{flex:1;max-width:180px;text-align:center;padding:12px 8px;
    color:#c7cfdd;text-decoration:none;font:600 .82rem "Libre Franklin",sans-serif;
    letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;
    transition:background .15s,color .15s,border-color .15s}
  .topnav a:hover{background:#132849;color:#e3cd97}
  .topnav a.active{color:var(--gold);border-bottom-color:var(--gold);background:#132849}
  .topnav a .ico{display:block;font-size:1.05rem;margin-bottom:2px}

  header.masthead{background:linear-gradient(155deg,var(--navy),var(--navy-2));color:var(--cream);
    padding:24px 28px;border-bottom:3px solid var(--gold)}
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;margin:.15rem 0 .1rem;font-size:1.7rem}
  .masthead .sub{color:#c7cfdd;font-size:.88rem}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .loading{padding:80px;text-align:center;color:var(--muted)}
  .error{padding:40px;text-align:center;color:var(--down);background:#fff;border-radius:14px;box-shadow:var(--shadow)}

  /* Filter pill */
  .filter-bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .filter-pill{display:inline-flex;align-items:center;gap:8px;background:var(--gold);color:var(--navy);
    padding:8px 14px;border-radius:22px;font-size:.85rem;font-weight:700;cursor:pointer;
    box-shadow:var(--shadow)}
  .filter-pill .x{font-size:1.15rem;line-height:1;font-weight:700}
  .filter-pill:hover{background:#dcbf7d}
  .filter-hint{color:var(--muted);font-size:.82rem}

  /* Headline row */
  .headline{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:22px}
  .headline .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
  .headline .stat.hero{background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#fff;border-color:var(--navy)}
  .headline .stat.hero .k{color:var(--gold-soft)}
  .headline .stat.hero .v{color:#fff}
  .headline .stat.hero .d{color:#c7cfdd}
  .headline .stat .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .headline .stat .v{font-family:"Playfair Display",serif;font-size:1.9rem;color:var(--navy);line-height:1.05;margin-top:5px}
  .headline .stat .d{font-size:.82rem;color:var(--muted);margin-top:4px}
  .headline .stat .d .up{color:var(--up);font-weight:700}
  .headline .stat .d .down{color:var(--down);font-weight:700}

  /* KPI row */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .k{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .v{font-family:"Playfair Display",serif;font-size:1.3rem;color:var(--navy);line-height:1.1;margin-top:3px}
  .kpi .d{font-size:.72rem;color:var(--muted);margin-top:2px}

  /* Thermometer */
  .thermo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;
    box-shadow:var(--shadow);margin-bottom:22px}
  .thermo .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .thermo .goal{font-weight:700;color:var(--navy);font-size:1rem}
  .thermo .pct{font-family:"Playfair Display",serif;font-size:1.4rem;color:var(--navy)}
  .thermo .bar{height:18px;background:#f0e8d3;border-radius:10px;overflow:hidden;position:relative}
  .thermo .fill{height:100%;background:linear-gradient(90deg,var(--gold),#dcbf7d);transition:width .6s ease-out}
  .thermo .fill.over{background:linear-gradient(90deg,var(--up),#4a9d70)}
  .thermo .pace-marker{position:absolute;top:-3px;height:24px;width:2px;background:var(--navy);opacity:.55}
  .thermo .pace-marker::after{content:"today's pace";position:absolute;top:-14px;left:4px;font-size:.62rem;color:var(--navy);white-space:nowrap;font-weight:600}
  .thermo .pace{margin-top:8px;font-size:.85rem;color:var(--muted)}
  .thermo .pace b{color:var(--navy)}

  /* Section chrome */
  .section{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:18px 22px;margin-bottom:22px}
  .section h2{font-family:"Playfair Display",serif;color:var(--navy);margin:0 0 4px;font-size:1.15rem;
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .section .sh{font:500 .78rem "Libre Franklin",sans-serif;color:var(--muted);margin:0 0 12px}

  /* Toggle chip */
  .togchip{display:inline-flex;background:var(--parchment);border:1px solid var(--line);border-radius:9px;padding:3px}
  .togchip button{border:0;background:transparent;padding:6px 12px;border-radius:6px;cursor:pointer;
    font:600 .75rem "Libre Franklin",sans-serif;color:var(--muted)}
  .togchip button[aria-selected="true"]{background:var(--navy);color:#fff}
  .togwrap{display:flex;gap:8px;flex-wrap:wrap}

  /* Composition strip */
  .comp{display:flex;height:36px;border-radius:10px;overflow:hidden;border:1px solid var(--line);cursor:pointer}
  .comp .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;
    min-width:24px;padding:0 6px;text-shadow:0 1px 2px rgba(0,0,0,.2);transition:opacity .15s}
  .comp .seg:hover{opacity:.85}
  .comp-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.78rem}
  .comp-legend .item{display:flex;align-items:center;gap:6px;color:var(--ink)}
  .comp-legend .swatch{width:12px;height:12px;border-radius:3px}
  .comp-legend .amt{color:var(--muted);margin-left:4px}

  /* Two- and three-column grids */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .cols .col + .col{border-left:1px dashed var(--line);padding-left:22px}
  .cols3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:22px}
  .cols3 .col + .col{border-left:1px dashed var(--line);padding-left:22px}

  /* Monthly bars */
  .months{display:flex;align-items:flex-end;gap:8px;height:180px;margin-top:14px;padding-bottom:20px}
  .months .m{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
  .months .m .bars{width:100%;display:flex;gap:2px;align-items:flex-end;height:150px}
  .months .m .bar{flex:1;border-radius:4px 4px 0 0;transition:height .5s ease-out;min-height:2px}
  .months .m .bar.cur{background:var(--gold)}
  .months .m .bar.prev{background:#c7cfdd}
  .months .m .lbl{font-size:.7rem;color:var(--muted);margin-top:6px;font-weight:600}
  .months .m .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:6px 10px;border-radius:6px;font-size:.72rem;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
  .months .m:hover .tip{opacity:1}
  .months-legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:-8px;justify-content:flex-end;flex-wrap:wrap}
  .months-legend .item{display:flex;align-items:center;gap:6px}
  .months-legend .swatch{width:14px;height:12px;border-radius:2px}

  /* Stacked monthly bars (client mix) */
  .months .m .sbar{width:70%;max-width:34px;display:flex;flex-direction:column-reverse;
    border-radius:4px 4px 0 0;overflow:hidden}
  .months .m .sbar .sseg{width:100%}

  /* Ranked lists */
  .rank{margin-top:6px}
  .rank .r{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;
    border-bottom:1px dashed var(--line);font-size:.92rem;gap:10px;cursor:pointer;
    border-radius:6px;padding-left:8px;padding-right:8px;transition:background .12s}
  .rank .r:last-child{border-bottom:0}
  .rank .r:hover{background:var(--parchment)}
  .rank .r.static{cursor:default}
  .rank .r.static:hover{background:transparent}
  .rank .r.active{background:var(--gold-soft);border-left:3px solid var(--gold);padding-left:5px}
  .rank .r .lbl{flex:1;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .r .v{font-weight:700;color:var(--navy);white-space:nowrap}
  .rank .r .d{font-size:.72rem;color:var(--muted);text-align:right;min-width:50px;white-space:nowrap}
  .rank .r .files{font-size:.7rem;color:#999;margin-left:6px}
  .rank .more{font-size:.75rem;color:var(--muted);padding:8px;text-align:center}

  /* Recent big entries */
  .strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .chip{background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:.85rem;display:flex;align-items:center;gap:8px}
  .chip .amt{font-weight:700;color:var(--navy)}
  .chip .name{color:var(--ink)}
  .chip .date{color:var(--muted);font-size:.72rem}

  /* Refund spotlight */
  .refund{background:linear-gradient(120deg,#fdefe8,#f7d9cc);border:1px solid #e8b8a2;
    color:#7a2f0f;border-radius:14px;padding:16px 20px;margin-bottom:22px;
    display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .refund .icon{font-size:1.6rem}
  .refund .body{flex:1}
  .refund .body b{display:block;font-size:1rem;color:#7a2f0f}
  .refund .body small{color:#8a4020}

  /* Avg-fee matrix */
  .matrix-scroll{overflow-x:auto;margin-top:8px}
  table.matrix{border-collapse:collapse;width:100%;font-size:.82rem;min-width:640px}
  table.matrix th, table.matrix td{padding:8px 10px;text-align:right;border-bottom:1px dashed var(--line);white-space:nowrap}
  table.matrix th{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  table.matrix th:first-child, table.matrix td:first-child{text-align:left;position:sticky;left:0;background:#fff;max-width:190px;overflow:hidden;text-overflow:ellipsis}
  table.matrix td.mxcat{cursor:pointer;font-weight:600;color:var(--navy)}
  table.matrix tr:hover td{background:var(--parchment)}
  table.matrix tr:hover td:first-child{background:var(--parchment)}
  table.matrix tr.active td{background:var(--gold-soft)}
  table.matrix tr.active td:first-child{background:var(--gold-soft)}
  table.matrix .cnt{display:block;font-size:.66rem;color:#999;font-weight:400}
  table.matrix td.allcol, table.matrix th.allcol{border-left:1px solid var(--line);font-weight:700;color:var(--navy)}
  table.matrix tr.totrow td{border-top:2px solid var(--line);font-weight:700;color:var(--navy)}

  /* Grade bars */
  .grow{display:grid;grid-template-columns:170px 1fr 56px;gap:10px;align-items:center;
    padding:6px 0;border-bottom:1px dashed var(--line);font-size:.85rem}
  .grow:last-child{border-bottom:0}
  .grow .glbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
  .grow .gpct{text-align:right;font-weight:700;color:var(--navy);font-size:.8rem}
  .gbar{display:flex;height:16px;border-radius:8px;overflow:hidden;background:#f0e8d3}
  .gbar .gseg{height:100%}
  .glegend{display:flex;gap:14px;flex-wrap:wrap;font-size:.75rem;color:var(--muted);margin-bottom:10px}
  .glegend .item{display:flex;align-items:center;gap:6px}
  .glegend .swatch{width:12px;height:12px;border-radius:3px}

  /* Mix header chips */
  .mixchips{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .mixchip{background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:.85rem}
  .mixchip .amt{font-weight:700;color:var(--navy);display:block;font-size:1rem}
  .mixchip small{color:var(--muted)}

  .footer-note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:24px}
  .footer-note b{color:var(--navy)}

  @media(max-width:900px){
    .headline{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
    .cols .col + .col{border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:22px;margin-top:6px}
    .cols3{grid-template-columns:1fr}
    .cols3 .col + .col{border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:22px;margin-top:6px}
    .grow{grid-template-columns:110px 1fr 48px}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <a href="/admin"><span class="ico">⚙️</span>Admin</a>
    <a href="/dashboard"><span class="ico">📊</span>Dashboard</a>
    <a href="/pulse" class="active"><span class="ico">💰</span>Pulse</a>
  </nav>
  <header class="masthead">
    <div class="eyebrow">Dorcey Law Firm · Revenue Pulse</div>
    <h1>How's the year going?</h1>
    <div class="sub" id="periodLabel">Loading revenue…</div>
  </header>

  <div class="wrap">
    <div id="content"><div class="loading">Fetching the numbers…</div></div>
  </div>

<script>
// ---------------------------------------------------------------------------
// DORCEY REVENUE PULSE — live dashboard.
// July 2026 expansion: avg-fee matrix (category × attorney), refund
// diagnostics, referral-source dollars, top referrers, new-vs-existing
// client mix, and grade distribution. All sections respect the global
// click-to-filter. Source: /api/revenue-feed → the "2026 Clients" tab.
// ---------------------------------------------------------------------------

const CONFIG = {
  yearGoal: 7000000,
  year: 2026,
};

// Segment palette — the buckets money falls into after classify()
const SEG_COLORS = {
  "New-Matter":         "#c6a04e",
  "APP":                "#3f6184",
  "Registered Agent":   "#6e8aa6",
  "Title Pass-through": "#9aae8e",
  "Referral Income":    "#b07f5a",
};
const SEG_ORDER = ["New-Matter","APP","Registered Agent","Title Pass-through","Referral Income"];

// Grade palette — A is money, D is a problem.
const GRADE_COLORS = { "A":"#2d6a4f", "B":"#c6a04e", "C":"#d98e32", "D":"#9b2335", "F":"#6b1626" };
const GRADE_ORDER = ["A","B","C","D","F"];

// Client-mix palette
const MIX_COLORS = { "New":"#c6a04e", "Existing":"#3f6184", "Other":"#c7cfdd" };

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Attorney initials -> friendly name. DLF is the firm "house" (unassigned),
// NOT an individual attorney.
const ATTORNEY_NAMES = {
  "DLF": "House (Dorcey Law Firm)",
  "JOD": "Josh Dorcey",
  "MAS": "Mike Scott",
  "EDJ": "Erica Johnson",
  "KAS": "Kara Sajdak",
  "DAD": "Doug Dodson",
  "BWB": "Brad Butcher",
  "BHB": "Brian Bronsther",
  "DAC": "David Cahoone",
  "APP": "APP (bulk)"
};

// Client-side state
let ROWS = [];
let ROWS_2025 = [];

// UI state — persisted across renders
let viewMode = "blended";        // "blended" = all fees, "growth" = new-matter only
let filter   = null;             // {kind:"attorney"|"matter"|"segment"|"category"|"refsource", value:"..."}
let matrixYear = CONFIG.year;    // avg-fee matrix year toggle
let matrixRole = "clos";         // "clos" | "orig" — which attorney column the matrix uses

// ---------------------------------------------------------------------------
// Utility helpers
// ---------------------------------------------------------------------------

function cleanKey(k){
  return String(k).replace(/\s+/g," ").trim().replace(/\.$/,"");
}

function normalizeKeys(row){
  const out = {};
  for(const [k,v] of Object.entries(row)) out[cleanKey(k)] = v;
  return out;
}

function extractRows(feed){
  const raw = Array.isArray(feed.entries) ? feed.entries
            : Array.isArray(feed.rows)    ? feed.rows
            : [];
  return raw.map(normalizeKeys);
}

function num(v){
  if(v === null || v === undefined || v === "") return 0;
  if(typeof v === "number") return isFinite(v) ? v : 0;
  const cleaned = String(v).replace(/[$,\s]/g,"");
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : 0;
}

function usd0(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function usdK(n){
  const a = Math.abs(n);
  if(a >= 1000000) return (n<0?"-":"") + "$" + (a/1000000).toFixed(2) + "M";
  if(a >= 1000)    return (n<0?"-":"") + "$" + Math.round(a/1000) + "K";
  return usd0(n);
}

function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function monthIndex(row){
  const candidates = [row["_date"], row["Month"], row["Date Scheduled"]];
  for(const c of candidates){
    if(!c) continue;
    if(typeof c === "string"){
      const m = c.match(/^(\d{4})-(\d{2})/);
      if(m) return parseInt(m[2],10) - 1;
      const d = new Date(c);
      if(!isNaN(d)) return d.getUTCMonth();
    }
  }
  return null;
}

// Column readers — one place to define how we interpret the sheet's columns.
function catOf(row){ return String(row["Category"] || "").trim() || "Uncategorized"; }
function refSourceOf(row){ return String(row["Referral Source"] || "").trim() || "Unknown"; }
function refNameOf(row){ return String(row["Referral Name"] || "").trim(); }
function gradeOf(row){
  const g = String(row["Grade"] || "").trim().toUpperCase();
  if(!g) return null;
  const c = g[0];
  return GRADE_ORDER.includes(c) ? c : null;
}
function clientTypeBucket(row){
  const s = String(row["Client Type"] || "").trim().toLowerCase();
  if(!s) return "Other";
  if(s.includes("exist") || s.includes("return") || s.includes("repeat")) return "Existing";
  if(s.includes("new")) return "New";
  return "Other";
}

// Classifier — assigns each row to exactly one revenue bucket.
// Keyed on Matter + the "Payments" flag in Referral Name, NEVER on spelling
// (the sheet has a "Registed Agent" typo we handle explicitly).
function classify(row){
  const matter = String(row["Matter"] || "").trim();
  const client = String(row["Client"] || "").trim().toLowerCase();
  const ref    = String(row["Referral Name"] || "").trim().toLowerCase();
  const pooled = ref === "payments" || ref === "bulk payment";

  if(matter === "APP") return "APP";
  if(matter === "DLF Registered Agent" && pooled) return "Registered Agent";
  if(matter === "DLF Registed Agent"   && pooled) return "Registered Agent";
  if(client.includes("dorcey law firm title services")) return "Title Pass-through";
  if(matter === "Referral Fee") return "Referral Income";
  return "New-Matter";
}

function attorneyLabel(code){
  const c = String(code||"").trim().toUpperCase();
  return ATTORNEY_NAMES[c] || (c || "Unassigned");
}

// ---------------------------------------------------------------------------
// The FILTER — the whole page respects whatever's set
// ---------------------------------------------------------------------------

// Decide if a given row is included given the active filter.
function passesFilter(row){
  if(!filter) return true;
  const attO = String(row["Originating Attorney"]||"").trim().toUpperCase();
  const attC = String(row["Closing Attorney"]||"").trim().toUpperCase();
  const matter = String(row["Matter"]||"").trim();
  const seg = classify(row);
  if(filter.kind === "attorney")     return attO === filter.value || attC === filter.value;
  if(filter.kind === "attorney_orig")return attO === filter.value;
  if(filter.kind === "attorney_clos")return attC === filter.value;
  if(filter.kind === "matter")       return matter === filter.value;
  if(filter.kind === "segment")      return seg === filter.value;
  if(filter.kind === "category")     return catOf(row) === filter.value;
  if(filter.kind === "refsource")    return refSourceOf(row) === filter.value;
  return true;
}

// If we're in "growth" view, also exclude non-new-matter rows.
function passesViewMode(row){
  if(viewMode === "growth") return classify(row) === "New-Matter";
  return true;
}

function getWorkingRows(){
  return ROWS.filter(r => passesFilter(r) && passesViewMode(r));
}
function getWorkingRows25(){
  return ROWS_2025.filter(r => passesFilter(r) && passesViewMode(r));
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

load();

async function load(){
  try{
    const r = await fetch("/api/revenue-feed");
    if(!r.ok) throw new Error("feed returned " + r.status);
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    ROWS = extractRows(j);

    try{
      const r25 = await fetch("/api/revenue-feed?tab=2025");
      if(r25.ok){
        const j25 = await r25.json();
        if(!j25.error) ROWS_2025 = extractRows(j25);
      }
    }catch(e){ /* best-effort */ }

    render();
  }catch(e){
    document.getElementById("content").innerHTML =
      `<div class="error">Couldn't reach the revenue feed. (${e.message})</div>`;
    console.error("pulse load error:", e);
  }
}

// ---------------------------------------------------------------------------

function render(){
  const rows   = getWorkingRows();
  const rows25 = getWorkingRows25();
  const stats   = computeStats(rows);
  const stats25 = computeStats(rows25);

  const label = filter ? filterLabel() : `${CONFIG.year} · ${ROWS.length.toLocaleString()} paid entries`;
  document.getElementById("periodLabel").textContent = label;

  document.getElementById("content").innerHTML = [
    filterBar(),
    headlineSection(stats, stats25),
    kpiSection(stats),
    thermoSection(stats),
    refundSpotlight(stats),
    compositionSection(),
    monthlyTrendSection(stats, stats25),
    attorneyAndMatterSection(),
    avgFeeMatrixSection(),
    refundDiagnosticsSection(),
    referralSection(stats, stats25),
    clientMixSection(),
    gradeSection(),
    recentBigSection(rows),
    footerNote(),
  ].join("");

  wireInteractions();
}

function filterLabel(){
  if(filter.kind === "attorney" || filter.kind === "attorney_orig" || filter.kind === "attorney_clos"){
    const suffix = filter.kind === "attorney_orig" ? " (originating)"
                 : filter.kind === "attorney_clos" ? " (closing)" : "";
    return `Filtered to ${attorneyLabel(filter.value)}${suffix}`;
  }
  if(filter.kind === "matter")    return `Filtered to matter: ${filter.value}`;
  if(filter.kind === "segment")   return `Filtered to segment: ${filter.value}`;
  if(filter.kind === "category")  return `Filtered to category: ${filter.value}`;
  if(filter.kind === "refsource") return `Filtered to referral source: ${filter.value}`;
  return "Filtered";
}

function filterBar(){
  if(!filter){
    return `<div class="filter-bar"><span class="filter-hint">💡 Tip: click any attorney, matter, category, segment, or referral source to filter the whole dashboard.</span></div>`;
  }
  return `<div class="filter-bar">
    <span class="filter-pill" id="clearFilter">${esc(filterLabel())} <span class="x">×</span></span>
    <span class="filter-hint">Click × to clear the filter.</span>
  </div>`;
}

function computeStats(rows){
  const buckets = {};
  SEG_ORDER.forEach(k => buckets[k] = {revenue:0, files:0});

  const byMonth = new Array(12).fill(0);
  const byAttorneyOrig = {};
  const byAttorneyClos = {};
  const byMatter = {};
  const byCategory = {};
  const byRefSource = {};

  let total = 0, files = 0, newMatterTotal = 0, newMatterFiles = 0;
  const refundList = [];

  for(const row of rows){
    const fee = num(row["Fee Billed"]);
    if(fee === 0 && (row["Fee Billed"] === null || row["Fee Billed"] === undefined || row["Fee Billed"] === "")) continue;
    files++;
    total += fee;

    const seg = classify(row);
    buckets[seg].revenue += fee;
    buckets[seg].files++;

    if(seg === "New-Matter"){
      newMatterTotal += fee;
      newMatterFiles++;
    }

    const mi = monthIndex(row);
    if(mi !== null) byMonth[mi] += fee;

    const origAtt = String(row["Originating Attorney"] || "").trim().toUpperCase();
    const closAtt = String(row["Closing Attorney"] || "").trim().toUpperCase();
    if(origAtt){
      if(!byAttorneyOrig[origAtt]) byAttorneyOrig[origAtt] = {revenue:0, files:0};
      byAttorneyOrig[origAtt].revenue += fee;
      byAttorneyOrig[origAtt].files++;
    }
    if(closAtt){
      if(!byAttorneyClos[closAtt]) byAttorneyClos[closAtt] = {revenue:0, files:0};
      byAttorneyClos[closAtt].revenue += fee;
      byAttorneyClos[closAtt].files++;
    }
    const matter = String(row["Matter"] || "").trim();
    if(matter){
      if(!byMatter[matter]) byMatter[matter] = {revenue:0, files:0};
      byMatter[matter].revenue += fee;
      byMatter[matter].files++;
    }

    const cat = catOf(row);
    if(!byCategory[cat]) byCategory[cat] = {revenue:0, files:0};
    byCategory[cat].revenue += fee;
    byCategory[cat].files++;

    const rs = refSourceOf(row);
    if(!byRefSource[rs]) byRefSource[rs] = {revenue:0, files:0};
    byRefSource[rs].revenue += fee;
    byRefSource[rs].files++;

    if(fee < 0) refundList.push({
      fee,
      name: row["Client"],
      date: row["_date"] || row["Month"],
      closAtt, cat, refSource: rs,
    });
  }

  return {
    total, newMatterTotal, files, newMatterFiles,
    buckets, byMonth,
    byAttorneyOrig, byAttorneyClos, byMatter, byCategory, byRefSource,
    refundList,
  };
}

function headlineSection(s, s25){
  const monthsWithData = s.byMonth.filter(v => v > 0).length;
  const s25Match = s25.byMonth ? s25.byMonth.slice(0, monthsWithData).reduce((a,b)=>a+b,0) : 0;
  const yoy = s25Match > 0 ? ((s.total - s25Match) / s25Match) * 100 : null;
  const yoyLabel = yoy === null ? "" :
    `<span class="${yoy>=0?'up':'down'}">${yoy>=0?'▲':'▼'} ${Math.abs(yoy).toFixed(1)}%</span> vs 2025 same period`;

  const pooled = s.total - s.newMatterTotal;
  const newMatterShare = s.total > 0 ? (s.newMatterTotal / s.total * 100).toFixed(1) : "0";

  return `<div class="headline">
    <div class="stat hero">
      <div class="k">${filter ? 'Filtered revenue' : 'Total revenue'} ${CONFIG.year} YTD</div>
      <div class="v">${usd0(s.total)}</div>
      <div class="d">${yoyLabel || `${s.files.toLocaleString()} paid entries`}</div>
    </div>
    <div class="stat">
      <div class="k">New-matter revenue</div>
      <div class="v">${usd0(s.newMatterTotal)}</div>
      <div class="d">${newMatterShare}% of total · ${s.newMatterFiles.toLocaleString()} files</div>
    </div>
    <div class="stat">
      <div class="k">Pooled / pass-through</div>
      <div class="v">${usd0(pooled)}</div>
      <div class="d">APP + Reg Agent + Title + Referral</div>
    </div>
  </div>`;
}

function kpiSection(s){
  const monthsWithData = Math.max(1, s.byMonth.filter(v => v > 0).length);
  const monthlyPace = s.total / monthsWithData;
  const avgPerFile = s.files > 0 ? s.total / s.files : 0;
  const avgPerNewMatter = s.newMatterFiles > 0 ? s.newMatterTotal / s.newMatterFiles : 0;
  const projectedAnnual = monthlyPace * 12;

  return `<div class="kpis">
    <div class="kpi"><div class="k">Monthly pace</div>
      <div class="v">${usdK(monthlyPace)}</div>
      <div class="d">avg across ${monthsWithData} months</div></div>
    <div class="kpi"><div class="k">Avg per new matter</div>
      <div class="v">${usd0(avgPerNewMatter)}</div>
      <div class="d">real client work</div></div>
    <div class="kpi"><div class="k">Avg per entry</div>
      <div class="v">${usd0(avgPerFile)}</div>
      <div class="d">blended</div></div>
    <div class="kpi"><div class="k">Projected annual</div>
      <div class="v">${usdK(projectedAnnual)}</div>
      <div class="d">at current pace</div></div>
  </div>`;
}

function thermoSection(s){
  const total = s.total;
  const pct = total / CONFIG.yearGoal;
  const pctLabel = (pct * 100).toFixed(1);

  const dayOfYear = Math.floor((Date.now() - new Date(CONFIG.year, 0, 1)) / (86400000));
  const paceRatio = Math.min(1, Math.max(0, dayOfYear / 365));
  const paceLeft = (paceRatio * 100).toFixed(1);
  const expectedByNow = CONFIG.yearGoal * paceRatio;
  const paceCopy = total >= expectedByNow
    ? `You're <b>ahead of pace</b> by ${usdK(total - expectedByNow)}.`
    : `You're <b>behind pace</b> by ${usdK(expectedByNow - total)}.`;

  const noteWhenFiltered = filter
    ? `<div style="font-size:.75rem;color:var(--muted);margin-top:5px">Goal is firm-wide; filter narrows the "actual" number.</div>`
    : '';

  return `<div class="thermo">
    <div class="row">
      <div class="goal">${usd0(total)} of ${usd0(CONFIG.yearGoal)} annual goal</div>
      <div class="pct">${pctLabel}%</div>
    </div>
    <div class="bar">
      <div class="fill ${pct>1?'over':''}" style="width:${Math.min(100, pct*100)}%"></div>
      <div class="pace-marker" style="left:${paceLeft}%"></div>
    </div>
    <div class="pace">${paceCopy} · Through day ${dayOfYear} of ${CONFIG.year} (${(paceRatio*100).toFixed(0)}% of the year).</div>
    ${noteWhenFiltered}
  </div>`;
}

function refundSpotlight(s){
  if(!s.refundList.length) return "";
  const total = s.refundList.reduce((a,r)=>a+r.fee,0);
  const latest = [...s.refundList].sort((a,b)=> String(b.date||"").localeCompare(String(a.date||"")))[0];
  const latestDate = latest.date ? String(latest.date).slice(0,10) : "unknown date";
  return `<div class="refund">
    <div class="icon">⚠️</div>
    <div class="body">
      <b>${s.refundList.length} refund${s.refundList.length>1?'s':''} totaling ${usd0(Math.abs(total))}${filter?' (in filter)':''}</b>
      <small>Most recent: ${usd0(Math.abs(latest.fee))} · ${esc(latest.name || '—')} · ${latestDate} · Full breakdown in the Refund Diagnostics section below.</small>
    </div>
  </div>`;
}

function compositionSection(){
  // Composition is always calculated from ALL rows (respecting attorney/matter filter),
  // but IGNORING viewMode — otherwise "growth mode" would show only one segment.
  const rows = ROWS.filter(passesFilter);
  const s = computeStats(rows);
  const total = s.total || 1;
  const segs = SEG_ORDER.map(k => ({
    key:k,
    rev:s.buckets[k].revenue,
    files:s.buckets[k].files,
    pct:(s.buckets[k].revenue/total)*100,
  })).filter(x => x.rev > 0);

  const stripHtml = segs.map(seg => `
    <div class="seg" data-seg="${seg.key}" style="background:${SEG_COLORS[seg.key]};flex:${seg.pct}"
         title="${seg.key}: ${usd0(seg.rev)} (${seg.pct.toFixed(1)}%) — click to filter">
      ${seg.pct >= 6 ? seg.pct.toFixed(0)+'%' : ''}
    </div>
  `).join("");

  const legendHtml = segs.map(seg => `
    <div class="item">
      <span class="swatch" style="background:${SEG_COLORS[seg.key]}"></span>
      <b>${seg.key}</b>
      <span class="amt">${usd0(seg.rev)} · ${seg.pct.toFixed(1)}%</span>
    </div>
  `).join("");

  const toggle = `
    <div class="togchip" id="viewToggle">
      <button data-v="blended" aria-selected="${viewMode==='blended'}">Blended (all fees)</button>
      <button data-v="growth"  aria-selected="${viewMode==='growth'}">Growth (new-matter only)</button>
    </div>`;

  return `<div class="section">
    <h2>Revenue composition ${toggle}</h2>
    <p class="sh">Click any segment to filter the dashboard. The gold slice is your honest growth number — everything else is pooled or pass-through money.</p>
    <div class="comp" id="compStrip">${stripHtml}</div>
    <div class="comp-legend">${legendHtml}</div>
  </div>`;
}

  const maxV = Math.max(1, ...s.byMonth, ...(s25.byMonth || []));
  const has25 = s25.byMonth && s25.byMonth.some(v => v > 0);

  const barsHtml = MONTH_NAMES.map((name, i) => {
    const cur = s.byMonth[i] || 0;
    const prev = (s25.byMonth && s25.byMonth[i]) || 0;

      <span class="tip">
        ${name} · ${CONFIG.year}: ${usdK(cur)}${has25 ? ` · 2025: ${usdK(prev)}` : ''}

      </span>
      <div class="bars">
        ${has25 ? `<div class="bar prev" style="height:${prevH}px"></div>` : ''}

    <div class="months-legend">

function rankedList(title, dataMap, data25Map, kind, isRawKey, limit){
  let rows = Object.entries(dataMap)
    .map(([k, v]) => ({
      key:k,
      label: isRawKey ? k : attorneyLabel(k),
      revenue: v.revenue,
      files: v.files,
      revenue25: (data25Map && data25Map[k]) ? data25Map[k].revenue : 0,
    }))
    .sort((a,b) => b.revenue - a.revenue);

  const total = rows.reduce((a,r)=>a+r.revenue,0);
  const has25 = rows.some(r => r.revenue25 > 0);
  const hiddenCount = limit && rows.length > limit ? rows.length - limit : 0;
  if(limit) rows = rows.slice(0, limit);

  const html = rows.map(r => {
    const pct = total > 0 ? (r.revenue/total*100).toFixed(1) : "0.0";
    const yoy = has25 && r.revenue25 > 0 ? ((r.revenue - r.revenue25)/r.revenue25*100).toFixed(1) : null;
    const yoyTag = yoy !== null ?
      `<span class="d" style="color:${yoy>=0?'var(--up)':'var(--down)'}">${yoy>=0?'▲':'▼'} ${Math.abs(yoy)}%</span>` : '';
    const isActive = filter && filter.kind === kind && filter.value === r.key;
    // For attorney filter kinds, we normalize the value to the UPPERCASE key.
    // For raw-key lists (matter, category, refsource), we keep it as-is.
    const filterVal = isRawKey ? r.key : r.key.toUpperCase();
    return `<div class="r ${isActive?'active':''}" data-kind="${kind}" data-val="${esc(filterVal)}">
      <span class="lbl">${esc(r.label)}<span class="files">· ${r.files}</span></span>
      <span class="v">${usd0(r.revenue)}</span>
      <span class="d">${pct}%</span>
      ${yoyTag}
    </div>`;
  }).join("");

  const moreNote = hiddenCount ? `<div class="more">+ ${hiddenCount} more (smaller)</div>` : "";

  return `<div>
    <b style="color:var(--navy);font-size:.95rem">${title}</b>
    <div class="rank">${html || '<div style="color:var(--muted);padding:14px 4px">No entries.</div>'}${moreNote}</div>
  </div>`;
}

function avgFeeMatrixSection(){
  const source = matrixYear === 2025 ? ROWS_2025 : ROWS;
  const useRows = source.filter(r => passesFilter(r) && passesViewMode(r));
  const roleCol = matrixRole === "orig" ? "Originating Attorney" : "Closing Attorney";

  const cells = {};   // cat -> att -> {rev, files}
  const catAgg = {};  // cat -> {rev, files}
  const attAgg = {};  // att -> {rev, files}

  for(const r of useRows){
    const fee = num(r["Fee Billed"]);
    if(fee <= 0) continue; // averages exclude refunds and zero-fee rows
    const cat = catOf(r);
    const att = String(r[roleCol]||"").trim().toUpperCase() || "—";
    ((cells[cat] ??= {})[att] ??= {rev:0, files:0});
    cells[cat][att].rev += fee; cells[cat][att].files++;
    (catAgg[cat] ??= {rev:0, files:0}); catAgg[cat].rev += fee; catAgg[cat].files++;
    (attAgg[att] ??= {rev:0, files:0}); attAgg[att].rev += fee; attAgg[att].files++;
  }

  const cats = Object.keys(catAgg).sort((a,b)=>catAgg[b].rev-catAgg[a].rev);
  const atts = Object.keys(attAgg).sort((a,b)=>attAgg[b].rev-attAgg[a].rev);

  const yearTog = `
    <div class="togchip" id="matrixYearTog">
      <button data-y="${CONFIG.year}" aria-selected="${matrixYear===CONFIG.year}">${CONFIG.year}</button>
      <button data-y="2025" aria-selected="${matrixYear===2025}">2025</button>
    </div>`;
  const roleTog = `
    <div class="togchip" id="matrixRoleTog">
      <button data-r="clos" aria-selected="${matrixRole==='clos'}">Closing</button>
      <button data-r="orig" aria-selected="${matrixRole==='orig'}">Originating</button>
    </div>`;

  if(!cats.length){
    return `<div class="section">
      <h2>Average fee — category × attorney <span class="togwrap">${yearTog}${roleTog}</span></h2>
      <p class="sh">No positive-fee entries for this view yet${matrixYear===2025?' (the 2025 tab may not include a Category column)':''}.</p>
    </div>`;
  }

  const headCells = atts.map(a =>
    `<th title="${esc(attorneyLabel(a))}">${esc(a)}</th>`).join("");

  const bodyRows = cats.map(cat => {
    const isActive = filter && filter.kind === "category" && filter.value === cat;
    const cellsHtml = atts.map(a => {
      const c = cells[cat][a];
      if(!c) return `<td style="color:#ccc">—</td>`;
      const avg = c.rev / c.files;
      return `<td title="${esc(cat)} · ${esc(attorneyLabel(a))}: ${usd0(c.rev)} across ${c.files} file${c.files>1?'s':''}">
        ${usdK(avg)}<span class="cnt">${c.files} file${c.files>1?'s':''}</span></td>`;
    }).join("");
    const catAvg = catAgg[cat].rev / catAgg[cat].files;
    return `<tr class="${isActive?'active':''}">
      <td class="mxcat" data-kind="category" data-val="${esc(cat)}" title="Click to filter dashboard to ${esc(cat)}">${esc(cat)}</td>
      ${cellsHtml}
      <td class="allcol">${usdK(catAvg)}<span class="cnt">${catAgg[cat].files} files</span></td>
    </tr>`;
  }).join("");

  const totCells = atts.map(a => {
    const t = attAgg[a];
    return `<td>${usdK(t.rev/t.files)}<span class="cnt">${t.files} files</span></td>`;
  }).join("");
  const grandRev = cats.reduce((s,c)=>s+catAgg[c].rev,0);
  const grandFiles = cats.reduce((s,c)=>s+catAgg[c].files,0);

  return `<div class="section">
    <h2>Average fee — category × attorney <span class="togwrap">${yearTog}${roleTog}</span></h2>
    <p class="sh">The matter-mix decoder: what each attorney's average fee looks like inside each category. Refunds excluded. Click a category name to filter the whole dashboard. Hover any cell for total dollars.</p>
    <div class="matrix-scroll">
      <table class="matrix">
        <thead><tr><th>Category</th>${headCells}<th class="allcol">All</th></tr></thead>
        <tbody>
          ${bodyRows}
          <tr class="totrow"><td>All categories</td>${totCells}
            <td class="allcol">${grandFiles ? usdK(grandRev/grandFiles) : '—'}<span class="cnt">${grandFiles} files</span></td></tr>
        </tbody>
      </table>
    </div>
  </div>`;
}

function refundDiagnosticsSection(){
  const rows = getWorkingRows();
  const refunds = rows.filter(r => num(r["Fee Billed"]) < 0);
  if(!refunds.length){
    return `<div class="section">
      <h2>Refund diagnostics</h2>
      <p class="sh">No refunds in the current view. 🎉</p>
    </div>`;
  }

  // Slice totals (for rates) and refund aggregates, by three dimensions.
  function slice(fnLabel){
    const tot = {}; const ref = {};
    for(const r of rows){
      const k = fnLabel(r);
      (tot[k] ??= 0); tot[k]++;
      const fee = num(r["Fee Billed"]);
      if(fee < 0){
        (ref[k] ??= {dollars:0, count:0});
        ref[k].dollars += Math.abs(fee); ref[k].count++;
      }
    }
    return Object.entries(ref)
      .map(([k,v]) => ({key:k, dollars:v.dollars, count:v.count, rate:(v.count/tot[k])*100}))
      .sort((a,b)=>b.dollars-a.dollars)
      .slice(0, 6);
  }

  const byAtt = slice(r => attorneyLabel(r["Closing Attorney"]));
  const byCat = slice(r => catOf(r));
  const bySrc = slice(r => refSourceOf(r));

  function mini(title, items){
    const html = items.map(i => `
      <div class="r static">
        <span class="lbl">${esc(i.key)}<span class="files">· ${i.count}×</span></span>
        <span class="v" style="color:var(--down)">-${usd0(i.dollars)}</span>
        <span class="d">${i.rate.toFixed(1)}% of files</span>
      </div>`).join("");
    return `<div class="col"><b style="color:var(--navy);font-size:.95rem">${title}</b>
      <div class="rank">${html}</div></div>`;
  }

  const totalDollars = refunds.reduce((a,r)=>a+Math.abs(num(r["Fee Billed"])),0);

  return `<div class="section">
    <h2>Refund diagnostics</h2>
    <p class="sh">${refunds.length} refund${refunds.length>1?'s':''} · ${usd0(totalDollars)} total${filter?' (in current filter)':''}. Sliced by who closed it, what kind of work it was, and where the client came from. Rate = refunds as a share of that slice's entries.</p>
    <div class="cols3">
      ${mini("By closing attorney", byAtt)}
      ${mini("By category", byCat)}
      ${mini("By referral source", bySrc)}
    </div>
  </div>`;
}

function referralSection(s, s25){
  // Top individual referrers, by dollars. Pooled markers and blanks excluded.
  const rows = getWorkingRows();
  const m = {};
  for(const r of rows){
    const n = refNameOf(r);
    if(!n) continue;
    const ln = n.toLowerCase();
    if(ln === "payments" || ln === "bulk payment") continue;
    const fee = num(r["Fee Billed"]);
    if(fee <= 0) continue;
    (m[n] ??= {revenue:0, files:0});
    m[n].revenue += fee; m[n].files++;
  }
  const referrers = Object.entries(m)
    .map(([k,v]) => ({key:k, ...v}))
    .sort((a,b)=>b.revenue-a.revenue)
    .slice(0, 15);

  const refHtml = referrers.map((r,i) => `
    <div class="r static">
      <span class="lbl">${i<3?'💌 ':''}${esc(r.key)}<span class="files">· ${r.files} client${r.files>1?'s':''}</span></span>
      <span class="v">${usd0(r.revenue)}</span>
      <span class="d">${usdK(r.revenue/r.files)}/ea</span>
    </div>`).join("");

  return `<div class="section">
    <h2>Referral engine</h2>
    <p class="sh">Dollars, not just counts — five $15K referrals beat twenty $2K ones. Click a source to filter. The right column is your thank-you-card list, built automatically.</p>
    <div class="cols">
      <div class="col">
        ${rankedList("Revenue by referral source", s.byRefSource, s25.byRefSource, "refsource", true, 12)}
      </div>
      <div class="col">
        <b style="color:var(--navy);font-size:.95rem">Top individual referrers (by dollars)</b>
        <div class="rank">${refHtml || '<div style="color:var(--muted);padding:14px 4px">No named referrers in this view.</div>'}</div>
      </div>
    </div>
  </div>`;
}

// ---------------------------------------------------------------------------
// NEW · New vs. existing client revenue mix by month
// ---------------------------------------------------------------------------

function clientMixSection(){
  const rows = getWorkingRows();
  const byM = Array.from({length:12}, () => ({New:0, Existing:0, Other:0}));
  const tot = {New:0, Existing:0, Other:0};

  for(const r of rows){
    const fee = num(r["Fee Billed"]);
    if(fee <= 0) continue;
    const b = clientTypeBucket(r);
    tot[b] += fee;
    const mi = monthIndex(r);
    if(mi !== null) byM[mi][b] += fee;
  }
  const grand = tot.New + tot.Existing + tot.Other;
  if(grand === 0){
    return `<div class="section">
      <h2>New vs. existing revenue mix</h2>
      <p class="sh">No Client Type data in this view — check that the Client Type column is populated on the sheet.</p>
    </div>`;
  }

  const showOther = tot.Other > 0;
  const keys = showOther ? ["New","Existing","Other"] : ["New","Existing"];
  const maxMonth = Math.max(1, ...byM.map(o => o.New + o.Existing + o.Other));

  const barsHtml = MONTH_NAMES.map((name, i) => {
    const o = byM[i];
    const mTotal = o.New + o.Existing + o.Other;
    const totalH = (mTotal / maxMonth) * 145;
    const segs = keys.map(k => {
      const h = mTotal > 0 ? (o[k]/mTotal) * totalH : 0;
      return `<div class="sseg" style="height:${h}px;background:${MIX_COLORS[k]}"></div>`;
    }).join("");
    const pctNew = mTotal > 0 ? (o.New/mTotal*100).toFixed(0) : "0";
    return `<div class="m">
      <span class="tip">${name} · New: ${usdK(o.New)} · Existing: ${usdK(o.Existing)}${showOther?` · Other: ${usdK(o.Other)}`:''} (${pctNew}% new)</span>
      <div class="sbar" style="height:${Math.max(2,totalH)}px">${segs}</div>
      <div class="lbl">${name}</div>
    </div>`;
  }).join("");

  const chips = keys.map(k => `
    <div class="mixchip">
      <span class="amt">${usd0(tot[k])}</span>
      <small><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${MIX_COLORS[k]};margin-right:5px"></span>${k} · ${(tot[k]/grand*100).toFixed(1)}%</small>
    </div>`).join("");

  return `<div class="section">
    <h2>New vs. existing revenue mix</h2>
    <p class="sh">Is growth coming from new business, or from mining the base? Gold is new-client revenue; navy is existing. Hover any month for the split.</p>
    <div class="mixchips">${chips}</div>
    <div class="months" style="height:190px">${barsHtml}</div>
  </div>`;
}

// ---------------------------------------------------------------------------
// NEW · Grade distribution — by closing attorney and by referral source
// ---------------------------------------------------------------------------

function gradeSection(){
  const rows = getWorkingRows().filter(r => num(r["Fee Billed"]) > 0);
  const graded = rows.filter(r => gradeOf(r));

  if(!graded.length){
    return `<div class="section">
      <h2>Client grade distribution</h2>
      <p class="sh">No graded entries in this view — check that the Grade column is populated on the sheet.</p>
    </div>`;
  }

  function dist(fnLabel, minFiles, limit){
    const m = {};
    for(const r of graded){
      const k = fnLabel(r);
      const g = gradeOf(r);
      (m[k] ??= {total:0}); (m[k][g] ??= 0);
      m[k][g]++; m[k].total++;
    }
    return Object.entries(m)
      .map(([k,v]) => ({key:k, ...v}))
      .filter(x => x.total >= minFiles)
      .sort((a,b)=>b.total-a.total)
      .slice(0, limit);
  }

  function bars(items){
    return items.map(it => {
      const segs = GRADE_ORDER.map(g => {
        const n = it[g] || 0;
        if(!n) return "";
        return `<div class="gseg" style="width:${(n/it.total*100)}%;background:${GRADE_COLORS[g]}"
          title="${g}: ${n} of ${it.total} (${(n/it.total*100).toFixed(0)}%)"></div>`;
      }).join("");
      const pctA = ((it["A"]||0)/it.total*100).toFixed(0);
      return `<div class="grow">
        <span class="glbl" title="${esc(it.key)}">${esc(it.key)}<span class="files" style="font-size:.7rem;color:#999"> · ${it.total}</span></span>
        <div class="gbar">${segs}</div>
        <span class="gpct">${pctA}% A</span>
      </div>`;
    }).join("");
  }

  const byAtt = dist(r => attorneyLabel(r["Closing Attorney"]), 3, 12);
  const bySrc = dist(r => refSourceOf(r), 3, 10);

  const legend = `<div class="glegend">${GRADE_ORDER.map(g =>
    `<div class="item"><span class="swatch" style="background:${GRADE_COLORS[g]}"></span>${g}</div>`).join("")}
    <div class="item" style="margin-left:auto">${graded.length} graded entries</div></div>`;

  return `<div class="section">
    <h2>Client grade distribution</h2>
    <p class="sh">Do certain attorneys or referral sources attract A-clients? 100% stacked by grade; slices with fewer than 3 graded files are hidden. Hover a bar segment for counts.</p>
    ${legend}
    <div class="cols">
      <div class="col">
        <b style="color:var(--navy);font-size:.95rem">By closing attorney</b>
        ${bars(byAtt) || '<div style="color:var(--muted);padding:14px 4px">Not enough graded files.</div>'}
      </div>
      <div class="col">
        <b style="color:var(--navy);font-size:.95rem">By referral source</b>
        ${bars(bySrc) || '<div style="color:var(--muted);padding:14px 4px">Not enough graded files.</div>'}
      </div>
    </div>
  </div>`;
}

function recentBigSection(rows){
  const recent = rows
    .filter(r => num(r["Fee Billed"]) > 0)
    .sort((a,b) => num(b["Fee Billed"]) - num(a["Fee Billed"]))
    .slice(0, 10);

  const chips = recent.map(r => {
    const date = r["_date"] || r["Month"] || "";
    const dateStr = date ? String(date).slice(0,10) : "";
    return `<span class="chip">
      <span class="amt">${usd0(num(r["Fee Billed"]))}</span>
      <span class="name">${esc(r["Client"] || '—')}</span>
      <span class="date">${dateStr}</span>
    </span>`;
  }).join("");

  return `<div class="section">
    <h2>Top 10 entries ${filter?'(filtered)':`in ${CONFIG.year}`}</h2>
    <p class="sh">The biggest single fees${filter?' in the current filter':' this year'}.</p>
    <div class="strip">${chips || '<div style="color:var(--muted);padding:14px 4px">No entries.</div>'}</div>
  </div>`;
}

function footerNote(){
  return `<div class="footer-note">
    Data pulled live from the <b>${CONFIG.year} Clients</b> sheet. Refresh to update.
    &nbsp;·&nbsp; Goal: <b>${usd0(CONFIG.yearGoal)}</b>
  </div>`;
}

// ---------------------------------------------------------------------------
// Interactions — everything that reacts to a click
// ---------------------------------------------------------------------------

function wireInteractions(){
  // Ranked-list rows -> set filter (static rows have no data-kind and are skipped)
  document.querySelectorAll(".rank .r").forEach(el => {
    el.onclick = () => {
      const kind = el.getAttribute("data-kind");
      const val  = el.getAttribute("data-val");
      if(!kind || !val) return;
      // Toggle: clicking the active one clears it
      if(filter && filter.kind === kind && filter.value === val){
        filter = null;
      } else {
        filter = { kind, value: val };
      }
      render();
    };
  });

  // Matrix category names -> filter by category
  document.querySelectorAll("table.matrix td.mxcat").forEach(el => {
    el.onclick = () => {
      const val = el.getAttribute("data-val");
      if(filter && filter.kind === "category" && filter.value === val){
        filter = null;
      } else {
        filter = { kind:"category", value:val };
      }
      render();
    };
  });

  // Matrix toggles: year and attorney role
  document.querySelectorAll("#matrixYearTog button").forEach(b => {
    b.onclick = () => { matrixYear = parseInt(b.getAttribute("data-y"), 10); render(); };
  });
  document.querySelectorAll("#matrixRoleTog button").forEach(b => {
    b.onclick = () => { matrixRole = b.getAttribute("data-r"); render(); };
  });

  // Composition strip -> filter by segment
  document.querySelectorAll("#compStrip .seg").forEach(el => {
    el.onclick = () => {
      const seg = el.getAttribute("data-seg");
      if(filter && filter.kind === "segment" && filter.value === seg){
        filter = null;
      } else {
        filter = { kind:"segment", value:seg };
      }
      render();
    };
  });

  // View mode toggle (blended / growth)
  document.querySelectorAll("#viewToggle button").forEach(b => {
    b.onclick = () => {
      viewMode = b.getAttribute("data-v");
      render();
    };
  });

  // Clear filter pill
  const clear = document.getElementById("clearFilter");
  if(clear) clear.onclick = () => { filter = null; render(); };
}
</script>
