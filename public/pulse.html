<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dorcey · Revenue Pulse</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1d33; --navy-2:#1b2f4d; --gold:#c6a04e; --gold-soft:#e3cd97;
    --cream:#f7f3ea; --parchment:#f6f1e4; --ink:#2a2a2a; --muted:#7d7666;
    --line:#e7e0d2; --up:#2d6a4f; --down:#9b2335; --shadow:0 16px 38px -22px rgba(15,29,51,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Libre Franklin",system-ui,sans-serif;background:var(--parchment);color:var(--ink)}

  /* Top nav bar for jumping between admin / dashboard / pulse */
  .topnav{background:#0a1732;display:flex;justify-content:center;gap:2px;padding:0;
    border-bottom:1px solid rgba(198,160,78,.25)}
  .topnav a{flex:1;max-width:180px;text-align:center;padding:12px 8px;
    color:#c7cfdd;text-decoration:none;font:600 .82rem "Libre Franklin",sans-serif;
    letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;
    transition:background .15s,color .15s,border-color .15s}
  .topnav a:hover{background:#132849;color:#e3cd97}
  .topnav a.active{color:var(--gold);border-bottom-color:var(--gold);background:#132849}
  .topnav a .ico{display:block;font-size:1.05rem;margin-bottom:2px}

  header.masthead{background:linear-gradient(155deg,var(--navy),var(--navy-2));color:var(--cream);
    padding:24px 28px;border-bottom:3px solid var(--gold)}
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;margin:.15rem 0 .1rem;font-size:1.7rem}
  .masthead .sub{color:#c7cfdd;font-size:.88rem}
  .wrap{max-width:1200px;margin:0 auto;padding:22px 20px 60px}
  .loading{padding:80px;text-align:center;color:var(--muted)}
  .error{padding:40px;text-align:center;color:var(--down);background:#fff;border-radius:14px;box-shadow:var(--shadow)}

  /* Headline row: total + new-matter side by side */
  .headline{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;margin-bottom:22px}
  .headline .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;box-shadow:var(--shadow)}
  .headline .stat.hero{background:linear-gradient(150deg,var(--navy),var(--navy-2));color:#fff;border-color:var(--navy)}
  .headline .stat.hero .k{color:var(--gold-soft)}
  .headline .stat.hero .v{color:#fff}
  .headline .stat.hero .d{color:#c7cfdd}
  .headline .stat .k{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .headline .stat .v{font-family:"Playfair Display",serif;font-size:1.9rem;color:var(--navy);line-height:1.05;margin-top:5px}
  .headline .stat .d{font-size:.82rem;color:var(--muted);margin-top:4px}
  .headline .stat .d .up{color:var(--up);font-weight:700}
  .headline .stat .d .down{color:var(--down);font-weight:700}

  /* Secondary KPI cards */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .k{font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .kpi .v{font-family:"Playfair Display",serif;font-size:1.3rem;color:var(--navy);line-height:1.1;margin-top:3px}
  .kpi .d{font-size:.72rem;color:var(--muted);margin-top:2px}

  /* Thermometer */
  .thermo{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;
    box-shadow:var(--shadow);margin-bottom:22px}
  .thermo .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;flex-wrap:wrap;gap:8px}
  .thermo .goal{font-weight:700;color:var(--navy);font-size:1rem}
  .thermo .pct{font-family:"Playfair Display",serif;font-size:1.4rem;color:var(--navy)}
  .thermo .bar{height:18px;background:#f0e8d3;border-radius:10px;overflow:hidden;position:relative}
  .thermo .fill{height:100%;background:linear-gradient(90deg,var(--gold),#dcbf7d);transition:width .6s ease-out}
  .thermo .fill.over{background:linear-gradient(90deg,var(--up),#4a9d70)}
  .thermo .pace-marker{position:absolute;top:-3px;height:24px;width:2px;background:var(--navy);opacity:.55}
  .thermo .pace-marker::after{content:"today's pace";position:absolute;top:-14px;left:4px;font-size:.62rem;color:var(--navy);white-space:nowrap;font-weight:600}
  .thermo .pace{margin-top:8px;font-size:.85rem;color:var(--muted)}
  .thermo .pace b{color:var(--navy)}

  /* Section chrome */
  .section{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);
    padding:18px 22px;margin-bottom:22px}
  .section h2{font-family:"Playfair Display",serif;color:var(--navy);margin:0 0 4px;font-size:1.15rem;
    display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .section .sh{font:500 .78rem "Libre Franklin",sans-serif;color:var(--muted);margin:0 0 12px}

  /* Revenue composition strip */
  .comp{display:flex;height:36px;border-radius:10px;overflow:hidden;border:1px solid var(--line)}
  .comp .seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:.72rem;font-weight:700;
    min-width:24px;padding:0 6px;text-shadow:0 1px 2px rgba(0,0,0,.2)}
  .comp-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:10px;font-size:.78rem}
  .comp-legend .item{display:flex;align-items:center;gap:6px;color:var(--ink)}
  .comp-legend .swatch{width:12px;height:12px;border-radius:3px}
  .comp-legend .amt{color:var(--muted);margin-left:4px}

  /* Two-column grid */
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  .cols .col + .col{border-left:1px dashed var(--line);padding-left:22px}

  /* Monthly trend bars */
  .months{display:flex;align-items:flex-end;gap:8px;height:180px;margin-top:14px;padding-bottom:20px}
  .months .m{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
  .months .m .bars{width:100%;display:flex;gap:2px;align-items:flex-end;height:150px}
  .months .m .bar{flex:1;border-radius:4px 4px 0 0;transition:height .5s ease-out;min-height:2px;position:relative;cursor:default}
  .months .m .bar.cur{background:var(--gold)}
  .months .m .bar.prev{background:#c7cfdd}
  .months .m .lbl{font-size:.7rem;color:var(--muted);margin-top:6px;font-weight:600}
  .months .m .tip{position:absolute;bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:6px 10px;border-radius:6px;font-size:.72rem;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
  .months .m:hover .tip{opacity:1}
  .months-legend{display:flex;gap:14px;font-size:.75rem;color:var(--muted);margin-top:-8px;justify-content:flex-end}
  .months-legend .item{display:flex;align-items:center;gap:6px}
  .months-legend .swatch{width:14px;height:12px;border-radius:2px}

  /* Ranked lists */
  .rank{margin-top:6px}
  .rank .r{display:flex;justify-content:space-between;align-items:center;padding:7px 4px;
    border-bottom:1px dashed var(--line);font-size:.92rem;gap:10px}
  .rank .r:last-child{border-bottom:0}
  .rank .r .lbl{flex:1;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rank .r .v{font-weight:700;color:var(--navy);white-space:nowrap}
  .rank .r .d{font-size:.72rem;color:var(--muted);text-align:right;min-width:50px;white-space:nowrap}
  .rank .r .files{font-size:.7rem;color:#999;margin-left:6px}

  /* Recent big entries */
  .strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
  .chip{background:#faf7ef;border:1px solid var(--line);border-radius:10px;padding:8px 12px;
    font-size:.85rem;display:flex;align-items:center;gap:8px}
  .chip .amt{font-weight:700;color:var(--navy)}
  .chip .name{color:var(--ink)}
  .chip .date{color:var(--muted);font-size:.72rem}

  /* Refund spotlight */
  .refund{background:linear-gradient(120deg,#fdefe8,#f7d9cc);border:1px solid #e8b8a2;
    color:#7a2f0f;border-radius:14px;padding:16px 20px;margin-bottom:22px;
    display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
  .refund .icon{font-size:1.6rem}
  .refund .body{flex:1}
  .refund .body b{display:block;font-size:1rem;color:#7a2f0f}
  .refund .body small{color:#8a4020}

  .footer-note{text-align:center;font-size:.75rem;color:var(--muted);margin-top:24px}
  .footer-note b{color:var(--navy)}

  @media(max-width:900px){
    .headline{grid-template-columns:1fr}
    .kpis{grid-template-columns:repeat(2,1fr)}
    .cols{grid-template-columns:1fr}
    .cols .col + .col{border-left:0;border-top:1px dashed var(--line);padding-left:0;padding-top:22px;margin-top:6px}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <a href="/admin"><span class="ico">⚙️</span>Admin</a>
    <a href="/dashboard"><span class="ico">📊</span>Dashboard</a>
    <a href="/pulse" class="active"><span class="ico">💰</span>Pulse</a>
  </nav>
  <header class="masthead">
    <div class="eyebrow">Dorcey Law Firm · Revenue Pulse</div>
    <h1>How's the year going?</h1>
    <div class="sub" id="periodLabel">Loading revenue…</div>
  </header>

  <div class="wrap">
    <div id="content"><div class="loading">Fetching the numbers…</div></div>
  </div>

<script>
// ---------------------------------------------------------------------------
// DORCEY REVENUE PULSE — live dashboard
// Source: /api/revenue-feed (Node relay to the Google Apps Script "2026 Clients" tab).
// Everything below is computed in-browser from that feed.
// ---------------------------------------------------------------------------

const CONFIG = {
  yearGoal: 7000000,   // $7M — updated whenever the annual target shifts
  year: 2026,
};

// Brand palette for the composition strip (revenue by bucket)
const SEG_COLORS = {
  "New-Matter":         "#c6a04e",
  "APP":                "#3f6184",
  "Registered Agent":   "#6e8aa6",
  "Title Pass-through": "#9aae8e",
  "Referral Income":    "#b07f5a",
};
const SEG_ORDER = ["New-Matter","APP","Registered Agent","Title Pass-through","Referral Income"];

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

// Client-side state
let ROWS = [];
let ROWS_2025 = [];

// ---------------------------------------------------------------------------
// Helpers
// ---------------------------------------------------------------------------

// Trim trailing/leading spaces, collapse doubled spaces, strip trailing periods.
// Google Sheets loves leaving trailing spaces on column names.
function cleanKey(k){
  return String(k).replace(/\s+/g," ").trim().replace(/\.$/,"");
}

function normalizeKeys(row){
  const out = {};
  for(const [k,v] of Object.entries(row)) out[cleanKey(k)] = v;
  return out;
}

function extractRows(feed){
  const raw = Array.isArray(feed.entries) ? feed.entries
            : Array.isArray(feed.rows)    ? feed.rows
            : [];
  return raw.map(normalizeKeys);
}

function num(v){
  if(v === null || v === undefined || v === "") return 0;
  if(typeof v === "number") return isFinite(v) ? v : 0;
  const cleaned = String(v).replace(/[$,\s]/g,"");
  const n = parseFloat(cleaned);
  return isFinite(n) ? n : 0;
}

function usd0(n){ return "$" + Math.round(n).toLocaleString("en-US"); }
function usdK(n){
  const a = Math.abs(n);
  if(a >= 1_000_000) return (n<0?"-":"") + "$" + (a/1_000_000).toFixed(2) + "M";
  if(a >= 1_000)    return (n<0?"-":"") + "$" + Math.round(a/1_000) + "K";
  return usd0(n);
}

// Get a row's month index (0-11) from the "_date" or "Month" or "Date Scheduled" field.
function monthIndex(row){
  const candidates = [row["_date"], row["Month"], row["Date Scheduled"], row["Pay Date"], row["PAY DATE"]];
  for(const c of candidates){
    if(!c) continue;
    // ISO like "2026-01-07T05:00:00.000Z" or "2026-01-01"
    if(typeof c === "string"){
      const m = c.match(/^(\d{4})-(\d{2})/);
      if(m) return parseInt(m[2],10) - 1;
      // fallback: try Date parse
      const d = new Date(c);
      if(!isNaN(d)) return d.getUTCMonth();
    }
  }
  return null;
}

// Classify a row into a revenue bucket. Pooled money is split out from new-matter work.
// Keyed on Matter + the "Payments" tag in Referral Name so a typo can't slip through.
function classify(row){
  const matter = String(row["Matter"] || "").trim();
  const client = String(row["Client"] || "").trim().toLowerCase();
  const ref    = String(row["Referral Name"] || "").trim().toLowerCase();
  const pooled = ref === "payments" || ref === "bulk payment";

  if(matter === "APP") return "APP";
  if(matter === "DLF Registered Agent" && pooled) return "Registered Agent";
  if(matter === "DLF Registed Agent" && pooled) return "Registered Agent"; // preserve the sheet's typo
  if(client.includes("dorcey law firm title services")) return "Title Pass-through";
  if(matter === "Referral Fee") return "Referral Income";
  return "New-Matter";
}

// Attorney code -> friendly name. DLF is the firm "house" (unassigned or general
// firm work), NOT an individual attorney — so we label it that way to make sure
// its numbers don't quietly get credited to Josh.
const ATTORNEY_NAMES = {
  "DLF":"House (Dorcey Law Firm)",
  "JOD":"Josh Dorcey",
  "MAS":"Mike Scott",
  "EDJ":"Erica Johnson",
  "KAS":"Kara Sajdak",
  "DAD":"Doug Dodson",
  "BWB":"Brad Butcher",
  "BHB":"Brian Bronsther",
  "DAC":"David Cahoone",
  "APP":"APP (bulk)",
};
};

function attorneyLabel(code){
  const c = String(code||"").trim().toUpperCase();
  return ATTORNEY_NAMES[c] || (c || "Unassigned");
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

load();

async function load(){
  try{
    const r = await fetch("/api/revenue-feed");
    if(!r.ok) throw new Error("feed returned " + r.status);
    const j = await r.json();
    if(j.error) throw new Error(j.error);
    ROWS = extractRows(j);

    // 2025 fetch is best-effort.
    try{
      const r25 = await fetch("/api/revenue-feed?tab=2025");
      if(r25.ok){
        const j25 = await r25.json();
        if(!j25.error) ROWS_2025 = extractRows(j25);
      }
    }catch(e){ /* ignore */ }

    render();
  }catch(e){
    document.getElementById("content").innerHTML =
      `<div class="error">Couldn't reach the revenue feed. (${e.message})</div>`;
    console.error("pulse load error:", e);
  }
}

// ---------------------------------------------------------------------------
// Rendering
// ---------------------------------------------------------------------------

function render(){
  const stats = computeStats(ROWS);
  const stats25 = computeStats(ROWS_2025);

  document.getElementById("periodLabel").textContent =
    `${CONFIG.year} · ${stats.files.toLocaleString()} paid entries so far`;

  document.getElementById("content").innerHTML = [
    headlineSection(stats, stats25),
    kpiSection(stats),
    thermoSection(stats),
    refundSpotlight(stats),
    compositionSection(stats),
    monthlyTrendSection(stats, stats25),
    attorneyAndMatterSection(stats, stats25),
    recentBigSection(),
    footerNote(),
  ].join("");
}

function computeStats(rows){
  const buckets = {};
  SEG_ORDER.forEach(k => buckets[k] = {revenue:0, files:0});

  const byMonth = new Array(12).fill(0);
  const byMonthNewMatter = new Array(12).fill(0);
  const byAttorney = {};
  const byMatter = {};

  let total = 0, newMatterTotal = 0, files = 0, newMatterFiles = 0;
  const refundList = [];

  for(const row of rows){
    const fee = num(row["Fee Billed"]);
    if(fee === 0 && !row["Fee Billed"]) continue; // skip empty rows
    files++;
    total += fee;

    const bucket = classify(row);
    buckets[bucket].revenue += fee;
    buckets[bucket].files++;

    if(bucket === "New-Matter"){
      newMatterTotal += fee;
      newMatterFiles++;
    }

    const mi = monthIndex(row);
    if(mi !== null){
      byMonth[mi] += fee;
      if(bucket === "New-Matter") byMonthNewMatter[mi] += fee;
    }

    // Attorney breakdown (originating)
    const origAtt = String(row["Originating Attorney"] || "").trim();
    if(origAtt && bucket === "New-Matter"){
      if(!byAttorney[origAtt]) byAttorney[origAtt] = {revenue:0, files:0};
      byAttorney[origAtt].revenue += fee;
      byAttorney[origAtt].files++;
    }

    // Matter type breakdown (new-matter only, for a cleaner mix picture)
    const matter = String(row["Matter"] || "").trim();
    if(matter && bucket === "New-Matter"){
      if(!byMatter[matter]) byMatter[matter] = {revenue:0, files:0};
      byMatter[matter].revenue += fee;
      byMatter[matter].files++;
    }

    if(fee < 0) refundList.push({fee, name:row["Client"], date:row["_date"] || row["Month"]});
  }

  return {
    total, newMatterTotal, files, newMatterFiles,
    buckets, byMonth, byMonthNewMatter,
    byAttorney, byMatter, refundList,
    rows,
  };
}

function headlineSection(s, s25){
  // Compare through equivalent month count (only months with 2026 activity count)
  const monthsWithData = s.byMonth.filter(v => v > 0).length;
  const s25MonthsWithData = s25.byMonth ? s25.byMonth.slice(0, monthsWithData).reduce((a,b)=>a+b,0) : 0;
  const yoyTotal = s25MonthsWithData > 0 ? ((s.total - s25MonthsWithData) / s25MonthsWithData) * 100 : null;
  const yoyLabel = yoyTotal === null ? "" :
    `<span class="${yoyTotal>=0?'up':'down'}">${yoyTotal>=0?'▲':'▼'} ${Math.abs(yoyTotal).toFixed(1)}%</span> vs 2025 same period`;

  const newMatterShare = s.total > 0 ? (s.newMatterTotal / s.total * 100).toFixed(1) : "0";

  return `<div class="headline">
    <div class="stat hero">
      <div class="k">Total revenue ${CONFIG.year} YTD</div>
      <div class="v">${usd0(s.total)}</div>
      <div class="d">${yoyLabel || `${s.files.toLocaleString()} paid entries`}</div>
    </div>
    <div class="stat">
      <div class="k">New-matter revenue</div>
      <div class="v">${usd0(s.newMatterTotal)}</div>
      <div class="d">${newMatterShare}% of total · ${s.newMatterFiles.toLocaleString()} files</div>
    </div>
    <div class="stat">
      <div class="k">Pooled / pass-through</div>
      <div class="v">${usd0(s.total - s.newMatterTotal)}</div>
      <div class="d">APP + Reg Agent + Title + Referral</div>
    </div>
  </div>`;
}

function kpiSection(s){
  const monthsWithData = Math.max(1, s.byMonth.filter(v => v > 0).length);
  const monthlyPace = s.total / monthsWithData;
  const avgPerFile = s.files > 0 ? s.total / s.files : 0;
  const avgPerNewMatter = s.newMatterFiles > 0 ? s.newMatterTotal / s.newMatterFiles : 0;
  const projectedAnnual = monthlyPace * 12;

  return `<div class="kpis">
    <div class="kpi"><div class="k">Monthly pace</div>
      <div class="v">${usdK(monthlyPace)}</div>
      <div class="d">avg across ${monthsWithData} months</div></div>
    <div class="kpi"><div class="k">Avg per new matter</div>
      <div class="v">${usd0(avgPerNewMatter)}</div>
      <div class="d">real client work</div></div>
    <div class="kpi"><div class="k">Avg per entry</div>
      <div class="v">${usd0(avgPerFile)}</div>
      <div class="d">blended</div></div>
    <div class="kpi"><div class="k">Projected annual</div>
      <div class="v">${usdK(projectedAnnual)}</div>
      <div class="d">at current pace</div></div>
  </div>`;
}

function thermoSection(s){
  const total = s.total;
  const pct = total / CONFIG.yearGoal;
  const pctLabel = (pct * 100).toFixed(1);

  // Pace marker: where "on-pace" would be given today's date.
  const dayOfYear = Math.floor((Date.now() - new Date(CONFIG.year, 0, 1)) / (86400000));
  const paceRatio = Math.min(1, Math.max(0, dayOfYear / 365));
  const paceLeft = (paceRatio * 100).toFixed(1);
  const expectedByNow = CONFIG.yearGoal * paceRatio;
  const paceCopy = total >= expectedByNow
    ? `You're <b>ahead of pace</b> by ${usdK(total - expectedByNow)}.`
    : `You're <b>behind pace</b> by ${usdK(expectedByNow - total)}.`;

  return `<div class="thermo">
    <div class="row">
      <div class="goal">${usd0(total)} of ${usd0(CONFIG.yearGoal)} annual goal</div>
      <div class="pct">${pctLabel}%</div>
    </div>
    <div class="bar">
      <div class="fill ${pct>1?'over':''}" style="width:${Math.min(100, pct*100)}%"></div>
      <div class="pace-marker" style="left:${paceLeft}%"></div>
    </div>
    <div class="pace">${paceCopy} · Through day ${dayOfYear} of ${CONFIG.year} (${(paceRatio*100).toFixed(0)}% of the year).</div>
  </div>`;
}

function refundSpotlight(s){
  if(!s.refundList.length) return "";
  const total = s.refundList.reduce((a,r)=>a+r.fee,0);
  const latest = s.refundList.sort((a,b)=> String(b.date||"").localeCompare(String(a.date||"")))[0];
  const latestDate = latest.date ? String(latest.date).slice(0,10) : "unknown date";
  return `<div class="refund">
    <div class="icon">⚠️</div>
    <div class="body">
      <b>${s.refundList.length} refund${s.refundList.length>1?'s':''} totaling ${usd0(Math.abs(total))} this year</b>
      <small>Most recent: ${usd0(Math.abs(latest.fee))} · ${latest.name || '—'} · ${latestDate}</small>
    </div>
  </div>`;
}

function compositionSection(s){
  const total = s.total || 1;
  const segs = SEG_ORDER.map(k => ({
    key:k,
    rev:s.buckets[k].revenue,
    files:s.buckets[k].files,
    pct:(s.buckets[k].revenue/total)*100,
  })).filter(x => x.rev > 0);

  const stripHtml = segs.map(seg => `
    <div class="seg" style="background:${SEG_COLORS[seg.key]};flex:${seg.pct}"
         title="${seg.key}: ${usd0(seg.rev)} (${seg.pct.toFixed(1)}%)">
      ${seg.pct >= 6 ? seg.pct.toFixed(0)+'%' : ''}
    </div>
  `).join("");

  const legendHtml = segs.map(seg => `
    <div class="item">
      <span class="swatch" style="background:${SEG_COLORS[seg.key]}"></span>
      <b>${seg.key}</b>
      <span class="amt">${usd0(seg.rev)} · ${seg.pct.toFixed(1)}%</span>
    </div>
  `).join("");

  return `<div class="section">
    <h2>Revenue composition</h2>
    <p class="sh">How much of the total is genuine new-matter work vs. pooled or pass-through money. The honest growth number is the gold slice.</p>
    <div class="comp">${stripHtml}</div>
    <div class="comp-legend">${legendHtml}</div>
  </div>`;
}

function monthlyTrendSection(s, s25){
  const maxV = Math.max(1, ...s.byMonth, ...(s25.byMonth || []));
  const has25 = s25.byMonth && s25.byMonth.some(v => v > 0);

  const barsHtml = MONTH_NAMES.map((name, i) => {
    const cur = s.byMonth[i] || 0;
    const prev = (s25.byMonth && s25.byMonth[i]) || 0;
    const curH = (cur / maxV) * 130;
    const prevH = (prev / maxV) * 130;
    const yoyPct = prev > 0 ? ((cur-prev)/prev*100).toFixed(1) : null;
    const tipHtml = `
      <span class="tip">
        ${name} · ${CONFIG.year}: ${usdK(cur)}${has25 ? ` · 2025: ${usdK(prev)}` : ''}
        ${yoyPct !== null ? ` (${yoyPct>=0?'+':''}${yoyPct}%)` : ''}
      </span>`;
    return `<div class="m">
      ${tipHtml}
      <div class="bars">
        ${has25 ? `<div class="bar prev" style="height:${prevH}px"></div>` : ''}
        <div class="bar cur" style="height:${curH}px"></div>
      </div>
      <div class="lbl">${name}</div>
    </div>`;
  }).join("");

  const legendHtml = has25 ? `
    <div class="months-legend">
      <div class="item"><span class="swatch" style="background:#c7cfdd"></span>2025</div>
      <div class="item"><span class="swatch" style="background:var(--gold)"></span>${CONFIG.year}</div>
    </div>` : `
    <div class="months-legend">
      <div class="item"><span class="swatch" style="background:var(--gold)"></span>${CONFIG.year}</div>
    </div>`;

  return `<div class="section">
    <h2>Monthly trend</h2>
    <p class="sh">Total fees billed by month. Hover any bar for the exact number.</p>
    ${legendHtml}
    <div class="months">${barsHtml}</div>
  </div>`;
}

function attorneyAndMatterSection(s, s25){
  return `<div class="section">
    <h2>Where the money's coming from</h2>
    <p class="sh">New-matter revenue only — pooled APP / Registered Agent / Title / Referral money excluded so you see real client work.</p>
    <div class="cols">
      <div class="col">${rankedList("Originating attorney", s.byAttorney, s25.byAttorney, true)}</div>
      <div class="col">${rankedList("Matter type", s.byMatter, s25.byMatter, false)}</div>
    </div>
  </div>`;
}

function rankedList(title, dataMap, data25Map, isAttorney){
  const rows = Object.entries(dataMap)
    .map(([k, v]) => ({
      key:k,
      label: isAttorney ? attorneyLabel(k) : k,
      revenue: v.revenue,
      files: v.files,
      revenue25: (data25Map && data25Map[k]) ? data25Map[k].revenue : 0,
    }))
    .sort((a,b) => b.revenue - a.revenue);

  const total = rows.reduce((a,r)=>a+r.revenue,0);
  const has25 = rows.some(r => r.revenue25 > 0);

  const html = rows.map(r => {
    const pct = total > 0 ? (r.revenue/total*100).toFixed(1) : "0.0";
    const yoy = has25 && r.revenue25 > 0 ? ((r.revenue - r.revenue25)/r.revenue25*100).toFixed(1) : null;
    const yoyTag = yoy !== null ?
      `<span class="d ${yoy>=0?'up':'down'}" style="color:${yoy>=0?'var(--up)':'var(--down)'}">${yoy>=0?'▲':'▼'} ${Math.abs(yoy)}%</span>` : '';
    return `<div class="r">
      <span class="lbl">${r.label}<span class="files">· ${r.files}</span></span>
      <span class="v">${usd0(r.revenue)}</span>
      <span class="d">${pct}%</span>
      ${yoyTag}
    </div>`;
  }).join("");

  return `<div>
    <b style="color:var(--navy);font-size:.95rem">${title}</b>
    <div class="rank">${html || '<div style="color:var(--muted);padding:14px 4px">No entries yet.</div>'}</div>
  </div>`;
}

function recentBigSection(){
  // Recent big entries = top 10 new-matter fees this year
  const recent = ROWS
    .filter(r => classify(r) === "New-Matter" && num(r["Fee Billed"]) > 0)
    .sort((a,b) => num(b["Fee Billed"]) - num(a["Fee Billed"]))
    .slice(0, 10);

  const chips = recent.map(r => {
    const date = r["_date"] || r["Month"] || "";
    const dateStr = date ? String(date).slice(0,10) : "";
    return `<span class="chip">
      <span class="amt">${usd0(num(r["Fee Billed"]))}</span>
      <span class="name">${r["Client"] || '—'}</span>
      <span class="date">${dateStr}</span>
    </span>`;
  }).join("");

  return `<div class="section">
    <h2>Top 10 new-matter entries this year</h2>
    <p class="sh">The biggest single client fees in ${CONFIG.year}.</p>
    <div class="strip">${chips || '<div style="color:var(--muted);padding:14px 4px">No entries yet.</div>'}</div>
  </div>`;
}

function footerNote(){
  return `<div class="footer-note">
    Data pulled live from the <b>${CONFIG.year} Clients</b> sheet. Refresh to update.
    &nbsp;·&nbsp; Goal: <b>${usd0(CONFIG.yearGoal)}</b>
  </div>`;
}
</script>
</body>
</html>
