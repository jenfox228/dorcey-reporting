<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dorcey · Weekly Numbers</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#0f1f3a" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="DLF Numbers" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1f3a; --navy-2:#16294b; --gold:#c9a14a; --gold-soft:#e7d3a1;
    --parchment:#f6f1e4; --ink:#1b1b1b; --muted:#7d7666; --line:#e3dcc9;
    --ok:#2f7d57; --shadow:0 18px 40px -20px rgba(15,31,58,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Libre Franklin",system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -180px, #1d3b6b22 0,transparent 60%),
      var(--parchment);
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 140px}

  header.masthead{
    background:linear-gradient(160deg,var(--navy),var(--navy-2));
    color:var(--parchment); margin:0 -18px; padding:30px 24px 26px;
    border-bottom:3px solid var(--gold);
  }
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;
    margin:.25rem 0 .15rem;font-size:1.9rem;line-height:1.05}
  .masthead .sub{color:#c7cfdd;font-size:.92rem}
  .crest{display:inline-flex;gap:.5rem;align-items:center}
  .crest .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}

  /* Missed-week banner (top of page, only shown if last week is blank). */
  .miss{background:linear-gradient(120deg,#fbf6e8,#f3ead0);
    border:1px solid var(--gold);border-radius:14px;padding:14px 16px;
    margin:18px 0 -6px;display:flex;align-items:center;gap:12px;
    box-shadow:var(--shadow)}
  .miss .icon{font-size:1.3rem}
  .miss .text{flex:1;color:var(--navy)}
  .miss .text b{display:block;font-weight:700;font-size:.98rem;margin-bottom:1px}
  .miss .text small{display:block;color:var(--muted);font-size:.78rem}
  .miss button{border:0;background:var(--navy);color:#fff;border-radius:10px;
    padding:9px 14px;cursor:pointer;font:600 .85rem "Libre Franklin",sans-serif;
    white-space:nowrap}
  .miss button:hover{background:var(--navy-2)}

  .toggle{display:flex;gap:8px;margin:20px 0 6px;background:#fff;
    border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
  .toggle button{flex:1;border:0;background:transparent;padding:12px 8px;
    border-radius:10px;font:600 .95rem "Libre Franklin",sans-serif;color:var(--muted);
    cursor:pointer;transition:.18s}
  .toggle button .lbl{display:block;font-size:.72rem;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700}
  .toggle button .day{font-size:.78rem;font-weight:500;color:#a39c8b}
  .toggle button[aria-selected="true"]{background:var(--navy);color:#fff}
  .toggle button[aria-selected="true"] .day{color:var(--gold-soft)}

  .meta{display:flex;justify-content:space-between;align-items:baseline;
    margin:14px 2px 4px;color:var(--muted);font-size:.82rem}
  .meta b{color:var(--navy)}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;margin-top:10px}
  .field{display:flex;align-items:center;gap:14px;padding:13px 16px;
    border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:0}
  .field label{flex:1;font-size:.95rem;line-height:1.25}
  .field .hint{display:block;font-size:.72rem;color:#a39c8b;margin-top:2px}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:#faf7ef;color:var(--navy);font-size:1.25rem;line-height:1;cursor:pointer}
  .stepper button:active{transform:scale(.94)}
  .field input{width:64px;text-align:center;font:600 1.05rem "Libre Franklin",sans-serif;
    padding:9px 6px;border:1px solid var(--line);border-radius:9px;color:var(--navy);background:#fff}
  .field input.text{width:140px;text-align:left;font-weight:500}
  .field input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .changed{color:var(--gold);font-weight:700}

  /* Past-weeks section (collapsed by default). */
  .past{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden}
  .past .head{display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer;
    background:#faf7ef}
  .past .head:hover{background:#f3ecd6}
  .past .head .h-icon{font-size:1.05rem}
  .past .head .h-title{flex:1;font:700 .95rem "Libre Franklin",sans-serif;color:var(--navy)}
  .past .head .h-sub{font-size:.78rem;color:var(--muted)}
  .past .head .chev{font-size:1rem;color:var(--muted);transition:transform .18s}
  .past.open .head .chev{transform:rotate(90deg)}
  .past .body{display:none;padding:16px;border-top:1px solid var(--line)}
  .past.open .body{display:block}
  .past .wkpick{display:flex;gap:8px;margin-bottom:10px}
  .past .wkpick button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;
    padding:9px 8px;cursor:pointer;font:600 .82rem "Libre Franklin",sans-serif;color:var(--muted)}
  .past .wkpick button .b{display:block;font-size:.72rem;letter-spacing:.12em;
    text-transform:uppercase;color:var(--gold)}
  .past .wkpick button[aria-selected="true"]{background:var(--navy);color:#fff;border-color:var(--navy)}
  .past .wkpick button[aria-selected="true"] .b{color:var(--gold-soft)}
  .past .ptoggle{display:flex;gap:6px;margin:0 0 12px;background:#faf7ef;
    border:1px solid var(--line);border-radius:10px;padding:4px}
  .past .ptoggle button{flex:1;border:0;background:transparent;padding:8px 6px;
    border-radius:8px;font:600 .8rem "Libre Franklin",sans-serif;color:var(--muted);cursor:pointer}
  .past .ptoggle button[aria-selected="true"]{background:#fff;color:var(--navy);box-shadow:0 2px 6px -3px rgba(0,0,0,.2)}
  .past .pstatus{font-size:.78rem;color:var(--muted);margin:0 0 8px 2px}
  .past .pstatus b{color:var(--navy)}
  .past .pstatus .pill{display:inline-block;font-size:.7rem;font-weight:700;padding:2px 8px;
    border-radius:6px;margin-left:6px;letter-spacing:.04em}
  .past .pstatus .pill.backfill{background:#fbf3da;color:#7a5d10}
  .past .pstatus .pill.edit{background:#e8f0ff;color:#274a8a}
  .past .pbtn{width:100%;margin-top:10px;border:0;border-radius:11px;padding:13px;cursor:pointer;
    background:var(--navy);color:#fff;font:700 .95rem "Libre Franklin",sans-serif}
  .past .pbtn:disabled{opacity:.5}
  .past .psaved{margin-top:10px;font-size:.85rem;color:var(--ok);font-weight:600;text-align:center}
  .past .psaved.show{animation:fadeOut 3s forwards}
  @keyframes fadeOut{0%,70%{opacity:1}100%{opacity:0}}

  .barwrap{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--parchment) 70%,transparent);max-width:560px;margin:0 auto}
  .submit{width:100%;border:0;border-radius:13px;padding:16px;cursor:pointer;
    background:var(--gold);color:var(--navy);font:700 1.05rem "Libre Franklin",sans-serif;
    letter-spacing:.02em;box-shadow:var(--shadow)}
  .submit:disabled{opacity:.5}

  .toast{position:fixed;inset:0;background:rgba(15,31,58,.55);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:10}
  .toast.show{display:flex}
  .toast .box{background:#fff;border-radius:18px;max-width:380px;width:100%;
    padding:26px;text-align:center;border-top:4px solid var(--gold)}
  .toast h2{font-family:"Playfair Display",serif;color:var(--navy);margin:.2rem 0 .4rem}
  .toast .check{width:54px;height:54px;border-radius:50%;background:var(--ok);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 8px}
  .deltas{text-align:left;margin:14px 0;font-size:.9rem}
  .deltas div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .deltas .up{color:var(--ok);font-weight:700}
  .deltas .down{color:#b04a3a;font-weight:700}
  .toast button{margin-top:8px;border:0;background:var(--navy);color:#fff;border-radius:11px;
    padding:12px 22px;font:600 .95rem "Libre Franklin",sans-serif;cursor:pointer}
  #toastPrint{background:#fff;color:var(--navy);border:1px solid var(--navy);margin-right:8px}
  .streak{font-weight:700;color:var(--gold);background:#fbf6e8;border:1px solid #ecdca0;
    border-radius:10px;padding:8px 12px;margin:6px 0 2px;display:none}
  .streak.show{display:block}  .printbtn{width:100%;margin-top:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);
    border-radius:13px;padding:13px;cursor:pointer;font:600 .95rem "Libre Franklin",sans-serif}
  .loading{padding:80px 0;text-align:center;color:var(--muted)}

  /* Printable huddle sheet */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    .wrap,.masthead,.barwrap,.toast{display:none !important}
    #printArea{display:block;padding:24px;color:#000;font-family:"Libre Franklin",sans-serif}
    #printArea h1{font-family:"Playfair Display",serif;color:#0f1f3a;margin:0 0 4px;font-size:1.4rem;
      border-bottom:2px solid #c9a14a;padding-bottom:6px}
    #printArea table{width:100%;border-collapse:collapse;margin-top:14px}
    #printArea td{border-bottom:1px solid #ccc;padding:7px 4px;font-size:1rem}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="crest"><span class="dot"></span><span class="eyebrow">Dorcey Law Firm</span></div>
      <h1 id="greeting">Weekly Numbers</h1>
      <div class="sub" id="role">Loading your report…</div>
    </header>

    <!-- Missed-week banner (shown only if user didn't submit anything last week). -->
    <div class="miss" id="missBanner" hidden>
      <div class="icon">📅</div>
      <div class="text">
        <b>You missed last week.</b>
        <small>Want to add it now? You can fill in any week up to 2 weeks back.</small>
      </div>
      <button id="missJump">Add it →</button>
    </div>

    <div class="toggle" id="toggle" role="tablist" hidden>
      <button data-p="M" role="tab"><span class="lbl">Forecast</span><span class="day">Monday huddle</span></button>
      <button data-p="F" role="tab"><span class="lbl">Actuals</span><span class="day">Friday huddle</span></button>
    </div>

    <div class="meta" id="meta" hidden>
      <span>Week of <b id="weekOf"></b></span>
      <span id="statusNote"></span>
    </div>

    <div id="fields"><div class="loading">Pulling up your numbers…</div></div>

    <!-- Past-weeks editor (collapsed by default). Up to 2 weeks back. -->
    <div class="past" id="past" hidden>
      <div class="head" id="pastHead">
        <span class="h-icon">📝</span>
        <div class="h-title">Need to update a past week?
          <div class="h-sub" id="pastSub">Go back up to 2 weeks to fix or fill in.</div>
        </div>
        <span class="chev">›</span>
      </div>
      <div class="body" id="pastBody">
        <div class="wkpick" id="pastWkPick"></div>
        <div class="ptoggle" id="pastPToggle">
          <button data-p="M" aria-selected="true">Forecast (Mon)</button>
          <button data-p="F" aria-selected="false">Actuals (Fri)</button>
        </div>
        <div class="pstatus" id="pastStatus"></div>
        <div id="pastFields"></div>
        <button class="pbtn" id="pastSaveBtn">Save this week's numbers</button>
        <div class="psaved" id="pastSaved" hidden></div>
      </div>
    </div>
  </div>

  <div class="barwrap" id="bar" hidden>
    <button class="submit" id="submitBtn">Submit my numbers</button>
    <button class="printbtn" id="printBtn">🖨 Print for huddle</button>
  </div>

  <div class="toast" id="toast">
    <div class="box">
      <div class="check">✓</div>
      <h2>Sent to the huddle</h2>
      <div id="streakMsg" class="streak"></div>
      <p style="color:var(--muted);margin:.2rem 0 0" id="toastSub"></p>
      <div class="deltas" id="deltas"></div>
      <button id="toastPrint">🖨 Print for huddle</button>
      <button id="toastClose">Done</button>
    </div>
  </div>

  <!-- Printable huddle sheet (hidden on screen, shown only when printing) -->
  <div id="printArea"></div>

<script>
let STATE = null;           // /api/me payload
let period = "M";           // current tab (current-week form)
let PAST = null;            // /api/past-weeks payload
let pastWeek = null;        // ISO Monday of selected past week
let pastPeriod = "M";       // current tab in past-weeks section
const $ = (s)=>document.querySelector(s);

function fmtWeek(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

async function load(){
  const r = await fetch("/api/me");
  if(!r.ok){ document.body.innerHTML = "<p style='padding:40px;text-align:center'>Your link expired — ask Jen for a new one.</p>"; return; }
  STATE = await r.json();
  document.title = "Dorcey · " + (STATE.user.name || "Weekly Numbers");
  const who = STATE.user.person || (STATE.user.name||"there").split(" ")[0];
  const hr = new Date().getHours();
  const part = hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  $("#greeting").textContent = `${part}, ${who}`;
  $("#role").textContent = "Reporting for: " + STATE.user.name + (STATE.user.location? " · "+STATE.user.location : "");
  $("#weekOf").textContent = fmtWeek(STATE.weekOf);
  period = STATE.suggestedPeriod;
  $("#toggle").hidden = false; $("#meta").hidden = false; $("#bar").hidden = false;
  renderToggle(); render();

  // Show the missed-week banner if applicable. Hidden if they reported.
  if(STATE.missedLastWeek){ $("#missBanner").hidden = false; }

  // Kick off the past-weeks load in the background — non-blocking.
  loadPast();
}

function renderToggle(){
  document.querySelectorAll("#toggle button").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.p===period);
    b.onclick = ()=>{ period=b.dataset.p; renderToggle(); render(); };
  });
}

function valuesForRender(){
  // Show this week's entry if they've already submitted (so they can edit it);
  // otherwise open a BLANK form so they enter fresh numbers each week.
  const existing = STATE.existing[period];
  return existing && Object.keys(existing).length ? {vals:existing, edited:true}
                                                  : {vals:{}, edited:false};
}

function render(){
  const fields = period==="M" ? STATE.template.monday : STATE.template.friday;
  const {vals, edited} = valuesForRender();
  $("#statusNote").textContent = edited ? "Editing this week's entry" : "Enter this week's numbers";
  const host = $("#fields");
  host.innerHTML = `<div class="card">${fields.map(f=>row(f, vals[f.key])).join("")}</div>`;
  host.querySelectorAll(".stepper button").forEach(b=>{
    b.onclick=()=>{ const inp=document.getElementById("f_"+b.dataset.k);
      inp.value=Math.max(0,(parseInt(inp.value||0,10)+(b.dataset.d==="+"?1:-1))); };
  });
}

function row(f, v, idPrefix){
  // idPrefix lets us reuse the same row markup in both the current-week form
  // (default "f_") and the past-weeks form ("p_") without ID collisions.
  const pre = idPrefix || "f_";
  if(f.type==="text"){
    return `<div class="field"><label>${f.label}</label>
      <input class="text" id="${pre}${f.key}" type="text" value="${v??""}" /></div>`;
  }
  const val = (v??"")===""?"":v;
  return `<div class="field">
    <label>${f.label}</label>
    <div class="stepper">
      <button data-pre="${pre}" data-k="${f.key}" data-d="-" aria-label="minus">–</button>
      <input id="${pre}${f.key}" inputmode="numeric" pattern="[0-9]*" value="${val}" placeholder="0" />
      <button data-pre="${pre}" data-k="${f.key}" data-d="+" aria-label="plus">+</button>
    </div></div>`;
}

function collect(){
  const fields = period==="M" ? STATE.template.monday : STATE.template.friday;
  const data={};
  fields.forEach(f=>{
    const el=document.getElementById("f_"+f.key);
    if(!el) return;
    data[f.key] = f.type==="text" ? el.value.trim()
                 : (el.value===""? 0 : parseInt(el.value,10)||0);
  });
  return data;
}

$("#submitBtn").onclick = async ()=>{
  const btn=$("#submitBtn"); btn.disabled=true; btn.textContent="Sending…";
  const data=collect();
  const prev = STATE.prefill[period]||{};
  const r = await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({period,data})});
  btn.disabled=false; btn.textContent="Submit my numbers";
  if(!r.ok){ alert("Hmm, that didn't save. Try again?"); return; }
  showFeedback(data, prev);
  // refresh state so it now counts as "this week's entry"
  STATE.existing[period]=data;
};

function showFeedback(data, prev){
  const fields = (period==="M"?STATE.template.monday:STATE.template.friday)
    .filter(f=>f.type!=="text");
  // pick up to 4 most-changed numeric fields vs last week
  const rows = fields.map(f=>({label:f.label, now:+data[f.key]||0, was:+prev[f.key]||0}))
    .map(x=>({...x, d:x.now-x.was}))
    .filter(x=>x.d!==0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,4);
  const total = fields.reduce((s,f)=>s+(+data[f.key]||0),0);
  $("#toastSub").textContent = `${total} tracked this ${period==="M"?"forecast":"week"}.`;
  const n=(STATE.streak||0)+1, sm=$("#streakMsg");
  sm.textContent = n<=1 ? "🎉 You're on the board — first one in!" : `🔥 ${n} weeks in a row!`;
  sm.classList.add("show");
  $("#deltas").innerHTML = rows.length
    ? rows.map(x=>`<div><span>${x.label}</span>
        <span class="${x.d>0?"up":"down"}">${x.d>0?"+":""}${x.d} vs last wk</span></div>`).join("")
    : `<div style="border:0;color:var(--muted)">Steady with last week.</div>`;
  $("#toast").classList.add("show");
}
$("#toastClose").onclick=()=>$("#toast").classList.remove("show");

// ---- Past-weeks (last 2 weeks) -----------------------------------------

async function loadPast(){
  try{
    const r = await fetch("/api/past-weeks");
    if(!r.ok){ return; } // silently skip the section if the API fails
    PAST = await r.json();
    if(!PAST.weeks || !PAST.weeks.length) return;
    pastWeek = PAST.weeks[0].week;   // default to "last week"
    $("#past").hidden = false;
    renderPastWkPick();
    renderPastPToggle();
    renderPastForm();
  }catch(e){ /* ignore — past-weeks is optional */ }
}

// Stepper handler also services past-weeks fields (matches data-pre prefix).
document.addEventListener("click",(e)=>{
  const b = e.target.closest(".stepper button");
  if(!b) return;
  const pre = b.dataset.pre || "f_";
  const inp = document.getElementById(pre + b.dataset.k);
  if(!inp) return;
  inp.value = Math.max(0,(parseInt(inp.value||0,10)+(b.dataset.d==="+"?1:-1)));
});

$("#pastHead").onclick = ()=>{ $("#past").classList.toggle("open"); };

$("#missJump").onclick = ()=>{
  $("#past").classList.add("open");
  // Default to last week (already the default), make sure section is visible.
  document.getElementById("past").scrollIntoView({behavior:"smooth", block:"start"});
};

function renderPastWkPick(){
  $("#pastWkPick").innerHTML = PAST.weeks.map((w,i)=>{
    const lbl = i===0 ? "Last week" : "Two weeks ago";
    return `<button data-w="${w.week}" aria-selected="${w.week===pastWeek}">
      <span class="b">${lbl}</span>${fmtWeek(w.week)}</button>`;
  }).join("");
  $("#pastWkPick").querySelectorAll("button").forEach(b=>{
    b.onclick = ()=>{ pastWeek = b.dataset.w; renderPastWkPick(); renderPastForm(); };
  });
}

function renderPastPToggle(){
  $("#pastPToggle").querySelectorAll("button").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.p===pastPeriod);
    b.onclick = ()=>{ pastPeriod = b.dataset.p; renderPastPToggle(); renderPastForm(); };
  });
}

function pastExistingValues(){
  const w = PAST.weeks.find(x=>x.week===pastWeek);
  if(!w) return null;
  return w[pastPeriod].existing || null;
}

function renderPastForm(){
  const fields = pastPeriod==="M" ? PAST.template.monday : PAST.template.friday;
  const existing = pastExistingValues();
  const vals = existing || {};
  const action = existing ? "edit" : "backfill";
  const wkLbl = fmtWeek(pastWeek);

  // Status line above the form: what we're about to do.
  const pill = action==="edit"
    ? `<span class="pill edit">Editing existing</span>`
    : `<span class="pill backfill">Backfilling</span>`;
  $("#pastStatus").innerHTML = `Week of <b>${wkLbl}</b> · ${pastPeriod==="M"?"Forecast (Mon)":"Actuals (Fri)"} ${pill}`;

  // Save button label changes based on action so the user knows what they're doing.
  $("#pastSaveBtn").textContent = action==="edit" ? "Update these numbers" : "Save these numbers";

  $("#pastFields").innerHTML =
    `<div class="card">${fields.map(f=>row(f, vals[f.key], "p_")).join("")}</div>`;
}

function collectPast(){
  const fields = pastPeriod==="M" ? PAST.template.monday : PAST.template.friday;
  const data = {};
  fields.forEach(f=>{
    const el = document.getElementById("p_"+f.key);
    if(!el) return;
    data[f.key] = f.type==="text" ? el.value.trim()
                 : (el.value===""? 0 : parseInt(el.value,10)||0);
  });
  return data;
}

$("#pastSaveBtn").onclick = async ()=>{
  const btn = $("#pastSaveBtn");
  btn.disabled = true;
  const originalLabel = btn.textContent;
  btn.textContent = "Saving…";
  const data = collectPast();
  try{
    const r = await fetch("/api/submit-past", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ week:pastWeek, period:pastPeriod, data })
    });
    if(!r.ok){
      const err = await r.json().catch(()=>({}));
      alert("Couldn't save: " + (err.error || r.status));
      btn.disabled = false;
      btn.textContent = originalLabel;
      return;
    }
    const result = await r.json();
    // Update the local cache so the next render reflects the new state.
    const w = PAST.weeks.find(x=>x.week===pastWeek);
    if(w) w[pastPeriod].existing = data;
    renderPastForm();
    // Hide the missed-week banner if they just filled in last week.
    if(pastWeek === STATE.lastWeek){
      $("#missBanner").hidden = true;
    }
    // Confirmation message
    const saved = $("#pastSaved");
    saved.textContent = result.action === "backfill"
      ? "✓ Added — that week is now on the dashboard."
      : "✓ Updated — your changes are saved.";
    saved.hidden = false;
    saved.classList.remove("show"); // restart animation
    void saved.offsetWidth;          // force reflow
    saved.classList.add("show");
    setTimeout(()=>{ saved.hidden = true; }, 3200);
    btn.disabled = false;
    btn.textContent = "Update these numbers"; // it's now an edit
  }catch(e){
    alert("Network hiccup — try again?");
    btn.disabled = false;
    btn.textContent = originalLabel;
  }
};

function doPrint(){
  const fields = period==="M" ? STATE.template.monday : STATE.template.friday;
  const data = collect();
  const periodLabel = period==="M" ? "Forecast — Monday huddle" : "Actuals — Friday huddle";
  const rows = fields.map(f=>
    `<tr><td>${f.label}</td><td style="text-align:right;font-weight:700">${data[f.key]??(f.type==="text"?"":0)}</td></tr>`
  ).join("");
  $("#printArea").innerHTML = `
    <h1>Dorcey Law Firm — Weekly Numbers</h1>
    <div style="font-size:1.05rem;font-weight:600;color:#0f1f3a">${STATE.user.name}${STATE.user.location?" · "+STATE.user.location:""}</div>
    <div style="color:#555;margin-top:2px">Week of ${fmtWeek(STATE.weekOf)} &nbsp;·&nbsp; ${periodLabel}</div>
    <table>${rows}</table>
    <div style="margin-top:22px;font-size:.78rem;color:#888">Printed ${new Date().toLocaleString()}</div>`;
  window.print();
}
$("#printBtn").onclick = doPrint;
$("#toastPrint").onclick = doPrint;

load();
</script>
</body>
</html>
