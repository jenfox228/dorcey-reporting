<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Dorcey · Weekly Numbers</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1f3a; --navy-2:#16294b; --gold:#c9a14a; --gold-soft:#e7d3a1;
    --parchment:#f6f1e4; --ink:#1b1b1b; --muted:#7d7666; --line:#e3dcc9;
    --ok:#2f7d57; --shadow:0 18px 40px -20px rgba(15,31,58,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Libre Franklin",system-ui,sans-serif;
    background:
      radial-gradient(1200px 500px at 50% -180px, #1d3b6b22 0,transparent 60%),
      var(--parchment);
    color:var(--ink); -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 18px 140px}

  header.masthead{
    background:linear-gradient(160deg,var(--navy),var(--navy-2));
    color:var(--parchment); margin:0 -18px; padding:30px 24px 26px;
    border-bottom:3px solid var(--gold);
  }
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;
    margin:.25rem 0 .15rem;font-size:1.9rem;line-height:1.05}
  .masthead .sub{color:#c7cfdd;font-size:.92rem}
  .crest{display:inline-flex;gap:.5rem;align-items:center}
  .crest .dot{width:9px;height:9px;border-radius:50%;background:var(--gold)}

  .toggle{display:flex;gap:8px;margin:20px 0 6px;background:#fff;
    border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow)}
  .toggle button{flex:1;border:0;background:transparent;padding:12px 8px;
    border-radius:10px;font:600 .95rem "Libre Franklin",sans-serif;color:var(--muted);
    cursor:pointer;transition:.18s}
  .toggle button .lbl{display:block;font-size:.72rem;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700}
  .toggle button .day{font-size:.78rem;font-weight:500;color:#a39c8b}
  .toggle button[aria-selected="true"]{background:var(--navy);color:#fff}
  .toggle button[aria-selected="true"] .day{color:var(--gold-soft)}

  .meta{display:flex;justify-content:space-between;align-items:baseline;
    margin:14px 2px 4px;color:var(--muted);font-size:.82rem}
  .meta b{color:var(--navy)}

  .card{background:#fff;border:1px solid var(--line);border-radius:16px;
    box-shadow:var(--shadow);overflow:hidden;margin-top:10px}
  .field{display:flex;align-items:center;gap:14px;padding:13px 16px;
    border-bottom:1px solid var(--line)}
  .field:last-child{border-bottom:0}
  .field label{flex:1;font-size:.95rem;line-height:1.25}
  .field .hint{display:block;font-size:.72rem;color:#a39c8b;margin-top:2px}
  .stepper{display:flex;align-items:center;gap:6px}
  .stepper button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);
    background:#faf7ef;color:var(--navy);font-size:1.25rem;line-height:1;cursor:pointer}
  .stepper button:active{transform:scale(.94)}
  .field input{width:64px;text-align:center;font:600 1.05rem "Libre Franklin",sans-serif;
    padding:9px 6px;border:1px solid var(--line);border-radius:9px;color:var(--navy);background:#fff}
  .field input.text{width:140px;text-align:left;font-weight:500}
  .field input:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .changed{color:var(--gold);font-weight:700}

  .barwrap{position:fixed;left:0;right:0;bottom:0;padding:14px 18px calc(14px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--parchment) 70%,transparent);max-width:560px;margin:0 auto}
  .submit{width:100%;border:0;border-radius:13px;padding:16px;cursor:pointer;
    background:var(--gold);color:var(--navy);font:700 1.05rem "Libre Franklin",sans-serif;
    letter-spacing:.02em;box-shadow:var(--shadow)}
  .submit:disabled{opacity:.5}

  .toast{position:fixed;inset:0;background:rgba(15,31,58,.55);display:none;
    align-items:center;justify-content:center;padding:24px;z-index:10}
  .toast.show{display:flex}
  .toast .box{background:#fff;border-radius:18px;max-width:380px;width:100%;
    padding:26px;text-align:center;border-top:4px solid var(--gold)}
  .toast h2{font-family:"Playfair Display",serif;color:var(--navy);margin:.2rem 0 .4rem}
  .toast .check{width:54px;height:54px;border-radius:50%;background:var(--ok);color:#fff;
    display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 8px}
  .deltas{text-align:left;margin:14px 0;font-size:.9rem}
  .deltas div{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--line)}
  .deltas .up{color:var(--ok);font-weight:700}
  .deltas .down{color:#b04a3a;font-weight:700}
  .toast button{margin-top:8px;border:0;background:var(--navy);color:#fff;border-radius:11px;
    padding:12px 22px;font:600 .95rem "Libre Franklin",sans-serif;cursor:pointer}
  #toastPrint{background:#fff;color:var(--navy);border:1px solid var(--navy);margin-right:8px}
  .printbtn{width:100%;margin-top:8px;border:1px solid var(--navy);background:#fff;color:var(--navy);
    border-radius:13px;padding:13px;cursor:pointer;font:600 .95rem "Libre Franklin",sans-serif}
  .loading{padding:80px 0;text-align:center;color:var(--muted)}

  /* Printable huddle sheet */
  #printArea{display:none}
  @media print{
    body{background:#fff}
    .wrap,.masthead,.barwrap,.toast{display:none !important}
    #printArea{display:block;padding:24px;color:#000;font-family:"Libre Franklin",sans-serif}
    #printArea h1{font-family:"Playfair Display",serif;color:#0f1f3a;margin:0 0 4px;font-size:1.4rem;
      border-bottom:2px solid #c9a14a;padding-bottom:6px}
    #printArea table{width:100%;border-collapse:collapse;margin-top:14px}
    #printArea td{border-bottom:1px solid #ccc;padding:7px 4px;font-size:1rem}
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="crest"><span class="dot"></span><span class="eyebrow">Dorcey Law Firm</span></div>
      <h1 id="greeting">Weekly Numbers</h1>
      <div class="sub" id="role">Loading your report…</div>
    </header>

    <div class="toggle" id="toggle" role="tablist" hidden>
      <button data-p="M" role="tab"><span class="lbl">Forecast</span><span class="day">Monday huddle</span></button>
      <button data-p="F" role="tab"><span class="lbl">Actuals</span><span class="day">Friday huddle</span></button>
    </div>

    <div class="meta" id="meta" hidden>
      <span>Week of <b id="weekOf"></b></span>
      <span id="statusNote"></span>
    </div>

    <div id="fields"><div class="loading">Pulling up your numbers…</div></div>
  </div>

  <div class="barwrap" id="bar" hidden>
    <button class="submit" id="submitBtn">Submit my numbers</button>
    <button class="printbtn" id="printBtn">🖨 Print for huddle</button>
  </div>

  <div class="toast" id="toast">
    <div class="box">
      <div class="check">✓</div>
      <h2>Sent to the huddle</h2>
      <p style="color:var(--muted);margin:.2rem 0 0" id="toastSub"></p>
      <div class="deltas" id="deltas"></div>
      <button id="toastPrint">🖨 Print for huddle</button>
      <button id="toastClose">Done</button>
    </div>
  </div>

  <!-- Printable huddle sheet (hidden on screen, shown only when printing) -->
  <div id="printArea"></div>

<script>
let STATE = null;        // /api/me payload
let period = "M";        // current tab
const $ = (s)=>document.querySelector(s);

function fmtWeek(iso){
  const d = new Date(iso+"T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

async function load(){
  const r = await fetch("/api/me");
  if(!r.ok){ document.body.innerHTML = "<p style='padding:40px;text-align:center'>Your link expired — ask Jen for a new one.</p>"; return; }
  STATE = await r.json();
  document.title = "Dorcey · " + (STATE.user.name || "Weekly Numbers");
  const who = STATE.user.person || (STATE.user.name||"there").split(" ")[0];
  const hr = new Date().getHours();
  const part = hr<12?"Good morning":hr<17?"Good afternoon":"Good evening";
  $("#greeting").textContent = `${part}, ${who}`;
  $("#role").textContent = "Reporting for: " + STATE.user.name + (STATE.user.location? " · "+STATE.user.location : "");
  $("#weekOf").textContent = fmtWeek(STATE.weekOf);
  period = STATE.suggestedPeriod;
  $("#toggle").hidden = false; $("#meta").hidden = false; $("#bar").hidden = false;
  renderToggle(); render();
}

function renderToggle(){
  document.querySelectorAll("#toggle button").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.p===period);
    b.onclick = ()=>{ period=b.dataset.p; renderToggle(); render(); };
  });
}

function valuesForRender(){
  // Prefer what they've already entered this week; otherwise prefill last week.
  const existing = STATE.existing[period];
  return existing && Object.keys(existing).length ? {vals:existing, edited:true}
                                                  : {vals:STATE.prefill[period]||{}, edited:false};
}

function render(){
  const fields = period==="M" ? STATE.template.monday : STATE.template.friday;
  const {vals, edited} = valuesForRender();
  $("#statusNote").textContent = edited ? "Editing this week's entry" : "Pre-filled from last week";
  const host = $("#fields");
  host.innerHTML = `<div class="card">${fields.map(f=>row(f, vals[f.key])).join("")}</div>`;
  host.querySelectorAll(".stepper button").forEach(b=>{
    b.onclick=()=>{ const inp=document.getElementById("f_"+b.dataset.k);
      inp.value=Math.max(0,(parseInt(inp.value||0,10)+(b.dataset.d==="+"?1:-1))); };
  });
}

function row(f, v){
  if(f.type==="text"){
    return `<div class="field"><label>${f.label}</label>
      <input class="text" id="f_${f.key}" type="text" value="${v??""}" /></div>`;
  }
  const val = (v??"")===""?"":v;
  return `<div class="field">
    <label>${f.label}</label>
    <div class="stepper">
      <button data-k="${f.key}" data-d="-" aria-label="minus">–</button>
      <input id="f_${f.key}" inputmode="numeric" pattern="[0-9]*" value="${val}" placeholder="0" />
      <button data-k="${f.key}" data-d="+" aria-label="plus">+</button>
    </div></div>`;
}

function collect(){
  const fields = period==="M" ? STATE.template.monday : STATE.template.friday;
  const data={};
  fields.forEach(f=>{
    const el=document.getElementById("f_"+f.key);
    if(!el) return;
    data[f.key] = f.type==="text" ? el.value.trim()
                 : (el.value===""? 0 : parseInt(el.value,10)||0);
  });
  return data;
}

$("#submitBtn").onclick = async ()=>{
  const btn=$("#submitBtn"); btn.disabled=true; btn.textContent="Sending…";
  const data=collect();
  const prev = STATE.prefill[period]||{};
  const r = await fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({period,data})});
  btn.disabled=false; btn.textContent="Submit my numbers";
  if(!r.ok){ alert("Hmm, that didn't save. Try again?"); return; }
  showFeedback(data, prev);
  // refresh state so it now counts as "this week's entry"
  STATE.existing[period]=data;
};

function showFeedback(data, prev){
  const fields = (period==="M"?STATE.template.monday:STATE.template.friday)
    .filter(f=>f.type!=="text");
  // pick up to 4 most-changed numeric fields vs last week
  const rows = fields.map(f=>({label:f.label, now:+data[f.key]||0, was:+prev[f.key]||0}))
    .map(x=>({...x, d:x.now-x.was}))
    .filter(x=>x.d!==0).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)).slice(0,4);
  const total = fields.reduce((s,f)=>s+(+data[f.key]||0),0);
  $("#toastSub").textContent = `${total} tracked this ${period==="M"?"forecast":"week"}.`;
  $("#deltas").innerHTML = rows.length
    ? rows.map(x=>`<div><span>${x.label}</span>
        <span class="${x.d>0?"up":"down"}">${x.d>0?"+":""}${x.d} vs last wk</span></div>`).join("")
    : `<div style="border:0;color:var(--muted)">Steady with last week.</div>`;
  $("#toast").classList.add("show");
}
$("#toastClose").onclick=()=>$("#toast").classList.remove("show");

function doPrint(){
  const fields = period==="M" ? STATE.template.monday : STATE.template.friday;
  const data = collect();
  const periodLabel = period==="M" ? "Forecast — Monday huddle" : "Actuals — Friday huddle";
  const rows = fields.map(f=>
    `<tr><td>${f.label}</td><td style="text-align:right;font-weight:700">${data[f.key]??(f.type==="text"?"":0)}</td></tr>`
  ).join("");
  $("#printArea").innerHTML = `
    <h1>Dorcey Law Firm — Weekly Numbers</h1>
    <div style="font-size:1.05rem;font-weight:600;color:#0f1f3a">${STATE.user.name}${STATE.user.location?" · "+STATE.user.location:""}</div>
    <div style="color:#555;margin-top:2px">Week of ${fmtWeek(STATE.weekOf)} &nbsp;·&nbsp; ${periodLabel}</div>
    <table>${rows}</table>
    <div style="margin-top:22px;font-size:.78rem;color:#888">Printed ${new Date().toLocaleString()}</div>`;
  window.print();
}
$("#printBtn").onclick = doPrint;
$("#toastPrint").onclick = doPrint;

load();
</script>
</body>
</html>
