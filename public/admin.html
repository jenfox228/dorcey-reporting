<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dorcey · Reporting Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{--navy:#0f1f3a;--gold:#c9a14a;--parchment:#f6f1e4;--line:#e3dcc9;--muted:#7d7666;--ok:#2f7d57}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Libre Franklin",system-ui,sans-serif;background:var(--parchment);color:#1b1b1b}
  header{background:var(--navy);color:var(--parchment);padding:24px;border-bottom:3px solid var(--gold)}
  header h1{font-family:"Playfair Display",serif;margin:.2rem 0;font-size:1.5rem}
  header .eyebrow{font-size:.7rem;letter-spacing:.3em;text-transform:uppercase;color:#e7d3a1}
  .wrap{max-width:780px;margin:0 auto;padding:22px 18px 80px}
  p.lead{color:var(--muted);font-size:.92rem}
  table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);
    border-radius:14px;overflow:hidden;box-shadow:0 16px 36px -22px rgba(15,31,58,.4)}
  th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);font-size:.92rem;vertical-align:middle}
  th{background:#faf7ef;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  tr:last-child td{border-bottom:0}
  .name{font-weight:600;color:var(--navy)}
  .tpl{color:var(--muted);font-size:.8rem}
  .badge{font-size:.68rem;background:var(--gold);color:var(--navy);padding:2px 7px;border-radius:6px;font-weight:700}
  button.link{border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:9px;
    padding:8px 12px;font:600 .85rem "Libre Franklin",sans-serif;cursor:pointer;white-space:nowrap}
  button.link:hover{background:var(--navy);color:#fff}
  .copied{color:var(--ok);font-weight:700;font-size:.82rem}
  .urlcell{font-size:.74rem;color:var(--muted);word-break:break-all;max-width:280px}
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Dorcey Law Firm</div>
    <h1>Weekly Reporting — Admin</h1>
  </header>
  <div class="wrap">
    <p class="lead">Generate a one-tap sign-in link for anyone, then text or email it to them.
    Links are good for 3 days. Once automated email is wired up, this becomes the fallback / manual override.</p>
    <table id="tbl"><thead><tr><th>Name</th><th>Template</th><th>Link</th></tr></thead>
      <tbody id="rows"><tr><td colspan="3" style="color:var(--muted)">Loading team…</td></tr></tbody>
    </table>
  </div>
<script>
async function load(){
  const r = await fetch("/api/admin/users");
  if(!r.ok){ document.getElementById("rows").innerHTML="<tr><td colspan=3>Admins only.</td></tr>"; return; }
  const {users} = await r.json();
  document.getElementById("rows").innerHTML = users.map(u=>`
    <tr data-id="${u.id}">
      <td><span class="name">${u.name}</span> ${u.is_admin?'<span class="badge">admin</span>':''}<br>
        <span class="tpl">${u.email}</span></td>
      <td class="tpl">${u.template_key}${u.location? " · "+u.location:""}</td>
      <td><button class="link" onclick="gen(${u.id},this)">Generate link</button>
        ${u.is_admin?`<button class="link" style="margin-left:6px" onclick="genDash(${u.id},this)">Dashboard link</button>`:''}
        <div class="urlcell"></div></td>
    </tr>`).join("");
}
async function genDash(id, btn){
  btn.textContent="…";
  const r = await fetch("/api/admin/dashlink",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user_id:id})});
  const {url} = await r.json();
  const cell = btn.parentElement.querySelector(".urlcell");
  cell.textContent = url;
  btn.textContent="Copy dashboard link";
  btn.onclick=async()=>{ await navigator.clipboard.writeText(url);
    btn.textContent="Copied ✓"; btn.classList.add("copied"); setTimeout(()=>btn.textContent="Copy dashboard link",1500); };
}
async function gen(id, btn){
  btn.textContent="…";
  const r = await fetch("/api/admin/link",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({user_id:id})});
  const {url} = await r.json();
  const cell = btn.parentElement.querySelector(".urlcell");
  cell.textContent = url;
  btn.textContent="Copy";
  btn.onclick=async()=>{ await navigator.clipboard.writeText(url);
    btn.textContent="Copied ✓"; btn.classList.add("copied"); setTimeout(()=>btn.textContent="Copy",1500); };
}
load();
</script>
</body>
</html>
