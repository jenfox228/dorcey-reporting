<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dorcey · Attorney Reports</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1d33; --navy-2:#1b2f4d; --gold:#c6a04e; --gold-soft:#e3cd97;
    --cream:#f7f3ea; --parchment:#f6f1e4; --ink:#2a2a2a; --muted:#7d7666;
    --line:#e7e0d2; --up:#2d6a4f; --down:#9b2335; --shadow:0 16px 38px -22px rgba(15,29,51,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Libre Franklin",system-ui,sans-serif;background:var(--parchment);color:var(--ink)}
  a{color:inherit}

  .topnav{background:#0a1732;display:flex;justify-content:center;gap:2px;
    border-bottom:1px solid rgba(198,160,78,.25)}
  .topnav a{flex:1;max-width:170px;text-align:center;padding:12px 8px;
    color:#c7cfdd;text-decoration:none;font:600 .82rem "Libre Franklin",sans-serif;
    letter-spacing:.08em;text-transform:uppercase;border-bottom:3px solid transparent;
    transition:background .15s,color .15s,border-color .15s}
  .topnav a:hover{background:#132849;color:#e3cd97}
  .topnav a.active{color:var(--gold);border-bottom-color:var(--gold);background:#132849}
  .topnav a .ico{display:block;font-size:1.05rem;margin-bottom:2px}

  header.masthead{background:linear-gradient(155deg,var(--navy),var(--navy-2));color:var(--cream);
    padding:22px 28px;border-bottom:3px solid var(--gold)}
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;margin:.15rem 0 .1rem;font-size:1.6rem}
  .masthead .sub{color:#c7cfdd;font-size:.86rem}
  .wrap{max-width:1000px;margin:0 auto;padding:20px 20px 60px}
  .loading{padding:80px;text-align:center;color:var(--muted)}
  .error{padding:40px;text-align:center;color:var(--down);background:#fff;border-radius:14px;box-shadow:var(--shadow)}

  /* Control bar */
  .controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:20px}
  .controls .grp{display:flex;align-items:center;gap:8px}
  .controls label{font:700 .72rem "Libre Franklin";letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .controls select{font:500 .95rem "Libre Franklin";padding:9px 12px;border:1px solid var(--line);
    border-radius:9px;background:#fff;color:var(--ink);min-width:200px}
  .controls select:focus{outline:2px solid var(--gold);border-color:var(--gold)}
  .togchip{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:9px;padding:3px}
  .togchip button{border:0;background:transparent;padding:8px 14px;border-radius:6px;cursor:pointer;
    font:600 .8rem "Libre Franklin";color:var(--muted)}
  .togchip button[aria-selected="true"]{background:var(--navy);color:#fff}
  .printbtn{margin-left:auto;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;
    padding:10px 16px;font:600 .88rem "Libre Franklin";cursor:pointer}
  .printbtn:hover{background:var(--navy);color:#fff}

  /* Report card */
  .report{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
    padding:26px 30px;margin-bottom:24px}
  .report .rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;
    border-bottom:2px solid var(--gold);padding-bottom:14px;margin-bottom:20px;flex-wrap:wrap}
  .report .rhead .who{font-family:"Playfair Display",serif;font-size:1.5rem;color:var(--navy);margin:0}
  .report .rhead .lens{font-size:.78rem;color:var(--muted);margin-top:3px}
  .report .rhead .firm{text-align:right;font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}

  .sec-label{font:700 .74rem "Libre Franklin";letter-spacing:.12em;text-transform:uppercase;
    color:var(--navy);margin:22px 0 10px;padding-bottom:5px;border-bottom:1px solid var(--line)}
  .sec-label:first-of-type{margin-top:0}

  .statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
  .statgrid.three{grid-template-columns:repeat(3,1fr)}
  .stat{background:var(--parchment);border:1px solid var(--line);border-radius:11px;padding:13px 15px}
  .stat.hero{background:linear-gradient(150deg,var(--navy),var(--navy-2));border-color:var(--navy)}
  .stat.hero .k{color:var(--gold-soft)} .stat.hero .v{color:#fff} .stat.hero .d{color:#c7cfdd}
  .stat.hero .v.up,.stat.hero .v.down,.stat.hero .v.flat{color:#fff}
  .stat.hero .d .vs{color:var(--gold-soft)}
  .stat .k{font-size:.66rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat .v{font-family:"Playfair Display",serif;font-size:1.45rem;color:var(--navy);line-height:1.1;margin-top:4px}
  .stat .d{font-size:.74rem;color:var(--muted);margin-top:3px}
  .stat .d .up{color:var(--up);font-weight:700}
  .stat .d .down{color:var(--down);font-weight:700}
  .stat .d .flat{color:var(--muted);font-weight:700}
  .stat .v.up{color:var(--up)}
  .stat .v.down{color:var(--down)}
  .stat .v.flat{color:var(--navy)}
  .stat .d .vs{color:var(--muted)}
  .bigmoney{font-weight:700}
  .bigmoney.up{color:var(--up)}
  .bigmoney.down{color:var(--down)}
  .bigmoney.flat{color:var(--navy)}

  /* Monthly / quarterly bars */
  .bars{display:flex;align-items:flex-end;gap:10px;height:170px;margin-top:8px;padding-bottom:20px}
  .bars .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
  .bars .col .pair{width:100%;display:flex;gap:3px;align-items:flex-end;height:135px;justify-content:center}
  .bars .col .bar{width:42%;max-width:26px;border-radius:4px 4px 0 0;transition:height .5s;min-height:2px}
  .bars .col .bar.prev{background:#c7cfdd}
  .bars .col .bar.cur{background:var(--gold)}
  .bars .col .lbl{font-size:.72rem;color:var(--muted);margin-top:7px;font-weight:600}
  .bars .col .tip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:5px 9px;border-radius:6px;font-size:.7rem;white-space:nowrap;
    opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
  .bars .col:hover .tip{opacity:1}
  .barlegend{display:flex;gap:16px;font-size:.74rem;color:var(--muted);justify-content:flex-end;margin-top:-6px}
  .barlegend .item{display:flex;align-items:center;gap:6px}
  .barlegend .sw{width:14px;height:12px;border-radius:2px}

  /* Fee distribution (price-point breakdown) */
  .dist{margin-top:10px}
  .distbars{display:flex;align-items:flex-end;gap:6px;height:180px;padding-bottom:4px}
  .distbars .dcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;
    align-items:center;position:relative;height:100%}
  .distbars .dcol .dbar{width:100%;max-width:52px;background:var(--gold);border-radius:5px 5px 0 0;
    min-height:3px;transition:height .5s}
  .distbars .dcol.median .dbar{background:var(--navy)}
  .distbars .dcol .dn{font-size:.74rem;font-weight:700;color:var(--navy);margin-bottom:4px}
  .distbars .dcol .dtip{position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);
    background:var(--navy);color:#fff;padding:6px 10px;border-radius:6px;font-size:.72rem;
    white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:10}
  .distbars .dcol:hover .dtip{opacity:1}
  .distlabels{display:flex;gap:6px;margin-top:6px}
  .distlabels .dl{flex:1;text-align:center;font-size:.63rem;color:var(--muted);
    line-height:1.25;font-weight:600}
  .distlabels .dl .damt{display:block;font-size:.6rem;color:#a39c8b;font-weight:500;margin-top:2px}
  .distnote{font-size:.74rem;color:var(--muted);margin-top:12px;line-height:1.5}
  .distnote b{color:var(--navy)}
  .distkey{display:flex;gap:16px;font-size:.72rem;color:var(--muted);justify-content:flex-end;
    margin-bottom:4px;flex-wrap:wrap}
  .distkey .item{display:flex;align-items:center;gap:6px}
  .distkey .sw{width:13px;height:11px;border-radius:2px}

  /* Category table */
  table.cat{border-collapse:collapse;width:100%;font-size:.86rem;margin-top:6px}
  table.cat th,table.cat td{padding:9px 11px;text-align:right;border-bottom:1px dashed var(--line);white-space:nowrap}
  table.cat th{font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
  table.cat th:first-child,table.cat td:first-child{text-align:left}
  table.cat td.cat-name{font-weight:600;color:var(--navy)}
  table.cat tr:hover td{background:var(--parchment)}
  table.cat tr.totrow td{border-top:2px solid var(--line);font-weight:700;color:var(--navy)}
  table.cat tr.rollup td{color:var(--muted)}
  table.cat tr.rollup td.cat-name{color:var(--muted);font-weight:600}
  table.cat .up{color:var(--up);font-weight:700} table.cat .down{color:var(--down);font-weight:700}
  table.cat .flat{color:var(--muted)}
  table.cat .zeroflag{font-size:.68rem;color:#a39c8b;font-weight:500}
  table.cat .rolltag{font-size:.64rem;color:#a39c8b;font-weight:500;letter-spacing:.04em}

  /* Reconciliation block */
  .recon{background:var(--parchment);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-top:6px}
  .recon .rr{display:flex;justify-content:space-between;align-items:baseline;gap:14px;
    padding:8px 2px;border-bottom:1px dashed var(--line);font-size:.88rem}
  .recon .rr:last-of-type{border-bottom:0}
  .recon .rr .rl{color:var(--ink)}
  .recon .rr .rl small{display:block;color:var(--muted);font-size:.72rem;margin-top:1px}
  .recon .rr .rv{font-weight:700;color:var(--navy);white-space:nowrap;font-variant-numeric:tabular-nums}
  .recon .rr.sub .rl{padding-left:16px;color:var(--muted)}
  .recon .rr.sub .rv{font-weight:600;color:var(--muted)}
  .recon .rr.grand{border-top:2px solid var(--navy);border-bottom:0;margin-top:6px;padding-top:11px}
  .recon .rr.grand .rl{font-weight:700;color:var(--navy)}
  .recon .rr.grand .rv{font-size:1.1rem;color:var(--navy)}
  .recon .check{margin-top:12px;font-size:.76rem;padding:9px 12px;border-radius:8px;line-height:1.5}
  .recon .check.ok{background:#eaf3ee;color:#1f5c3d;border:1px solid #bcd9c8}
  .recon .check.off{background:#fbeceb;color:#8a2b23;border:1px solid #e8bdb8}

  .leaderboard table.cat td.cat-name{cursor:default}
  .footer-note{text-align:center;font-size:.72rem;color:var(--muted);margin-top:20px}
  .subtle{font-size:.76rem;color:var(--muted);margin:2px 0 0}

  /* Client ledger — the receipt */
  .lsearch{width:100%;padding:9px 13px;border:1px solid var(--line);border-radius:9px;
    font:500 .88rem "Libre Franklin";background:var(--parchment);margin:0 0 8px;outline:none}
  .lsearch:focus{border-color:var(--gold);background:#fff}
  .ledger{border:1px solid var(--line);border-radius:10px;max-height:360px;overflow-y:auto}
  .lrow{display:grid;grid-template-columns:92px 1.5fr 1.1fr 96px;gap:10px;padding:7px 12px;
    border-bottom:1px dashed var(--line);font-size:.83rem;align-items:center}
  .lrow:last-child{border-bottom:0}
  .lrow:nth-child(even):not(.lhead){background:#faf7ef}
  .lrow.lhead{position:sticky;top:0;background:#f3ecd6;font-size:.66rem;letter-spacing:.08em;
    text-transform:uppercase;color:var(--muted);font-weight:700;z-index:1}
  .lrow .ld{color:var(--muted);font-size:.76rem;white-space:nowrap}
  .lrow .lc{font-weight:600;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .lm{color:var(--muted);font-size:.82rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lrow .lf{text-align:right;font-weight:700;color:var(--navy);white-space:nowrap}
  .lrow .lf.neg{color:var(--down)}
  .lrow .lf.zero{color:#a39c8b}
  .lcount{text-align:right;margin-top:7px}
  @media(max-width:820px){
    .lrow{grid-template-columns:80px 1fr 90px}
    .lrow .lm{display:none}
  }

  @media(max-width:820px){
    .statgrid,.statgrid.three{grid-template-columns:repeat(2,1fr)}
    .controls select{min-width:150px}
    .distlabels .dl{font-size:.55rem}
    .distbars .dcol .dn{font-size:.62rem}
  }

  /* Print: strip nav/controls, one report per page, ink-friendly */
  @media print{
    .topnav,.controls,.printbtn,.masthead .sub,.lsearch{display:none !important}
    .ledger{max-height:none;overflow:visible}
    body{background:#fff}
    header.masthead{border-bottom:2px solid var(--gold);padding:12px 20px}
    .wrap{max-width:none;padding:0}
    .report{box-shadow:none;border:1px solid #ccc;page-break-inside:avoid;margin:0 0 14px}
    .stat.hero{background:#0f1d33 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .bars .col .bar.cur{background:#c6a04e !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .bars .col .bar.prev{background:#c7cfdd !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .distbars .dcol .dbar{background:#c6a04e !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .distbars .dcol.median .dbar{background:#0f1d33 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
    .stat,.recon{background:#f6f1e4 !important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
  <nav class="topnav">
    <a href="/admin"><span class="ico">⚙️</span>Admin</a>
    <a href="/dashboard"><span class="ico">📊</span>Dashboard</a>
    <a href="/pulse"><span class="ico">💰</span>Pulse</a>
    <a href="/financials"><span class="ico">🧾</span>Financials</a>
    <a href="/app"><span class="ico">🧭</span>APP</a>
    <a href="/reports" class="active"><span class="ico">📄</span>Reports</a>
  </nav>
  <header class="masthead">
    <div class="eyebrow">Dorcey Law Firm · Attorney Performance</div>
    <h1>Attorney Reports</h1>
    <div class="sub" id="periodLabel">Loading…</div>
  </header>

  <div class="wrap">
    <div id="controls"></div>
    <div id="content"><div class="loading">Fetching the numbers…</div></div>
  </div>

<script>
// ---------------------------------------------------------------------------
// DORCEY ATTORNEY REPORTS — reuses the Pulse revenue feed.
// Two views: an individual attorney scorecard, and a leadership combined
// comparison. Each shows year-to-date vs. the same period last year, average
// fee, file-type (category) mix, office split, a fee-distribution breakdown,
// and the full file ledger. Attribution toggles between originating and
// closing attorney.
//
// EVERYTHING IS YEAR-TO-DATE. `hi` comes from ytdCutoffMonth() — the last
// month with any 2026 data — and EVERY call to statBlock passes 0..hi for
// both years, including the monthly chart. Earlier the chart alone pulled
// 2025's full twelve months, which drew tall grey bars for Aug–Dec against
// empty 2026 bars and read as a collapse that hadn't happened.
//
// AVERAGES EXCLUDE $0 FILES. Refunded matters and pro bono work land in the
// sheet at $0; counting them in the denominator dragged every average down.
// File COUNTS still include them — the work happened.
//
// ADM (Admin Onboarding) appears in the leaderboard at Josh's request, since
// excluding it made the firm total disagree with the Pulse. It's a rollup
// rather than a person, so it sinks to the bottom of the ranking. DLF (house)
// and APP (bulk) stay out of the ranking but are accounted for explicitly in
// the reconciliation at the foot of the leadership view.
//
// Access model (server-enforced):
//   - admins + report_access users hitting /reports see the full picker,
//     including the leadership view and any individual.
//   - an attorney arriving on /reports/<token> is PINNED to their own code
//     (server sends only their rows and echoes {pinned:"CODE"}); the picker,
//     the leadership view, and the firm reconciliation are all hidden — a
//     reconciliation built from one attorney's rows would be nonsense.
// ---------------------------------------------------------------------------

const CONFIG = { yearGoal: 9000000, year: 2026 };

const MONTH_NAMES = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const ATTORNEY_NAMES = {
  "JOD":"Josh Dorcey","MAS":"Mike Scott","EDJ":"Erica Johnson","KAS":"Kara Sajdak",
  "DAD":"Doug Dodson","BWB":"Brad Butcher","BHB":"Brian Bronsther","DAC":"David Cahoone",
  "ADM":"Admin Onboarding",
};
// Codes that are rollups rather than people. ADM is listed here so it can be
// sunk to the bottom of the ranking, but it IS shown — unlike DLF and APP.
const ROLLUP_CODES = new Set(["ADM"]);
// Codes kept out of the attorney ranking entirely. They're surfaced in the
// reconciliation instead, so no dollar goes missing.
const EXCLUDED_CODES = new Set(["DLF","APP",""]);

// Friendly names for the non-attorney credit codes, used in reconciliation.
const OTHER_CODE_NAMES = {
  "DLF":"House (Dorcey Law Firm)",
  "APP":"APP (bulk billing)",
  "":"Unassigned",
};

// Fee bands for the distribution. Tight where the deeds and small matters
// cluster ($500 steps up to $1,500), widening as fees climb so a single
// $40K advanced-planning matter doesn't generate eighty empty buckets.
const FEE_BANDS = [
  { lo:0,     hi:500,    label:"$0–500" },
  { lo:501,   hi:1000,   label:"$501–1K" },
  { lo:1001,  hi:1500,   label:"$1K–1.5K" },
  { lo:1501,  hi:2500,   label:"$1.5K–2.5K" },
  { lo:2501,  hi:3500,   label:"$2.5K–3.5K" },
  { lo:3501,  hi:5000,   label:"$3.5K–5K" },
  { lo:5001,  hi:7500,   label:"$5K–7.5K" },
  { lo:7501,  hi:10000,  label:"$7.5K–10K" },
  { lo:10001, hi:15000,  label:"$10K–15K" },
  { lo:15001, hi:25000,  label:"$15K–25K" },
  { lo:25001, hi:Infinity, label:"$25K+" },
];

// Pooled / pass-through buckets, in display order. These never belong to an
// attorney — they're firm money that would double-count if credited.
const POOLED_SEGMENTS = ["APP","Registered Agent","Title Pass-through","Referral Income"];

let ROWS = [];
let ROWS_2025 = [];
let role = "orig";              // "orig" | "clos"
let view = "leader";            // "leader" | code
let PINNED = null;              // if set (from feed), lock to this attorney

// ---- helpers (mirror pulse.html) ------------------------------------------
function cleanKey(k){ return String(k).replace(/\s+/g," ").trim().replace(/\.$/,""); }
function normalizeKeys(row){ const o={}; for(const [k,v] of Object.entries(row)) o[cleanKey(k)]=v; return o; }
function extractRows(feed){
  const raw = Array.isArray(feed.entries)?feed.entries : Array.isArray(feed.rows)?feed.rows : [];
  return raw.map(normalizeKeys);
}
function num(v){
  if(v===null||v===undefined||v==="") return 0;
  if(typeof v==="number") return isFinite(v)?v:0;
  const n=parseFloat(String(v).replace(/[$,\s]/g,"")); return isFinite(n)?n:0;
}
function usd0(n){ return "$"+Math.round(n).toLocaleString("en-US"); }
function usdK(n){
  const a=Math.abs(n);
  if(a>=1000000) return (n<0?"-":"")+"$"+(a/1000000).toFixed(2)+"M";
  if(a>=1000)    return (n<0?"-":"")+"$"+Math.round(a/1000)+"K";
  return usd0(n);
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function catOf(row){ return String(row["Category"]||"").trim() || "Uncategorized"; }
function attorneyLabel(code){
  const c=String(code||"").trim().toUpperCase();
  return ATTORNEY_NAMES[c] || OTHER_CODE_NAMES[c] || (c||"Unassigned");
}

function monthIndex(row){
  for(const c of [row["_date"], row["Month"], row["Date Scheduled"]]){
    if(!c) continue;
    if(typeof c==="string"){
      const m=c.match(/^(\d{4})-(\d{2})/); if(m) return parseInt(m[2],10)-1;
      const d=new Date(c); if(!isNaN(d)) return d.getUTCMonth();
    }
  }
  return null;
}
function classify(row){
  const matter=String(row["Matter"]||"").trim();
  const client=String(row["Client"]||"").trim().toLowerCase();
  const ref=String(row["Referral Name"]||"").trim().toLowerCase();
  const pooled = ref==="payments"||ref==="bulk payment";
  if(matter==="APP") return "APP";
  if(matter==="DLF Registered Agent" && pooled) return "Registered Agent";
  if(matter==="DLF Registed Agent" && pooled) return "Registered Agent";
  if(client.includes("dorcey law firm title services")) return "Title Pass-through";
  if(matter==="Referral Fee") return "Referral Income";
  return "New-Matter";
}
function attColOf(row){
  return String(row[role==="orig"?"Originating Attorney":"Closing Attorney"]||"").trim().toUpperCase();
}
function branchOf(row){ return String(row["Branch"]||"").trim() || "Unassigned"; }

// Same-period trim: only keep 2025 months that 2026 already has data for.
// This drives EVERY comparison on the page — headline, quarters, monthly
// chart, categories, offices, leaderboard. One source of truth for "how far
// into the year are we".
function ytdCutoffMonth(){
  let max=-1;
  for(const r of ROWS){ const mi=monthIndex(r); if(mi!==null&&mi>max) max=mi; }
  return max;
}

// Median of a numeric array. Reported alongside the mean because a couple of
// large matters can pull an average well above what a typical file looks
// like — the gap between the two IS the insight.
function median(arr){
  if(!arr.length) return 0;
  const s=[...arr].sort((a,b)=>a-b);
  const m=Math.floor(s.length/2);
  return s.length%2 ? s[m] : (s[m-1]+s[m])/2;
}

// Build a per-attorney stat block for a given month-range [loMonth, hiMonth]
// inclusive (0-based).
//
// Two parallel sets of numbers come out of here:
//   files / total      — EVERY file, including $0 ones. Use for counts.
//   paidFiles / total  — files with a real fee. Use for AVERAGES.
function statBlock(rows, code, loMo, hiMo){
  let total=0, files=0, paidFiles=0, zeroFiles=0;
  let newTotal=0, newFiles=0, newPaidFiles=0;
  const byMonth=new Array(12).fill(0);
  const fees=[];              // positive fees only, for median + distribution
  const cats={};              // cat -> {rev,files,paid}
  const branches={};          // branch -> {rev,files,paid}
  for(const r of rows){
    if(attColOf(r)!==code) continue;
    const mi=monthIndex(r);
    if(mi===null||mi<loMo||mi>hiMo) continue;
    const raw=r["Fee Billed"];
    if(raw===null||raw===undefined||raw==="") continue;
    const fee=num(raw);
    total+=fee; files++; byMonth[mi]+=fee;
    if(fee>0){ paidFiles++; fees.push(fee); } else { zeroFiles++; }

    const seg=classify(r);
    if(seg==="New-Matter"){
      newTotal+=fee; newFiles++;
      if(fee>0) newPaidFiles++;
    }
    const c=catOf(r);
    (cats[c] ??= {rev:0,files:0,paid:0}); cats[c].rev+=fee; cats[c].files++;
    if(fee>0) cats[c].paid++;
    const b=branchOf(r);
    (branches[b] ??= {rev:0,files:0,paid:0}); branches[b].rev+=fee; branches[b].files++;
    if(fee>0) branches[b].paid++;
  }
  return {
    total, files, paidFiles, zeroFiles,
    newTotal, newFiles, newPaidFiles,
    byMonth, cats, branches, fees,
    avgFile: paidFiles ? total/paidFiles : 0,
    avgNew:  newPaidFiles ? newTotal/newPaidFiles : 0,
    medFile: median(fees),
  };
}

// Firm-wide totals for the reconciliation. Deliberately independent of
// statBlock so it can't inherit any per-attorney filtering — it walks every
// row in the window and partitions the same money two ways: by credit code,
// and by revenue segment. Both must sum to the same grand total.
function firmTotals(rows, loMo, hiMo){
  let grand=0, files=0;
  const byCode={};     // credit code -> {rev,files}
  const bySeg={};      // segment -> {rev,files}
  for(const r of rows){
    const mi=monthIndex(r);
    if(mi===null||mi<loMo||mi>hiMo) continue;
    const raw=r["Fee Billed"];
    if(raw===null||raw===undefined||raw==="") continue;
    const fee=num(raw);
    grand+=fee; files++;
    const code=attColOf(r);
    (byCode[code] ??= {rev:0,files:0}); byCode[code].rev+=fee; byCode[code].files++;
    const seg=classify(r);
    (bySeg[seg] ??= {rev:0,files:0}); bySeg[seg].rev+=fee; bySeg[seg].files++;
  }
  return {grand, files, byCode, bySeg};
}

// Money comparison: colour the CURRENT dollar figure (green if up vs last
// year, red if down) and show last year's actual dollars beside it — no
// percentages to decode.
function moneyVs(cur, prev, curStr){
  const shown = curStr !== undefined ? curStr : usd0(cur);
  let cls = "flat";
  if(prev > 0){
    if(cur > prev * 1.0005) cls = "up";
    else if(cur < prev * 0.9995) cls = "down";
  } else if(cur > 0){
    cls = "up";
  }
  const prevNote = prev > 0
    ? `<span class="vs">vs ${usdK(prev)} in ${CONFIG.year-1}</span>`
    : `<span class="vs">no ${CONFIG.year-1} in this period</span>`;
  return { cls, html: `<span class="bigmoney ${cls}">${shown}</span> ${prevNote}` };
}

// ---- boot -----------------------------------------------------------------
load();

async function load(){
  try{
    // The reports feed is a SECURITY BOUNDARY. We fetch from /api/reports-feed,
    // NOT the raw /api/revenue-feed. For a report-only (pinned) attorney the
    // server returns ONLY their own rows and echoes back {pinned:"CODE"} — the
    // client never receives another attorney's data.
    const r=await fetch("/api/reports-feed");
    if(!r.ok) throw new Error("feed returned "+r.status);
    const j=await r.json();
    if(j.error) throw new Error(j.error);
    ROWS=extractRows(j);
    if(j.pinned && ATTORNEY_NAMES[j.pinned]){ PINNED=j.pinned; view=j.pinned; }

    try{
      const r25=await fetch("/api/reports-feed?tab=2025");
      if(r25.ok){ const j25=await r25.json(); if(!j25.error) ROWS_2025=extractRows(j25); }
    }catch(e){}

    render();
  }catch(e){
    document.getElementById("content").innerHTML=`<div class="error">Couldn't reach the revenue feed. (${e.message})</div>`;
    console.error("reports load error:",e);
  }
}

// Which credit codes actually appear. Rollups (ADM) are included and sorted
// last; DLF/APP are excluded here and handled in the reconciliation.
function attorneysPresent(){
  const set=new Set();
  for(const r of ROWS){
    for(const col of ["Originating Attorney","Closing Attorney"]){
      const c=String(r[col]||"").trim().toUpperCase();
      if(c && !EXCLUDED_CODES.has(c) && ATTORNEY_NAMES[c]) set.add(c);
    }
  }
  const list=[...set];
  const people=list.filter(c=>!ROLLUP_CODES.has(c)).sort((a,b)=>attorneyLabel(a).localeCompare(attorneyLabel(b)));
  const rollups=list.filter(c=>ROLLUP_CODES.has(c)).sort((a,b)=>attorneyLabel(a).localeCompare(attorneyLabel(b)));
  return [...people, ...rollups];
}

function render(){
  const cut = ytdCutoffMonth();
  const monthLabel = MONTH_NAMES[cut<0?11:cut];
  document.getElementById("periodLabel").textContent =
    `${CONFIG.year} year-to-date · January through ${monthLabel} · ${role==="orig"?"Originating":"Closing"} attorney`;

  document.getElementById("controls").innerHTML = controlsBar();

  let body;
  if(view==="leader" && !PINNED) body = leaderboardView();
  else body = individualView(view);

  document.getElementById("content").innerHTML = body;
  wire();
}

function controlsBar(){

      <label>Report</label>

        <option value="leader" ${view==="leader"?"selected":""}>Leadership — all attorneys</option>
        <optgroup label="Individual">${opts}</optgroup>

      </div>

      </div>

      </div>
      <div class="stat">
        <div class="k">Typical file (median)</div>
        <div class="v">${usd0(cur.medFile)}</div>
        <div class="d"><span class="vs">half your files are above this</span></div>
      </div>
    </div>

    <div class="sec-label">By quarter · ${CONFIG.year} revenue vs ${CONFIG.year-1}</div>
    <div class="statgrid">
      ${quarters.map(q=>{
        const m=moneyVs(q.c.total, q.p.total);
        return `<div class="stat">
          <div class="k">${esc(q.lab)}</div>
          <div class="v ${m.cls}">${usd0(q.c.total)}</div>

// ---- Fee distribution -----------------------------------------------------
// The price-point breakdown. Shows BOTH file count and total dollars per band,
// because the two tell opposite stories: a tall bar of $500 deeds is a lot of
// files contributing very little money, and seeing only the count would make
// it look like the engine of the practice.
function feeDistribution(s){
  if(!s.fees.length){
    return `<p class="subtle">No billed files in this period.</p>`;
  }

  const buckets = FEE_BANDS.map(b => ({...b, n:0, sum:0}));
  for(const f of s.fees){
    const b = buckets.find(x => f >= x.lo && f <= x.hi);
    if(b){ b.n++; b.sum += f; }
  }

  // Trim empty bands from the outside in, so the chart spans only the range
  // this attorney actually works in. Interior gaps stay — an empty band
  // BETWEEN two populated ones is real information.
  let first = buckets.findIndex(b=>b.n>0);
  let last  = buckets.length - 1 - [...buckets].reverse().findIndex(b=>b.n>0);
  const shown = buckets.slice(first, last+1);

  const maxN = Math.max(...shown.map(b=>b.n), 1);
  const medBand = shown.find(b => s.medFile >= b.lo && s.medFile <= b.hi);

  const bars = shown.map(b=>{
    const h = (b.n / maxN) * 148;
    const isMed = medBand && b.label === medBand.label;
    const pctFiles = (b.n / s.fees.length * 100).toFixed(0);
    const pctRev   = s.total > 0 ? (b.sum / s.total * 100).toFixed(0) : "0";
    return `<div class="dcol ${isMed?"median":""}">
      <span class="dtip">${esc(b.label)} · ${b.n} file${b.n>1?'s':''} (${pctFiles}% of files) · ${usd0(b.sum)} (${pctRev}% of revenue)</span>
      <span class="dn">${b.n}</span>
      <div class="dbar" style="height:${h}px"></div>
    </div>`;
  }).join("");

  const labels = shown.map(b=>
    `<div class="dl">${esc(b.label)}<span class="damt">${b.sum>0?usdK(b.sum):"—"}</span></div>`
  ).join("");

  const busiest = [...shown].sort((a,b)=>b.n-a.n)[0];
  const richest = [...shown].sort((a,b)=>b.sum-a.sum)[0];
  let insight = "";
  if(busiest && richest){
    const busiestRevPct = s.total>0 ? (busiest.sum/s.total*100).toFixed(0) : 0;
    const richestFilePct = (richest.n/s.fees.length*100).toFixed(0);
    if(busiest.label === richest.label){
      insight = `Most of your files <b>and</b> most of your revenue sit in the <b>${esc(busiest.label)}</b> band — ${busiest.n} files producing ${usd0(busiest.sum)}.`;
    } else {
      insight = `Your biggest cluster of files is <b>${esc(busiest.label)}</b> — ${busiest.n} files, but only <b>${busiestRevPct}%</b> of your revenue. Most of the money comes from <b>${esc(richest.label)}</b>: just ${richest.n} file${richest.n>1?'s':''} (${richestFilePct}% of your work) producing ${usd0(richest.sum)}.`;
    }
  }

  const meanVsMed = s.medFile > 0 && s.avgFile > s.medFile * 1.25
    ? ` Your average (${usd0(s.avgFile)}) sits well above your median (${usd0(s.medFile)}), which means a handful of large matters are lifting it — the median is closer to what a typical file looks like.`
    : s.medFile > 0 && s.avgFile < s.medFile * 0.85
    ? ` Your average (${usd0(s.avgFile)}) sits below your median (${usd0(s.medFile)}), which is unusual — worth a look at whether a few very small files are pulling it down.`
    : "";

  const zeroLine = s.zeroFiles
    ? ` <b>${s.zeroFiles}</b> no-charge file${s.zeroFiles>1?'s':''} (refunded or pro bono) ${s.zeroFiles>1?'are':'is'} excluded from this chart and from all averages.`
    : "";

  return `<div class="dist">
    <div class="distkey">
      <div class="item"><span class="sw" style="background:var(--gold)"></span>files in band</div>
      <div class="item"><span class="sw" style="background:var(--navy)"></span>band containing your median</div>
    </div>
    <div class="distbars">${bars}</div>
    <div class="distlabels">${labels}</div>
    <p class="distnote">${insight}${meanVsMed}${zeroLine}</p>
  </div>`;
}

// The receipt: every file crediting `code` in [loMo,hiMo], newest first, with
// an instant client-side search.
function clientLedger(code, loMo, hiMo){
  const items=[];
  for(const r of ROWS){
    if(attColOf(r)!==code) continue;
    const mi=monthIndex(r);
    if(mi===null||mi<loMo||mi>hiMo) continue;
    const raw=r["Fee Billed"];
    if(raw===null||raw===undefined||raw==="") continue;
    items.push({
      date:String(r["_date"]||r["Month"]||"").slice(0,10),
      client:String(r["Client"]||"—").trim()||"—",
      cat:catOf(r),
      matter:String(r["Matter"]||"").trim(),
      fee:num(raw),
    });
  }
  items.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  if(!items.length) return `<p class="subtle">No files in this period.</p>`;

  const rowsHtml=items.map(e=>{
    const type = e.cat && e.cat !== "Uncategorized" ? e.cat : (e.matter || "—");
    const hay=`${e.client} ${type} ${e.matter} ${e.date}`.toLowerCase();
    const feeCls = e.fee < 0 ? "neg" : e.fee === 0 ? "zero" : "";
    return `<div class="lrow" data-s="${esc(hay)}">
      <span class="ld">${esc(e.date||'—')}</span>
      <span class="lc" title="${esc(e.client)}">${esc(e.client)}</span>
      <span class="lm" title="${esc(type)}">${esc(type)}</span>
      <span class="lf ${feeCls}">${usd0(e.fee)}</span>
    </div>`;
  }).join("");

  const zeroCount = items.filter(e=>e.fee===0).length;
  const zeroNote = zeroCount ? ` · ${zeroCount} at no charge` : "";

  return `<input class="lsearch" type="text" placeholder="Search a client or matter type…" autocomplete="off"
    oninput="filterLedger(this)" />
    <div class="ledger">
      <div class="lrow lhead">
        <span class="ld">Date</span><span class="lc">Client</span>
        <span class="lm">Matter type</span><span class="lf">Fee</span>
      </div>
      ${rowsHtml}
    </div>
    <div class="lcount subtle">${items.length} file${items.length>1?'s':''} · ${usd0(items.reduce((s,e)=>s+e.fee,0))} total${zeroNote}</div>`;
}

// Live filter on the ledger (no re-render, keeps focus while typing).
function filterLedger(input){
  const wrap=input.parentElement;
  const q=input.value.trim().toLowerCase();
  wrap.querySelectorAll(".ledger .lrow:not(.lhead)").forEach(el=>{
    el.style.display = (!q || (el.getAttribute("data-s")||"").includes(q)) ? "" : "none";
  });
}

function reportHead(who){
  const d=new Date();
  const stamp=`${MONTH_NAMES[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  return `<div class="rhead">
    <div>
      <h2 class="who">${esc(who)}</h2>
      <div class="lens">${role==="orig"?"Originating":"Closing"}-attorney credit · ${CONFIG.year} year-to-date performance</div>
    </div>
    <div class="firm">Dorcey Law Firm<br>Generated ${stamp}</div>
  </div>`;
}

// Monthly bars, TRUNCATED AT THE YTD CUTOFF. Drawing all twelve months meant
// 2025 showed tall bars for Aug–Dec against nothing in 2026 — which looked
// like a collapse rather than a year still in progress.
function monthlyBars(curArr, prevArr, hiMo){
  const months = MONTH_NAMES.slice(0, hiMo+1);
  const cur = curArr.slice(0, hiMo+1);
  const prev = prevArr.slice(0, hiMo+1);
  const maxV=Math.max(1,...cur,...prev);
  const cols=months.map((nm,i)=>{
    const c=cur[i]||0, p=prev[i]||0;
    const ch=(c/maxV)*130, ph=(p/maxV)*130;
    const yoy = p>0 ? ` (${c>=p?'+':''}${((c-p)/p*100).toFixed(0)}%)` : '';
    return `<div class="col">
      <span class="tip">${nm} · ${CONFIG.year}: ${usdK(c)} · ${CONFIG.year-1}: ${usdK(p)}${yoy}</span>
      <div class="pair">
        <div class="bar prev" style="height:${ph}px"></div>
        <div class="bar cur" style="height:${ch}px"></div>
      </div>
      <div class="lbl">${nm}</div>
    </div>`;
  }).join("");
  const note = hiMo < 11
    ? `<p class="subtle" style="text-align:right;margin-top:-14px">Both years shown January–${MONTH_NAMES[hiMo]} — the year isn't over yet.</p>`
    : "";
  return `<div class="bars">${cols}</div>${note}`;
}

function categoryTable(cur, prev){
  const cats=Object.keys(cur.cats).sort((a,b)=>cur.cats[b].rev-cur.cats[a].rev);
  if(!cats.length) return `<p class="subtle">No files in this period.</p>`;
  const rows=cats.map(c=>{
    const cc=cur.cats[c], pc=prev.cats[c]||{rev:0,files:0,paid:0};
    const avg=cc.paid?cc.rev/cc.paid:0;
    const freeCount = cc.files - cc.paid;
    const freeTag = freeCount ? `<span class="zeroflag"> (${freeCount} free)</span>` : "";
    const cls = pc.rev>0 ? (cc.rev>pc.rev?"up":cc.rev<pc.rev?"down":"flat") : (cc.rev>0?"up":"flat");
    const prevCell = pc.rev>0 ? usd0(pc.rev) : '<span class="flat">—</span>';
    return `<tr>
      <td class="cat-name">${esc(c)}</td>
      <td>${cc.files}${freeTag}</td>
      <td class="${cls}">${usd0(cc.rev)}</td>
      <td>${cc.paid?usd0(avg):'<span class="flat">—</span>'}</td>
      <td>${prevCell}</td>
    </tr>`;
  }).join("");
  const tot=cats.reduce((s,c)=>s+cur.cats[c].rev,0);
  const totF=cats.reduce((s,c)=>s+cur.cats[c].files,0);
  const totPaid=cats.reduce((s,c)=>s+cur.cats[c].paid,0);
  const totPrev=cats.reduce((s,c)=>s+((prev.cats[c]||{rev:0}).rev),0);
  return `<table class="cat">
    <thead><tr><th>Type of work</th><th>Files</th><th>${CONFIG.year} revenue</th><th>Avg fee</th><th>${CONFIG.year-1} revenue</th></tr></thead>
    <tbody>${rows}
      <tr class="totrow"><td>All types</td><td>${totF}</td><td>${usd0(tot)}</td><td>${totPaid?usd0(tot/totPaid):'—'}</td><td>${totPrev>0?usd0(totPrev):''}</td></tr>
    </tbody>
  </table>`;
}

// Office/branch breakdown — for attorneys who split time across locations.
function branchTable(cur, prev){
  const branches=Object.keys(cur.branches).sort((a,b)=>cur.branches[b].rev-cur.branches[a].rev);
  if(!branches.length) return `<p class="subtle">No office data in this period.</p>`;
  if(branches.length===1){
    const b=branches[0], cc=cur.branches[b];
    return `<p class="subtle">All ${cc.files} file${cc.files>1?'s':''} (${usd0(cc.rev)}) came out of <b>${esc(b)}</b>.</p>`;
  }
  const rows=branches.map(b=>{
    const cc=cur.branches[b], pc=(prev.branches&&prev.branches[b])||{rev:0,files:0,paid:0};
    const cls = pc.rev>0 ? (cc.rev>pc.rev?"up":cc.rev<pc.rev?"down":"flat") : (cc.rev>0?"up":"flat");
    const prevCell = pc.rev>0 ? usd0(pc.rev) : '<span class="flat">—</span>';
    return `<tr>
      <td class="cat-name">${esc(b)}</td>
      <td>${cc.files}</td>
      <td class="${cls}">${usd0(cc.rev)}</td>
      <td>${cc.paid?usd0(cc.rev/cc.paid):'<span class="flat">—</span>'}</td>
      <td>${prevCell}</td>
    </tr>`;
  }).join("");
  const tot=branches.reduce((s,b)=>s+cur.branches[b].rev,0);
  const totF=branches.reduce((s,b)=>s+cur.branches[b].files,0);
  const totPaid=branches.reduce((s,b)=>s+cur.branches[b].paid,0);
  const totPrev=branches.reduce((s,b)=>s+(((prev.branches||{})[b]||{rev:0}).rev),0);
  return `<table class="cat">
    <thead><tr><th>Office</th><th>Files</th><th>${CONFIG.year} revenue</th><th>Avg fee</th><th>${CONFIG.year-1} revenue</th></tr></thead>
    <tbody>${rows}
      <tr class="totrow"><td>All offices</td><td>${totF}</td><td>${usd0(tot)}</td><td>${totPaid?usd0(tot/totPaid):'—'}</td><td>${totPrev>0?usd0(totPrev):''}</td></tr>
    </tbody>
  </table>`;
}

// ---- LEADERBOARD ----------------------------------------------------------
function leaderboardView(){
  const cut=ytdCutoffMonth();
  const hi = cut<0?11:cut;
  const monthLabel = MONTH_NAMES[hi];
  const codes=attorneysPresent();

  const rows=codes.map(code=>{
    const ytd=statBlock(ROWS,code,0,hi);
    const ytdp=statBlock(ROWS_2025,code,0,hi); // same span last year
    return {code, ytd, ytdp, isRollup: ROLLUP_CODES.has(code)};
  });

  // People first by revenue, rollups (ADM) last — it isn't a person and
  // shouldn't sort into the middle of an attorney ranking.
  const people = rows.filter(r=>!r.isRollup).sort((a,b)=>b.ytd.total-a.ytd.total);
  const rollups = rows.filter(r=>r.isRollup).sort((a,b)=>b.ytd.total-a.ytd.total);
  const ordered = [...people, ...rollups];

  const body=ordered.map(r=>{
    const cls = r.ytdp.total>0 ? (r.ytd.total>r.ytdp.total?"up":r.ytd.total<r.ytdp.total?"down":"flat") : (r.ytd.total>0?"up":"flat");
    const prevCell = r.ytdp.total>0 ? usd0(r.ytdp.total) : '<span class="flat">—</span>';
    const freeTag = r.ytd.zeroFiles ? `<span class="zeroflag"> (${r.ytd.zeroFiles} free)</span>` : "";
    const rollTag = r.isRollup ? `<span class="rolltag"> · rollup</span>` : "";
    return `<tr class="${r.isRollup?'rollup':''}">
      <td class="cat-name">${esc(attorneyLabel(r.code))}${rollTag}</td>
      <td class="${cls}">${usd0(r.ytd.total)}</td>
      <td>${prevCell}</td>
      <td>${r.ytd.files}${freeTag}</td>
      <td>${usd0(r.ytd.avgFile)}</td>
      <td>${usd0(r.ytd.medFile)}</td>
    </tr>`;
  }).join("");

  const tYtd=ordered.reduce((s,r)=>s+r.ytd.total,0);
  const tYtdp=ordered.reduce((s,r)=>s+r.ytdp.total,0);
  const tF=ordered.reduce((s,r)=>s+r.ytd.files,0);
  const tPaid=ordered.reduce((s,r)=>s+r.ytd.paidFiles,0);
  const tZero=ordered.reduce((s,r)=>s+r.ytd.zeroFiles,0);
  const allFees=ordered.reduce((a,r)=>a.concat(r.ytd.fees),[]);
  const totCls = tYtdp>0 ? (tYtd>tYtdp?"up":tYtd<tYtdp?"down":"flat") : "flat";

  // Firm-wide office rollup: merge every attorney's branch stats.
  function mergeBranches(list, pick){
    const out={};
    for(const r of list){
      const src=pick(r).branches||{};
      for(const b in src){
        (out[b] ??= {rev:0,files:0,paid:0});
        out[b].rev+=src[b].rev; out[b].files+=src[b].files; out[b].paid+=(src[b].paid||0);
      }
    }
    return out;
  }
  const firmCur={branches:mergeBranches(ordered,r=>r.ytd)};
  const firmPrev={branches:mergeBranches(ordered,r=>r.ytdp)};
  const officeBlock = Object.keys(firmCur.branches).length
    ? `<div class="sec-label">Revenue by office · firm-wide</div>${branchTable(firmCur, firmPrev)}`
    : "";

  const firmDist = allFees.length
    ? `<div class="sec-label">Where the firm's fees land · ${CONFIG.year} year-to-date</div>
       ${feeDistribution({fees:allFees, total:tYtd, avgFile:tPaid?tYtd/tPaid:0,
                          medFile:median(allFees), zeroFiles:tZero})}`
    : "";

  const zeroLine = tZero
    ? ` ${tZero} no-charge file${tZero>1?'s':''} (refunded or pro bono) ${tZero>1?'are':'is'} counted in Files but excluded from the averages.`
    : "";

  return `<div class="report leaderboard">
    ${reportHead("Leadership Summary — All Attorneys")}
    <div class="sec-label">${CONFIG.year} year-to-date · January through ${monthLabel} · ranked by revenue</div>
    <table class="cat">
      <thead><tr>
        <th>Attorney</th><th>${CONFIG.year} revenue</th><th>${CONFIG.year-1} revenue</th>
        <th>Files closed</th><th>Avg / file</th><th>Median file</th>
      </tr></thead>
      <tbody>${body}
        <tr class="totrow">
          <td>Attorney-credited</td><td class="${totCls}">${usd0(tYtd)}</td><td>${tYtdp>0?usd0(tYtdp):''}</td>
          <td>${tF}</td><td>${tPaid?usd0(tYtd/tPaid):'—'}</td><td>${usd0(median(allFees))}</td>
        </tr>
      </tbody>
    </table>
    <p class="subtle" style="margin-top:10px">Credit by <b>${role==="orig"?"originating":"closing"} attorney</b>.
    Green means ahead of last year, red means behind — the ${CONFIG.year-1} column shows the same months for comparison.
    <b>Median</b> is the midpoint file: when it sits well below the average, a few large matters are lifting that average.${zeroLine}
    Pick an individual from the dropdown for their full scorecard, fee distribution, and file list.</p>

    ${reconciliation(hi, tYtd, monthLabel)}
    ${firmDist}
    ${officeBlock}
    <div class="footer-note">Live from the ${CONFIG.year} Clients sheet · toggle Originating/Closing above ·
    every figure covers January–${monthLabel} ${CONFIG.year}.</div>
  </div>`;
}

// ---- RECONCILIATION -------------------------------------------------------
// Why the attorney table doesn't equal the Pulse's total revenue, stated in
// dollars rather than left as a mystery. Two partitions of the same money:
// by who gets credit, and by what kind of revenue it is. Both must land on
// the same grand total, and the page says so out loud.
function reconciliation(hi, attorneyCredited, monthLabel){
  const f = firmTotals(ROWS, 0, hi);

  // Credit codes that aren't in the attorney table.
  const otherCodes = Object.keys(f.byCode)
    .filter(c => EXCLUDED_CODES.has(c))
    .sort((a,b) => f.byCode[b].rev - f.byCode[a].rev);
  const otherTotal = otherCodes.reduce((s,c)=>s+f.byCode[c].rev, 0);

  const otherRows = otherCodes.map(c => `
    <div class="rr sub">
      <span class="rl">${esc(attorneyLabel(c))}<small>${f.byCode[c].files} file${f.byCode[c].files>1?'s':''} — not credited to an individual</small></span>
      <span class="rv">${usd0(f.byCode[c].rev)}</span>
    </div>`).join("");

  // Segment view of the same money.
  const newMatter = f.bySeg["New-Matter"] ? f.bySeg["New-Matter"].rev : 0;
  const pooledRows = POOLED_SEGMENTS
    .filter(s => f.bySeg[s] && f.bySeg[s].rev !== 0)
    .map(s => `
      <div class="rr sub">
        <span class="rl">${esc(s)}<small>${f.bySeg[s].files} entr${f.bySeg[s].files>1?'ies':'y'}</small></span>
        <span class="rv">${usd0(f.bySeg[s].rev)}</span>
      </div>`).join("");
  const pooledTotal = POOLED_SEGMENTS.reduce((s,k)=> s + (f.bySeg[k] ? f.bySeg[k].rev : 0), 0);

  // Does the attorney table plus the excluded codes actually equal the total?
  const sum = attorneyCredited + otherTotal;
  const diff = f.grand - sum;
  const balanced = Math.abs(diff) < 1;

  const checkLine = balanced
    ? `<div class="check ok">✓ Balances. Attorney-credited revenue plus the codes above equals <b>${usd0(f.grand)}</b> — the same total the Pulse reports for January–${esc(monthLabel)}.</div>`
    : `<div class="check off">⚠ Off by ${usd0(Math.abs(diff))}. Some rows carry a credit code that isn't in either group above — most often a blank or misspelled attorney code on the sheet. Worth a look at the ${CONFIG.year} Clients tab.</div>`;

  return `
    <div class="sec-label">Reconciliation · how this adds up to firm revenue</div>
    <p class="subtle" style="margin-bottom:10px">The attorney table above deliberately leaves out house and bulk-billed money, so it won't match the Pulse on its own. Here's the rest of it.</p>
    <div class="recon">
      <div class="rr">
        <span class="rl">Attorney-credited revenue<small>everyone in the table above, including rollups</small></span>
        <span class="rv">${usd0(attorneyCredited)}</span>
      </div>
      ${otherRows}
      <div class="rr grand">
        <span class="rl">Firm total · January–${esc(monthLabel)} ${CONFIG.year}</span>
        <span class="rv">${usd0(f.grand)}</span>
      </div>
      ${checkLine}
    </div>

    <p class="subtle" style="margin:16px 0 8px">The same money, split by what kind of revenue it is rather than who closed it:</p>
    <div class="recon">
      <div class="rr">
        <span class="rl">New-matter revenue<small>real client work — the honest growth number</small></span>
        <span class="rv">${usd0(newMatter)}</span>
      </div>
      <div class="rr">
        <span class="rl">Pooled &amp; pass-through<small>firm money that isn't attributable to one attorney</small></span>
        <span class="rv">${usd0(pooledTotal)}</span>
      </div>
      ${pooledRows}
      <div class="rr grand">
        <span class="rl">Firm total · January–${esc(monthLabel)} ${CONFIG.year}</span>
        <span class="rv">${usd0(f.grand)}</span>
      </div>
    </div>`;
}

// ---- interactions ---------------------------------------------------------
function wire(){
  const sel=document.getElementById("viewSel");
  if(sel) sel.onchange=()=>{ view=sel.value; render(); };
  document.querySelectorAll("#roleTog button").forEach(b=>{
    b.onclick=()=>{ role=b.getAttribute("data-r"); render(); };
  });
}
</script>
