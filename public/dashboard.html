<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dorcey · Weekly Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --navy:#0f1f3a; --navy-2:#16294b; --gold:#c9a14a; --gold-soft:#e7d3a1;
    --parchment:#f6f1e4; --ink:#1b1b1b; --muted:#7d7666; --line:#e3dcc9;
    --up:#2f7d57; --down:#b04a3a; --shadow:0 16px 38px -22px rgba(15,31,58,.4);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Libre Franklin",system-ui,sans-serif;background:var(--parchment);color:var(--ink);-webkit-font-smoothing:antialiased}
  a{color:inherit}

  header.masthead{background:linear-gradient(155deg,var(--navy),var(--navy-2));color:var(--parchment);
    padding:26px 32px;border-bottom:3px solid var(--gold)}
  .eyebrow{font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--gold-soft);font-weight:600}
  .masthead h1{font-family:"Playfair Display",serif;font-weight:700;margin:.2rem 0 .1rem;font-size:1.9rem}
  .masthead .sub{color:#c7cfdd;font-size:.9rem}
  .masthead .nav{float:right;font-size:.8rem;color:var(--gold-soft);text-decoration:none}

  .wrap{max-width:1100px;margin:0 auto;padding:24px 20px 80px}

  /* firm summary band */
  .band{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 22px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
  .stat .k{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .stat .v{font-family:"Playfair Display",serif;font-size:2rem;color:var(--navy);line-height:1.1;margin-top:4px}
  .stat .d{font-size:.8rem;margin-top:3px}
  .up{color:var(--up);font-weight:700}.down{color:var(--down);font-weight:700}.flat{color:var(--muted)}

  .toolbar{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px;flex-wrap:wrap;gap:10px}
  .toggle{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow)}
  .toggle button{border:0;background:transparent;padding:9px 16px;border-radius:8px;cursor:pointer;
    font:600 .85rem "Libre Franklin",sans-serif;color:var(--muted)}
  .toggle button[aria-selected="true"]{background:var(--navy);color:#fff}
  .weeklbl{color:var(--muted);font-size:.85rem}.weeklbl b{color:var(--navy)}

  .group{margin:22px 0 8px;font-family:"Playfair Display",serif;color:var(--navy);font-size:1.15rem;
    border-bottom:1px solid var(--line);padding-bottom:6px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .12s,box-shadow .12s}
  .card:hover{transform:translateY(-2px);box-shadow:0 22px 44px -22px rgba(15,31,58,.5)}
  .card .nm{font-weight:700;color:var(--navy);font-size:1rem}
  .card .loc{font-size:.74rem;color:var(--muted)}
  .card .row{display:flex;align-items:flex-end;justify-content:space-between;margin-top:10px}
  .bignum{font-family:"Playfair Display",serif;font-size:2.1rem;color:var(--navy);line-height:1}
  .delta{font-size:.8rem;margin-left:6px}
  .spark{margin-top:10px}
  .pending{display:inline-block;margin-top:10px;font-size:.74rem;color:#b58900;background:#fbf3da;
    border:1px solid #ecdca0;border-radius:7px;padding:3px 8px;font-weight:600}
  .detail{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;display:none}
  .card.open .detail{display:block}
  .detail .f{display:flex;justify-content:space-between;font-size:.82rem;padding:3px 0}
  .detail .f .lab{color:var(--muted)}.detail .f .val{font-weight:700;color:var(--navy)}
  .hint{font-size:.7rem;color:#b9b09a;margin-top:8px}
  .loading{padding:80px;text-align:center;color:var(--muted)}

  /* View switcher (Scorecards / Compliance) */
  .viewswitch{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:5px;box-shadow:var(--shadow);margin-bottom:6px}
  .viewswitch button{border:0;background:transparent;padding:9px 18px;border-radius:8px;cursor:pointer;
    font:700 .9rem "Libre Franklin",sans-serif;color:var(--muted)}
  .viewswitch button[aria-selected="true"]{background:var(--gold);color:var(--navy)}

  /* Compliance table */
  .comptable{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .comprow{display:grid;grid-template-columns:1.6fr 1fr .8fr 1.4fr;gap:10px;align-items:center;
    padding:11px 16px;border-bottom:1px solid var(--line);font-size:.9rem}
  .comprow:last-child{border-bottom:0}
  .comphead{background:#faf7ef;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .cname b{color:var(--navy)} .cname .who{color:var(--muted);font-size:.82rem}
  .clast{color:var(--muted)}
  .badge2{font-size:.74rem;font-weight:700;padding:3px 9px;border-radius:7px;white-space:nowrap}
  .badge2.ok{background:#e7f3ec;color:var(--up)}
  .badge2.warn{background:#fbf3da;color:#9a7a13}
  .badge2.bad{background:#f7e3df;color:var(--down)}
  .cdots{display:flex;gap:4px;flex-wrap:wrap}
  .cdots .dot{width:13px;height:13px;border-radius:3px;background:#eee;border:1px solid var(--line)}
  .cdots .dot.on{background:var(--up);border-color:var(--up)}
  @media(max-width:680px){
    .band{grid-template-columns:repeat(2,1fr)}.masthead{padding:22px 20px}
    .comprow{grid-template-columns:1.4fr 1fr;gap:6px}.clast,.cdots{display:none}
  }
</style>
</head>
<body>
  <header class="masthead">
    <a class="nav" href="/admin">Admin / Links →</a>
    <div class="eyebrow">Dorcey Law Firm · Leadership</div>
    <h1>Weekly Pulse</h1>
    <div class="sub">Where the firm stands — and which way it's moving.</div>
  </header>

  <div class="wrap">
    <div id="content"><div class="loading">Pulling the firm's numbers…</div></div>
  </div>

<script>
let DATA=null, period="F", view="scores";  // F=Actuals default; view=scores|compliance
const $=(s)=>document.querySelector(s);
const FAMS=[["A","Attorneys"],["B","Probate / TA Specialists"],["C","Departments"],["D","Trackers"],["?","Other"],["-","Other"]];

function fmtWeek(iso){const d=new Date(iso+"T00:00:00");return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});}
function deltaTag(now,prev){
  const d=now-prev;
  if(d===0) return `<span class="delta flat">– flat</span>`;
  return `<span class="delta ${d>0?"up":"down"}">${d>0?"▲":"▼"} ${Math.abs(d)}</span>`;
}
function sparkline(vals){
  const w=150,h=34,p=3; const max=Math.max(1,...vals);
  const step=(w-p*2)/Math.max(1,vals.length-1);
  const pts=vals.map((v,i)=>`${(p+i*step).toFixed(1)},${(h-p-(v/max)*(h-p*2)).toFixed(1)}`).join(" ");
  const last=vals[vals.length-1], lx=p+(vals.length-1)*step, ly=h-p-(last/max)*(h-p*2);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">
    <polyline fill="none" stroke="var(--gold)" stroke-width="2" stroke-linejoin="round" points="${pts}"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="2.6" fill="var(--navy)"/></svg>`;
}

async function load(){
  const r=await fetch("/api/dashboard");
  if(!r.ok){ $("#content").innerHTML="<div class='loading'>Leadership view only — sign in as an admin.</div>"; return; }
  DATA=await r.json();
  render();
}

function viewSwitcher(){
  return `<div class="viewswitch" id="vsw">
    <button data-v="scores" role="tab">📊 Scorecards</button>
    <button data-v="compliance" role="tab">✅ Compliance</button>
  </div>`;
}
function wireSwitcher(){
  document.querySelectorAll("#vsw button").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.v===view);
    b.onclick=()=>{ view=b.dataset.v; render(); };
  });
}

function render(){
  if(view==="compliance"){
    $("#content").innerHTML = viewSwitcher() + renderCompliance();
    wireSwitcher();
    return;
  }
  const u=DATA.users;
  const key=period==="F"?"F":"M";
  const totalNow=u.reduce((s,x)=>s+x.thisWeek[key].total,0);
  const reported=u.filter(x=>x.thisWeek[key].submitted).length;
  // firm trend: this week vs last week, summed across everyone
  const idx=DATA.weeks.length-1;
  const firmSeries=DATA.weeks.map((_,i)=>u.reduce((s,x)=>s+(key==="F"?x.history[i].fTotal:x.history[i].mTotal),0));
  const firmPrev=firmSeries[idx-1]||0;

  const band=`
    <div class="band">
      <div class="stat"><div class="k">Reported this week</div>
        <div class="v">${reported}<span style="font-size:1rem;color:var(--muted)"> / ${u.length}</span></div>
        <div class="d ${reported>=u.length?'up':'flat'}">${period==="F"?"Friday actuals in":"Monday forecasts in"}</div></div>
      <div class="stat"><div class="k">Firm ${period==="F"?"output":"forecast"} total</div>
        <div class="v">${totalNow}</div><div class="d">${deltaTag(firmSeries[idx],firmPrev)} vs last week</div></div>
      <div class="stat"><div class="k">8-week trend</div>
        <div style="margin-top:6px">${sparkline(firmSeries)}</div></div>
      <div class="stat"><div class="k">Week of</div>
        <div class="v" style="font-size:1.5rem">${fmtWeek(DATA.thisWeek)}</div>
        <div class="d flat">${period==="F"?"Actuals view":"Forecast view"}</div></div>
    </div>`;

  const toolbar=`
    <div class="toolbar">
      <div class="toggle" id="tog">
        <button data-p="F" role="tab">Actuals (Fri)</button>
        <button data-p="M" role="tab">Forecast (Mon)</button>
      </div>
      <span class="weeklbl">Click any card for the full breakdown</span>
    </div>`;

  let groups="";
  for(const [fam,label] of FAMS){
    const members=u.filter(x=>x.family===fam);
    if(!members.length) continue;
    if(fam==="-"&&members.length===0) continue;
    groups+=`<div class="group">${label}</div><div class="cards">`+
      members.map(x=>card(x,key)).join("")+`</div>`;
  }

  $("#content").innerHTML=viewSwitcher()+band+toolbar+groups;
  wireSwitcher();
  document.querySelectorAll("#tog button").forEach(b=>{
    b.setAttribute("aria-selected", b.dataset.p===period);
    b.onclick=()=>{period=b.dataset.p;render();};
  });
  document.querySelectorAll(".card").forEach(c=>c.onclick=()=>c.classList.toggle("open"));
}

function weeksBetween(aIso,bIso){
  return Math.round((new Date(bIso+"T00:00:00")-new Date(aIso+"T00:00:00"))/(7*86400000));
}

function renderCompliance(){
  const u=DATA.users.map(x=>({...x, wAgo: x.lastReported ? weeksBetween(x.lastReported, DATA.thisWeek) : null}));
  const upToDate=u.filter(x=>x.wAgo===0).length;
  const never=u.filter(x=>x.wAgo===null).length;
  const behind=u.length-upToDate-never;
  // worst first: never at top, then most weeks behind
  u.sort((a,b)=>(b.wAgo===null?9999:b.wAgo)-(a.wAgo===null?9999:a.wAgo));

  const band=`<div class="band">
    <div class="stat"><div class="k">Up to date this week</div>
      <div class="v">${upToDate}<span style="font-size:1rem;color:var(--muted)"> / ${u.length}</span></div>
      <div class="d ${upToDate>=u.length?'up':'flat'}">reported this week</div></div>
    <div class="stat"><div class="k">Behind</div>
      <div class="v" style="color:${behind?'var(--down)':'var(--navy)'}">${behind}</div>
      <div class="d flat">missed this week</div></div>
    <div class="stat"><div class="k">Never reported</div>
      <div class="v" style="color:${never?'var(--down)':'var(--navy)'}">${never}</div>
      <div class="d flat">no entries yet</div></div>
    <div class="stat"><div class="k">Week of</div>
      <div class="v" style="font-size:1.5rem">${fmtWeek(DATA.thisWeek)}</div>
      <div class="d flat">Compliance view</div></div>
  </div>`;

  const head=`<div class="comprow comphead">
    <div class="cname">Who</div><div class="cstatus">Status</div>
    <div class="clast">Last reported</div><div class="cdots">Recent weeks →</div></div>`;
  const rows=u.map(x=>{
    let badge, cls;
    if(x.wAgo===null){ badge="Never reported"; cls="bad"; }
    else if(x.wAgo===0){ badge="Up to date"; cls="ok"; }
    else { badge=`${x.wAgo} wk${x.wAgo>1?"s":""} behind`; cls=x.wAgo>=3?"bad":"warn"; }
    const last=x.lastReported?fmtWeek(x.lastReported):"—";
    const dots=x.history.map(h=>`<span class="dot ${h.reported?"on":""}" title="${fmtWeek(h.week)}"></span>`).join("");
    return `<div class="comprow">
      <div class="cname"><b>${x.name}</b>${x.person?` <span class="who">(${x.person})</span>`:""}</div>
      <div class="cstatus"><span class="badge2 ${cls}">${badge}</span></div>
      <div class="clast">${last}</div>
      <div class="cdots">${dots}</div></div>`;
  }).join("");

  return band+`<div class="group">Who's behind — most overdue at the top</div>
    <div class="comptable">${head}${rows}</div>
    <div class="hint">Each square = one of the last 8 weeks. Filled = reported, empty = missed. Hover a square for its date.</div>`;
}

function card(x,key){
  const cur=x.thisWeek[key];
  const series=x.history.map(h=>key==="F"?h.fTotal:h.mTotal);
  const idx=series.length-1;
  const body = cur.submitted
    ? `<div class="row"><div class="bignum">${cur.total}${deltaTag(series[idx],series[idx-1]||0)}</div></div>
       ${sparkline(series)}
       <div class="detail">${cur.fields.map(f=>`<div class="f"><span class="lab">${f.label}</span><span class="val">${f.value}</span></div>`).join("")}</div>`
    : `<div class="pending">Not reported yet</div>${sparkline(series)}`;
  return `<div class="card">
    <div class="nm">${x.name}</div>
    <div class="loc">${x.templateLabel}${x.location?" · "+x.location:""}</div>
    ${body}</div>`;
}

load();
</script>
</body>
</html>
